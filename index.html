{ id: "dc-discovery", topic: "disc", title: "Discovery interviews and workflow shadowing", mins: 50,
  body: `
<p>Discovery decides whether you build the right thing. Customers describe solutions ("we need a chatbot"); your job is to uncover the problem ("agents spend 12 minutes finding the right policy for each loan query").</p>
<p><b>Before the meeting:</b> research the company, industry, recent news, and the stakeholders' roles. Prepare hypotheses and questions.</p>
<p><b>Good discovery questions:</b></p>
<ul><li>"Walk me through the last time you did this, step by step." (real past behaviour, not opinions)</li>
<li>"Where does it take the longest? What goes wrong?"</li>
<li>"How do you measure this today? What's the current number?"</li>
<li>"What have you already tried? Why didn't it work?"</li>
<li>"If this worked perfectly, what would change for you? For your boss?"</li>
<li>"Who else is involved? Who decides? Who could block it?"</li>
<li>"What data and systems are involved? Can we see a sample?"</li></ul>
<p><b>Avoid:</b> leading questions ("wouldn't AI make this faster?"), pitching instead of listening, and hypotheticals ("would you use...?"), which get polite yeses.</p>
<p><b>Shadowing</b> (watching someone do the work, screen-share or in person) reveals what interviews miss: workarounds, copy-pasting between five systems, tribal knowledge, exceptions. Ask to shadow 2-3 real users for an hour each.</p>
<p><b>After:</b> write a discovery summary within 24 hours: the problem in their words, current process, pain points with numbers, data/systems, stakeholders, constraints, open questions, and a proposed next step. Send it back to confirm you understood.</p>`,
  watch: [V("The Mom Test summary", "the mom test book summary customer interviews"), V("Discovery call best practices for technical teams", "technical discovery call best practices"), V("Customer interview techniques", "customer discovery interview techniques")],
  cheat: `<pre>Goal: problem + current process + numbers + people + data + constraints
Ask about the PAST: "Walk me through the last time you..."
Quantify: time per task, volume/day, error rate, cost, backlog
Probe: "Why?" x3 ; "What did you try?" ; "What happens if nothing changes?"
People: users | champion | decision maker (budget) | blockers (IT/security/legal)
Data: systems of record, sample exports, access process
Shadow 2-3 users: watch workarounds, copy-paste, exceptions
Avoid: leading questions, pitching, hypotheticals
Send a written summary within 24h and ask them to correct it</pre>`,
  tips: ["Talk less than 30% of the time in discovery.", "Ask for numbers every time someone says 'a lot' or 'slow'.", "Ask to see the actual screen and data; descriptions hide the mess.", "The written summary is your first deliverable; it builds trust and catches misunderstandings."],
  qs: [
    { q: "Which is the strongest discovery question?", o: ["'Walk me through the last time you handled a loan query.'", "'Wouldn't AI make this faster?'", "'Would you use a chatbot?'", "'Do you like our product?'"], a: 0, why: "Specific past behaviour reveals the real process and pain." },
    { q: "A manager says approvals are 'really slow'. Best follow-up?", o: ["'How long does one take today, and how many per week?'", "'We'll fix it with AI.'", "'OK.'", "'Is that bad?'"], a: 0, why: "Numbers turn pain into a baseline for measuring success." },
    { q: "Why shadow users in addition to interviewing them?", o: ["You see workarounds and exceptions people don't mention", "It's faster than interviews", "Users prefer it", "It replaces data access"], a: 0, why: "People forget or normalise the messy parts of their work." },
    { q: "What should follow a discovery session within a day?", o: ["A written summary sent back for correction", "A finished product", "A price increase", "Nothing"], a: 0, why: "It confirms understanding and creates a shared record." },
  ],
  scen: [{ t: "Mock discovery", d: "Ask a friend in any job (a shopkeeper, teacher, accountant) for a 20-minute discovery interview about one annoying task. Use only past-behaviour questions. Write the one-page summary with numbers and send it to them for correction." }],
  where: [["The Mom Test (book site)", "https://www.momtestbook.com/", "How to ask questions that get honest answers"], ["Otter.ai", "https://otter.ai/", "Transcribe practice interviews (with permission)"]] },

{ id: "dc-stakeholders", topic: "disc", title: "Stakeholder mapping", mins: 40,
  body: `
<p>Projects succeed or die based on people, not models. Map who matters early.</p>
<table class="ops"><tr><td><b>Economic buyer</b></td><td>controls budget; cares about ROI, risk, strategic goals</td></tr>
<tr><td><b>Champion</b></td><td>wants this to succeed internally; opens doors, gives honest feedback</td></tr>
<tr><td><b>End users</b></td><td>do the daily work; care about ease, speed, not looking foolish</td></tr>
<tr><td><b>Technical owners</b></td><td>IT, platform, data teams; care about integration, maintenance, standards</td></tr>
<tr><td><b>Gatekeepers / blockers</b></td><td>security, legal, compliance, procurement, works councils/unions; care about risk</td></tr>
<tr><td><b>Influencers</b></td><td>respected people whose opinion sways others</td></tr></table>
<p><b>Power-interest grid:</b> high power + high interest → manage closely (regular updates, involve in decisions); high power + low interest → keep satisfied (short, outcome-focused updates); low power + high interest → keep informed; low power + low interest → monitor.</p>
<p><b>Tactics:</b></p>
<ul><li>Meet security and IT <b>early</b>; bring them a clear architecture and data-flow diagram. Surprises create blockers.</li>
<li>Arm your champion with materials to sell internally: a one-page brief, demo video, numbers.</li>
<li>Win end users by solving their pain, involving them in testing, and making them look good.</li>
<li>Translate for each audience: executives hear outcomes and risk; engineers hear architecture; users hear workflow changes.</li>
<li>Watch for silent blockers: people who agree in meetings but slow things down. Ask your champion who might resist and why.</li></ul>`,
  watch: [V("Stakeholder mapping explained", "stakeholder mapping power interest grid"), V("How to find a champion in enterprise deals", "enterprise sales champion building")],
  cheat: `<pre>Roles: economic buyer | champion | users | tech owners | gatekeepers | influencers
Grid: power x interest -> manage closely | keep satisfied | keep informed | monitor
For each person: goal, fear, what success looks like, preferred channel, cadence
Early: security + IT with architecture + data-flow diagrams
Champion kit: 1-page brief, demo video, metrics, FAQ for objections
Translate: exec = outcome + risk | eng = design | users = workflow
Ask champion: "Who could slow this down, and why?"</pre>`,
  tips: ["Write down each stakeholder's personal win, not just the company's.", "A project without a champion is at risk; if you lose yours, find another fast.", "Security reviews go faster when you arrive with the answers already written.", "End users' trust is earned in the first week of the pilot; fix their small annoyances fast."],
  qs: [
    { q: "Who is the 'economic buyer'?", o: ["The person who controls the budget and final approval", "The most junior user", "The model provider", "The FDE"], a: 0, why: "They decide whether to fund and continue the project." },
    { q: "When should you involve the customer's security team?", o: ["Early, with architecture and data-flow diagrams", "After launch", "Never", "Only if they ask"], a: 0, why: "Late security involvement is the most common cause of delays." },
    { q: "A stakeholder has high power but low interest. How do you manage them?", o: ["Keep them satisfied with brief, outcome-focused updates", "Daily detailed emails", "Ignore them", "Invite them to every standup"], a: 0, why: "Respect their time while keeping them supportive." },
    { q: "What helps a champion sell the project internally?", o: ["A one-page brief, a demo video and clear numbers", "Your source code", "A long technical manual only", "Nothing"], a: 0, why: "Champions need portable, persuasive material." },
  ],
  scen: [{ t: "Map a real org", d: "Pick a project from your current or past job. Build a stakeholder map: each person's role, goal, fear, power/interest position and your plan for them. Identify one likely blocker and how you'd win them over." }],
  where: [["Miro templates", "https://miro.com/templates/stakeholder-map/", "Stakeholder map template"], ["Excalidraw", "https://excalidraw.com/", "Quick power-interest grid"]] },

{ id: "dc-metrics", topic: "disc", title: "Success metrics, baselines and ROI", mins: 45,
  body: `
<p>If you can't measure it, you can't prove it worked, and renewals and expansions depend on proof. Define metrics during scoping, not after.</p>
<p><b>Three layers of metrics:</b></p>
<table class="ops"><tr><td><b>Business outcome</b></td><td>what the executive cares about: cost per ticket, revenue, cycle time, customer satisfaction, compliance errors</td></tr>
<tr><td><b>Operational</b></td><td>how the work changes: minutes per case, cases per agent per day, deflection rate, escalation rate, first-contact resolution</td></tr>
<tr><td><b>System quality</b></td><td>model/system behaviour: accuracy on golden set, faithfulness, latency, uptime, cost per request</td></tr></table>
<p><b>Baseline first:</b> measure the current state before the pilot (time studies, ticket system reports, sampling). Without a baseline, "40% faster" is a guess.</p>
<p><b>Good metric properties:</b> specific, measurable from existing data, tied to what the buyer cares about, with a target and timeframe. Example: "Reduce average handling time for KYC-update tickets from 14 to 9 minutes for the 40 pilot agents within 6 weeks, with quality audit scores unchanged."</p>
<p><b>Guardrail metrics</b> make sure you didn't trade one thing for another: quality scores, error rates, customer complaints, agent satisfaction.</p>
<p><b>Simple ROI:</b> (time saved per task × tasks per year × loaded cost per hour) + other savings − (licence + infrastructure + model + support costs). Show assumptions openly and use conservative numbers.</p>
<p><b>Adoption</b> is its own metric: weekly active users, tasks done with the tool vs without. An accurate tool nobody uses delivers zero value.</p>`,
  watch: [V("How to measure ROI of AI projects", "how to measure roi of ai projects"), V("North star metric explained", "north star metric explained")],
  cheat: `<pre>Layers: business outcome > operational > system quality (+ guardrail metrics)
Baseline BEFORE the pilot (reports, time studies, samples)
Metric template: [verb] [metric] from [baseline] to [target] for [scope] by [date],
                 while [guardrail] stays [level]
Examples: handling time, deflection %, escalation %, backlog, CSAT, error rate
ROI = time saved x volume x cost/hr + other savings - total cost of solution
Adoption: WAU, % of eligible tasks done with the tool
Show assumptions; prefer conservative estimates</pre>`,
  tips: ["No baseline, no proof. Measure the 'before' in week one.", "Pick one primary metric the executive will repeat to their boss.", "Always pair a speed metric with a quality guardrail.", "Report adoption weekly; it's the earliest warning sign."],
  qs: [
    { q: "Why measure a baseline before the pilot starts?", o: ["So improvements can be proven against the real starting point", "Baselines are required by law", "To delay the project", "To test the model"], a: 0, why: "Before/after comparison needs a 'before'." },
    { q: "Which is the best success metric?", o: ["Reduce average KYC ticket handling time from 14 to 9 minutes for pilot agents in 6 weeks, with audit scores unchanged", "Make support better with AI", "Use the latest model", "Increase AI usage"], a: 0, why: "Specific, measurable, time-bound, with a quality guardrail." },
    { q: "What is a guardrail metric?", o: ["A metric that must not get worse while you improve the primary one", "A security setting", "A model parameter", "A UI element"], a: 0, why: "It prevents gaming speed at the expense of quality." },
    { q: "The tool is accurate but only 10% of agents use it. What's the problem?", o: ["Adoption; value isn't realised without usage", "Nothing; accuracy is what matters", "The model is too small", "The baseline"], a: 0, why: "Unused tools deliver no business outcome." },
  ],
  scen: [{ t: "ROI model", d: "For a support-triage pilot (200 agents, 3,000 tickets/day, 6 minutes saved on 30% of tickets, ₹600/hour loaded cost), build a one-sheet ROI with assumptions, costs and a conservative/expected/optimistic range." }],
  where: [["Google Sheets", "https://sheets.google.com/", "Build the ROI model with visible assumptions"], ["Anthropic customer stories", "https://www.anthropic.com/customers", "See how outcomes are reported"]] },

{ id: "dc-scope", topic: "disc", title: "Scoping pilots, saying no, and estimating", mins: 50,
  body: `
<p>Scoping turns discovery into a plan everyone signs up to. It's where FDEs protect the project from its biggest killer: too much ambition.</p>
<p><b>A pilot scope document (one or two pages):</b></p>
<ul><li><b>Problem and goal</b> in the customer's words, with the success metric and baseline.</li>
<li><b>In scope</b>: one workflow, one user group, named systems, languages, volumes.</li>
<li><b>Out of scope</b> (explicitly): other departments, write-back to systems, mobile, etc.</li>
<li><b>Deliverables</b> and <b>milestones</b> (week by week).</li>
<li><b>Dependencies</b>: data access, accounts, security approvals, SME time. With owners and dates.</li>
<li><b>Assumptions and risks</b>, with mitigations.</li>
<li><b>Acceptance criteria</b> and the eval approach.</li>
<li><b>Decision point</b>: what happens after the pilot (expand, adjust, stop).</li></ul>
<p><b>Saying no (or "not yet"):</b> when a request would break the timeline or risk quality, acknowledge it, explain the trade-off, and offer options: "We can add the Hindi interface, but it moves go-live by two weeks. Or we launch English first and add Hindi in phase 2. Which do you prefer?" Put changes through a simple change log.</p>
<p><b>Estimating:</b> break work into tasks of at most 1-2 days; estimate ranges (best/likely/worst); add explicit buffer for integration and access delays (they're always slower than coding); re-estimate weekly and communicate changes early.</p>
<p><b>Commercial context:</b> scope often becomes a <b>Statement of Work (SOW)</b>. Know the basics: fixed scope vs time-and-materials, what counts as a change request.</p>`,
  watch: [V("How to scope a software project", "how to scope a software project"), V("How to say no to stakeholders", "how to say no to stakeholders professionally"), V("Software estimation techniques", "software estimation techniques")],
  cheat: `<pre>Scope doc: problem | metric + baseline | IN | OUT | deliverables | milestones
           | dependencies (owner, date) | assumptions | risks | acceptance | decision point
Pilot sizing: 1 workflow, 1 user group, 4-8 weeks, measurable
"Yes, and..." trade-off script:
  "We can do X. It costs Y (time/risk). Options: A now, B in phase 2. Which?"
Change log: request, impact, decision, date, approver
Estimate: tasks <= 2 days ; best/likely/worst ; +buffer for access & integration
Re-estimate weekly ; tell early, never surprise late</pre>`,
  tips: ["Writing 'out of scope' explicitly prevents half of all future arguments.", "Dependencies on the customer (data, access, experts' time) need names and dates.", "Offer options with trade-offs instead of a flat no.", "Access and security approvals take longer than coding; plan for it."],

{ id: "cm-writing", topic: "comm", title: "Technical writing: briefs, design docs, updates, runbooks", mins: 50,
  body: `
<p>OpenAI's and Anthropic's postings stress clear communication and documenting patterns. In FDE work, <b>writing is how decisions get made and how your work outlives you</b>.</p>
<p><b>Documents you'll write constantly:</b></p>
<table class="ops"><tr><td><b>Deployment brief</b></td><td>1 page: problem, proposed solution, success metric, timeline, risks, asks</td></tr>
<tr><td><b>Design doc</b></td><td>context, goals/non-goals, options considered with trade-offs, chosen design, data flow, security, rollout, open questions</td></tr>
<tr><td><b>Weekly status update</b></td><td>progress vs plan, metrics, risks/blockers, decisions needed, next week</td></tr>
<tr><td><b>Runbook</b></td><td>how to operate the system: start/stop, deploy, rollback, common alerts and fixes, contacts</td></tr>
<tr><td><b>Handover / playbook</b></td><td>what was built, how to extend it, known limitations, lessons learned</td></tr></table>
<p><b>Writing principles:</b></p>
<ul><li><b>Bottom line up front</b>: the conclusion or ask in the first two lines.</li>
<li>Write for the reader's role: executives want outcomes, risks and decisions; engineers want details.</li>
<li>Short sentences, plain words, headings, bullet lists for scannable facts, numbers instead of adjectives.</li>
<li>Status colours with meaning (green/amber/red) and honesty: red early is better than red late.</li>
<li>Every risk comes with an owner and a mitigation; every ask with a date.</li></ul>
<p>A weekly status email template:</p>
<pre>Subject: Support Copilot pilot – week 3 – AMBER
Summary: On track for go-live 14 Oct if CRM sandbox access arrives by Fri.
Progress: Golden set 120 cases (accuracy 91%, target 90%). Agent UI in testing.
Metrics: Pilot agents 12/40 active. Avg handling time 11.2 min (baseline 14).
Risks: CRM sandbox access pending since 18 Sep (owner: Rahul, IT) – blocks write-back.
Decisions needed: Approve Hindi support for phase 2 (see options doc).
Next week: Security review, 40 agents onboarded.</pre>`,
  watch: [V("Writing design docs at Google", "how to write a design doc software engineering"), V("BLUF writing technique", "bottom line up front writing"), V("Writing runbooks", "how to write a runbook")],
  cheat: `<pre>BLUF: conclusion/ask in first 2 lines
Brief: problem | solution | metric | timeline | risks | asks
Design doc: context | goals/non-goals | options + trade-offs | design | data flow
            | security | rollout/rollback | open questions
Status: RAG colour | summary | progress | metrics | risks (owner, date) | decisions | next
Runbook: deploy | rollback | health checks | alerts -> actions | contacts
Style: short sentences, numbers not adjectives, headings, one idea per paragraph
Tools: Google Docs, Confluence, Notion, Markdown in repo, Mermaid diagrams</pre>`,
  tips: ["If an executive reads only the subject line and first sentence, they should know the state and the ask.", "Report bad news early with a plan; surprises destroy trust.", "Write the runbook as if you'll be unreachable for a month.", "Reuse templates; consistency makes your updates easy to read week after week."],
  qs: [
    { q: "What does 'bottom line up front' mean?", o: ["Put the conclusion or request at the very start", "Put the budget at the bottom", "Use a large font", "Summarise at the end only"], a: 0, why: "Busy readers get the key point immediately." },
    { q: "Which belongs in a runbook?", o: ["How to deploy, roll back and respond to common alerts", "The sales pitch", "Marketing copy", "Interview questions"], a: 0, why: "Runbooks let others operate and fix the system." },
    { q: "A dependency is late and threatens go-live. When do you report it?", o: ["Immediately in the next update, marked amber/red, with owner and options", "After the deadline passes", "Never", "Only if asked"], a: 0, why: "Early warnings allow action; late ones only allow blame." },
    { q: "What should a design doc include besides the chosen design?", o: ["Options considered and why they were rejected", "Only the final code", "Team photos", "Nothing else"], a: 0, why: "Trade-offs show judgement and help reviewers." },
  ],
  scen: [{ t: "Write the set", d: "For one of your projects, write: a 1-page deployment brief, a weekly status email (amber, with a real blocker), and a runbook with deploy, rollback and 3 alert responses." }],
  where: [["Google technical writing courses", "https://developers.google.com/tech-writing", "Free, short, excellent"], ["Hemingway Editor", "https://hemingwayapp.com/", "Spot long, hard sentences"], ["Mermaid", "https://mermaid.js.org/", "Diagrams as text in docs"]] },

{ id: "cm-demo", topic: "comm", title: "Demos that land", mins: 45,
  body: `
<p>A demo is often the moment a customer decides to invest. Postings and roadmaps call out demo skills: narrative, live customer data, and handling failure.</p>
<p><b>Structure a 10-minute demo:</b></p>
<ol><li><b>The problem (1 min)</b>: their pain in their words, with the number from discovery. "Today an agent spends 14 minutes finding the right policy."</li>
<li><b>The before (1 min)</b>: show or describe the current painful path.</li>
<li><b>The after (4-5 min)</b>: one realistic end-to-end story using <b>their</b> data, in their workflow. Build to one "wow" moment.</li>
<li><b>Trust (1-2 min)</b>: citations, what it does when it doesn't know, guardrails, how it's evaluated.</li>
<li><b>Honest limits and next steps (1-2 min)</b>: what's mocked, what's next, what you need from them.</li></ol>
<p><b>Failure choreography:</b> LLMs are non-deterministic and live systems fail. Rehearse; have a recorded backup video; pre-run key queries; have a fallback path ready; if something breaks, stay calm, explain, switch to backup. Handling failure well builds more trust than a flawless demo.</p>
<p><b>Honesty rules:</b> clearly label mocked parts; don't imply capabilities you haven't tested; state known limitations. Over-promising in a demo becomes an unhappy pilot later.</p>
<p><b>Audience tuning:</b> executives: outcomes, risk, time to value. Users: their workflow, speed, control. IT/security: architecture, data flow, controls.</p>
<p>Record a 2-3 minute version for your champion to share internally, and for your portfolio.</p>`,
  watch: [V("How to give a great product demo", "how to give a great software demo"), V("Technical demo storytelling", "technical demo storytelling tips")],
  cheat: `<pre>10-min shape: problem (with number) > before > after (their data, 1 story, 1 wow)
              > trust (citations, "I don't know", guardrails, evals) > limits + next
Prep: rehearse x3, pre-run queries, backup video, fallback path, test the room/screen
Failure: stay calm > name it > switch to backup > explain what would happen
Honesty: label mocks, state limits, no untested promises
Tune: exec (outcome, risk) | users (workflow) | IT/sec (architecture, controls)
Leave-behind: 2-3 min recording + 1-page summary</pre>`,
  tips: ["Use the customer's own data; generic examples feel like someone else's product.", "Show one story end to end rather than ten features.", "Say out loud what's mocked before anyone asks.", "Always have a recorded backup of the golden path."],
  qs: [
    { q: "What makes a customer demo most convincing?", o: ["A realistic end-to-end story on the customer's own data", "Showing every feature quickly", "Complex architecture slides", "Generic sample data"], a: 0, why: "Seeing their data and workflow makes the value concrete." },
    { q: "The model gives a wrong answer live. Best response?", o: ["Stay calm, acknowledge it, show how the system handles errors (evals, feedback), and continue with a backup", "Blame the model vendor", "End the meeting", "Pretend it's correct"], a: 0, why: "Honest, prepared handling builds trust." },
    { q: "Part of the demo uses mocked data. What should you do?", o: ["Say clearly which parts are mocked", "Hide it", "Only mention it if asked", "Remove all real parts"], a: 0, why: "Hidden mocks create false expectations and later distrust." },
    { q: "What should the executive audience mainly hear?", o: ["Outcomes, risks and time to value", "Code walkthroughs", "Token counts only", "Database schemas"], a: 0, why: "Executives decide on value and risk." },
  ],
  scen: [{ t: "Script and record", d: "Write a 10-minute demo script for your RAG assistant with an opening question, one wow moment, a planned failure and recovery, and an honest limits slide. Record a 3-minute version with Loom." }],
  where: [["Loom", "https://www.loom.com/", "Record demo videos"], ["OBS Studio", "https://obsproject.com/", "Free screen recording"]] },

{ id: "cm-stakeholder", topic: "comm", title: "Managing expectations, bad news and escalations", mins: 45,
  body: `
<p>Client-simulation interview rounds test exactly this: delivering bad news, pushing back, and de-escalating. On the job it's weekly.</p>
<p><b>Expectation management starts early:</b> explain what LLM systems do well and where they fail, in business language: "It will draft correct answers for most routine questions; for the rest it will say it isn't sure and hand over to an agent. We'll measure both." Agree how errors will be handled before the first one happens.</p>
<p><b>Delivering bad news:</b></p>
<ol><li>Say it early and plainly; don't bury it.</li>
<li>State the impact (timeline, scope, quality).</li>
<li>Explain the cause briefly, without blaming.</li>
<li>Offer options with trade-offs and your recommendation.</li>
<li>Agree next steps and when you'll update again.</li></ol>
<p>"Our accuracy on scanned loan forms is 72%, below the 90% target. The scans are low resolution. Options: (A) add a better OCR step, 1 week, likely 88-92%; (B) limit phase 1 to digital forms, on time, 94%. I recommend B now and A in phase 2."</p>
<p><b>Pushing back</b> on unreasonable requests: acknowledge the goal, explain the risk, propose an alternative that meets the underlying need.</p>
<p><b>De-escalation</b> with an upset customer: listen fully, acknowledge their frustration and the impact, don't get defensive, take ownership of next steps, give a specific time for the next update, and follow through exactly. Use "we" language for the problem and "I" language for commitments.</p>
<p><b>Translating model behaviour for business people:</b> talk in rates and outcomes ("9 in 10 answers correct on your test set; wrong ones mostly involve policies updated last month") rather than AI jargon.</p>`,
  watch: [V("How to deliver bad news to clients", "how to deliver bad news to clients"), V("De-escalation techniques for customer conversations", "de escalation techniques customer conversations"), V("Pushing back professionally", "how to push back on stakeholders")],
  cheat: `<pre>Bad news: early > plain > impact > cause (no blame) > options + recommendation > next update time
Push back: "I understand the goal is X. Doing Y risks Z. Alternative W meets X. OK?"
De-escalate: listen > acknowledge > own next steps > specific update time > follow through
Language: "we" for the problem, "I" for commitments
Explain AI in rates + outcomes, not jargon
Set error expectations BEFORE the first error
Write it down afterwards: decision, owner, date</pre>`,
  tips: ["The earlier bad news arrives, the more options everyone has.", "Always bring at least two options and your recommendation.", "Never promise a date you haven't checked; promise when you'll have the date.", "After a tense call, send a written recap within the hour."],
  qs: [
    { q: "Accuracy is below target two weeks before go-live. What's the first step?", o: ["Tell the customer now with the impact, cause and options", "Wait and hope it improves", "Change the target quietly", "Hide the eval results"], a: 0, why: "Early transparency preserves trust and choices." },
    { q: "A frustrated executive says 'this AI is useless'. Best opening?", o: ["Listen fully, acknowledge the frustration and impact, then ask for specific examples", "Argue that accuracy is 90%", "Blame the data team", "End the call"], a: 0, why: "Acknowledgement lowers tension; specifics make it solvable." },
    { q: "How should you explain model reliability to business users?", o: ["As rates and outcomes on their data, e.g. '9 in 10 answers correct on your test set'", "With token and embedding jargon", "Say it's 100% accurate", "Avoid discussing it"], a: 0, why: "Concrete rates build accurate expectations." },
    { q: "What makes a good push-back?", o: ["Acknowledge the goal, explain the risk, offer an alternative that meets the need", "Just say no", "Agree to everything", "Escalate immediately to your boss"], a: 0, why: "It keeps the relationship and the project healthy." },
  ],
  scen: [{ t: "Role-play", d: "With a friend playing an angry customer, practise three scenarios (missed deadline, wrong AI answer shown to their CEO, request to add 5 features in the last week). Record yourself; check for acknowledgement, options and a clear next step." }],
  where: [["Crucial Conversations (summary videos)", "https://www.youtube.com/results?search_query=crucial+conversations+summary", "Frameworks for high-stakes talks"], ["Exponent: client simulation practice", "https://www.tryexponent.com/", "FDE interview role-play guides"]] },

{ id: "cm-teach", topic: "comm", title: "Workshops, enablement and handover", mins: 40,
  body: `
<p>FDEs "transfer knowledge so customers can build more on their own". A deployment only lasts if the customer's people can run and extend it.</p>
<p><b>Workshops</b> with customer teams (discovery workshops, prompt-writing sessions, architecture reviews):</p>
<ul><li>Set a clear goal and agenda; send pre-reads.</li>
<li>Make it hands-on: participants try things on their own data.</li>
<li>Facilitate: time-box, make quiet people speak, park off-topic items, capture decisions.</li>
<li>End with written decisions, owners and next steps.</li></ul>
<p><b>Enablement</b> (teaching users and admins):</p>
<ul><li>Short role-based training: agents (how to use it and when not to trust it), admins (configuration, monitoring), developers (extending it).</li>
<li>Quick-reference guides, 2-minute videos, an FAQ built from real questions.</li>
<li>Office hours during the first weeks.</li></ul>
<p><b>Handover checklist:</b> architecture and data-flow docs; runbook; access transferred to customer owners; credentials rotated; monitoring and alerts routed to their team; eval suite and how to run it; known limitations and backlog; a named internal owner; a shadowing period where they operate while you watch.</p>
<p><b>Playbooks for your own company:</b> after each deployment, write down what was reusable (templates, connectors, prompts, eval sets) and what was bespoke. Configuration over forking: the next customer should get a configured version, not a copy-paste fork.</p>`,
  watch: [V("How to run an effective workshop", "how to facilitate a workshop"), V("Knowledge transfer and handover best practices", "project handover knowledge transfer best practices")],
  cheat: `<pre>Workshop: goal > agenda > pre-read > hands-on > decisions + owners + next steps
Enablement by role: users | admins | developers ; 2-min videos ; FAQ ; office hours
Handover: docs | runbook | access to their owners | rotate creds | alerts to them
          | eval suite | limitations + backlog | named owner | shadow period
Playbook after each deployment: reusable (template/connector/prompt/eval) vs bespoke
Configuration over forking</pre>`,
  tips: ["Teach users when NOT to trust the AI; it prevents the worst incidents.", "Handover isn't done until the customer has run a deploy and a rollback without you.", "Build the FAQ from real questions during the pilot.", "Every deployment should leave behind at least one reusable asset."],
  qs: [
    { q: "When is a handover truly complete?", o: ["When the customer's team has operated the system (including a deploy/rollback) without you", "When you send the docs", "When the contract ends", "When the demo is done"], a: 0, why: "Documentation alone doesn't prove they can run it." },
    { q: "What should end user training include besides features?", o: ["When not to trust the output and how to escalate", "Model architecture", "Token pricing", "Python basics"], a: 0, why: "Calibrated trust prevents misuse." },
    { q: "What does 'configuration over forking' mean?", o: ["Serve new customers by configuring a shared solution rather than copying and diverging code", "Never use Git forks", "Configure servers manually", "Avoid configuration"], a: 0, why: "It keeps deployments maintainable and scalable." },
    { q: "What makes a workshop productive?", o: ["Clear goal, hands-on activities, and written decisions with owners", "Long slide decks", "No agenda", "Only the FDE talking"], a: 0, why: "Participation plus captured decisions create progress." },
  ],
  scen: [{ t: "Teach it", d: "Run a 30-minute session teaching two friends to use one of your projects. Prepare a quick-reference card and a 2-minute video. Collect their questions into an FAQ." }],
  where: [["SessionLab workshop library", "https://www.sessionlab.com/library", "Facilitation techniques"], ["Notion templates", "https://www.notion.so/templates", "Handover and runbook templates"]] },

{ id: "pr-harden", topic: "prod", title: "Hardening: from demo to production", mins: 50,
  body: `
<p>A demo that works for 5 people will break for 500. <b>Hardening</b> is the list of things that make it survive real use.</p>
<p><b>A production-readiness checklist:</b></p>
<ul><li><b>Security</b>: SSO, role-based access, permission-aware retrieval, secrets in a manager, security review passed, pen-test findings fixed.</li>
<li><b>Reliability</b>: timeouts, retries, fallbacks, rate limits, idempotent jobs, health checks, multiple replicas.</li>
<li><b>Observability</b>: structured logs, traces, dashboards, <b>alerts</b> routed to an on-call owner.</li>
<li><b>SLOs</b> agreed: e.g., 99.5% availability, p95 latency under 6 s, and a quality floor.</li>
<li><b>Quality</b>: eval suite in CI, regression gate, human review of sampled outputs, feedback loop.</li>
<li><b>Data</b>: retention and deletion, backups tested, PII handling approved.</li>
<li><b>Cost</b>: budgets, per-tenant limits, alerts on spikes.</li>
<li><b>Operations</b>: runbook, on-call rotation, escalation path, incident process.</li>
<li><b>Change management</b>: versioned deployments, feature flags, rollback tested.</li>
<li><b>Load testing</b>: expected peak plus margin, including LLM rate limits.</li>
<li><b>Support</b>: how users report issues, who responds, in what time.</li></ul>
<p>You won't do everything for a pilot. Agree with the customer which items are <b>non-negotiable</b> for this stage (usually security, access control, data handling and a rollback path) and which follow later.</p>`,
  watch: [V("Production readiness checklist", "production readiness review checklist"), V("Load testing with Locust", "locust load testing python tutorial")],
  cheat: `<pre>Security: SSO, RBAC, ACL-aware retrieval, secrets manager, review passed
Reliability: timeouts, retries, fallbacks, rate limits, idempotency, replicas, health
Observe: logs, traces, dashboards, ALERTS -> on-call owner
SLOs: availability, p95 latency, quality floor, error budget
Quality: eval CI gate, sampled human review, feedback loop
Data: retention/deletion, tested backups, PII approval
Cost: budgets, per-tenant caps, spike alerts
Ops: runbook, on-call, escalation, incident process
Change: versioned deploys, flags, tested rollback
Load test: peak x 2, include provider rate limits (Locust, k6)</pre>`,
  tips: ["Test the rollback before you need it; an untested rollback is a hope.", "Load test against the LLM provider's actual rate limits for your account tier.", "Agree the non-negotiables for each stage in writing.", "Alerts without a named owner are noise."],
  qs: [
    { q: "Which item is usually non-negotiable even for a pilot with real users?", o: ["Access control and approved data handling", "Dark mode", "Multi-region failover", "A mobile app"], a: 0, why: "Security and data protection can't wait for 'later'." },
    { q: "Why load test an LLM application?", o: ["To find limits like provider rate limits, latency under load and cost at peak", "To train the model", "To reduce accuracy", "It's never needed"], a: 0, why: "Real traffic exposes bottlenecks demos never hit." },
    { q: "What's wrong with an untested rollback plan?", o: ["It may fail exactly when you need it", "Nothing", "It's too fast", "It uses too many tokens"], a: 0, why: "Rollbacks must be rehearsed to be trusted." },

  ],

{ id: "pr-rollout", topic: "prod", title: "Rollouts, feature flags and model upgrades", mins: 45,
  body: `
<p>Changing a live AI system is risky: a new prompt, model or retrieval setting can change thousands of answers at once. Roll out gradually and be ready to undo.</p>
<p><b>Feature flags</b> turn behaviour on or off (or choose variants) without deploying code: per user, per tenant, or by percentage. They power staged rollouts and <b>kill switches</b>.</p>
<p><b>Staged rollout:</b></p>
<ol><li>Internal users / your team.</li>
<li>A small pilot group (e.g., 5% or one team).</li>
<li>Watch metrics for a set period against pre-agreed thresholds.</li>
<li>Expand to 25% → 50% → 100%, pausing at each step.</li></ol>
<p><b>Rollback triggers</b> are decided <i>before</i> the rollout: "If escalation rate rises above 12%, or any wrong refund occurs, or p95 latency exceeds 8 s, flip the flag back."</p>
<p><b>Shadow mode</b> (dark launch): run the new version in parallel on real traffic without showing its output to users; compare with the current version. Great for model upgrades.</p>
<p><b>Canary deployments</b> route a small share of traffic to new infrastructure versions first.</p>
<p><b>Model upgrades</b> happen regularly (providers release and retire models): run evals on the new model → compare → adjust prompts → shadow → staged rollout with the old model as fallback → retire the old one. Pin exact model versions in config so upgrades are deliberate.</p>`,
  watch: [V("Feature flags explained", "feature flags explained"), V("Canary vs blue-green deployments", "canary deployment vs blue green deployment")],
  cheat: `<pre>Flag = runtime switch (user / tenant / %) ; kill switch = flag that disables the feature
Stages: internal > 5% > 25% > 50% > 100% (hold + check metrics at each)
Rollback triggers set BEFORE rollout (quality, safety, latency, cost thresholds)
Shadow mode: new version runs silently, compare outputs
Canary: small traffic share on new infra version
Blue-green: two environments, switch traffic at once
Model upgrade: eval > compare > tune prompt > shadow > staged > fallback > retire old
Pin exact model versions in config
Tools: LaunchDarkly, Unleash, Flagsmith, GrowthBook, or a config table</pre>`,
  tips: ["Write rollback triggers down before the rollout starts, when everyone is calm.", "Keep the previous model as a fallback until the new one has proven itself.", "Shadow mode is the safest way to compare models on real traffic.", "A kill switch should work in seconds and be tested regularly."],
  qs: [
    { q: "What is shadow mode?", o: ["Running a new version on real traffic without showing its output, to compare with the current one", "Dark UI theme", "Hiding logs", "Running at night only"], a: 0, why: "You learn real-world behaviour without user risk." },
    { q: "When should rollback triggers be defined?", o: ["Before the rollout begins", "After a problem appears", "Never", "At 100% rollout"], a: 0, why: "Pre-agreed criteria avoid debates during an incident." },
    { q: "Why pin exact model versions in config?", o: ["So model changes happen deliberately after evaluation, not silently", "Providers require it", "To save tokens", "No reason"], a: 0, why: "Unpinned aliases can change behaviour without notice." },
    { q: "What does a feature flag enable?", o: ["Turning features on/off or for subsets of users without redeploying", "Faster CPUs", "Encryption", "Better prompts automatically"], a: 0, why: "Flags decouple release from deployment." },
  ],
  scen: [{ t: "Upgrade plan", d: "Write a rollout plan for upgrading your assistant to a newer model: eval comparison, shadow period, stages with percentages and durations, metrics and rollback triggers at each stage, and communication to users." }],
  where: [["Martin Fowler: feature toggles", "https://martinfowler.com/articles/feature-toggles.html", "The classic article"], ["Unleash", "https://www.getunleash.io/", "Open-source feature flags"], ["GrowthBook", "https://www.growthbook.io/", "Open-source flags and experiments"]] },

{ id: "pr-incident", topic: "prod", title: "Incidents, root-cause analysis and postmortems", mins: 45,
  body: `
<p>Something will go wrong in production: an outage, a wrong answer shown to a customer's client, a data exposure, a cost spike. How you respond defines the relationship.</p>
<p><b>During an incident:</b></p>
<ol><li><b>Detect and declare</b>: acknowledge the alert, assess severity (who's affected, how badly), declare an incident and open a channel.</li>
<li><b>Assign roles</b>: incident lead (coordinates), communications (updates stakeholders), investigators.</li>
<li><b>Mitigate first, fix later</b>: stop the harm quickly: kill switch, rollback, disable a tool, rate-limit. Root cause can wait.</li>
<li><b>Communicate on a schedule</b>: "Next update in 30 minutes", even if there's nothing new.</li>
<li><b>Keep a timeline</b> of events and actions with timestamps.</li>
<li><b>Resolve and verify</b>, then confirm with affected users.</li></ol>
<p><b>Root-cause analysis:</b> ask "why?" repeatedly (the 5 Whys) until you reach causes you can fix in the system, not "someone made a mistake". There are usually several contributing causes.</p>
<p><b>Blameless postmortem</b> (within a few days): summary, impact (who, how long, how much), timeline, root and contributing causes, what went well, what went badly, and <b>action items with owners and dates</b>. Blameless means focusing on systems and processes; people who feel safe share what really happened.</p>
<p><b>AI-specific incidents:</b> harmful or wrong outputs, prompt-injection exploits, leaked data via retrieval, runaway agent costs, provider outages. Each needs detection (monitoring), mitigation (flags, limits), and follow-up (new eval cases, guardrails).</p>`,
  watch: [V("Incident management explained", "incident management process explained"), V("Blameless postmortems", "blameless postmortem explained"), V("5 whys root cause analysis", "5 whys root cause analysis")],
  cheat: `<pre>Declare > roles (lead, comms, investigators) > MITIGATE (flag/rollback/limit)
  > update on schedule > timeline > resolve > verify
Severity: users affected x impact x data/safety risk
Comms template: what's happening | impact | what we're doing | next update at HH:MM
RCA: 5 Whys -> system causes, not blame ; several contributing causes
Postmortem: summary | impact | timeline | causes | went well/badly | actions (owner, date)
AI incidents: wrong/harmful output, injection, data leak via retrieval,
              runaway cost, provider outage -> add eval cases + guardrails</pre>`,
  tips: ["Stop the bleeding first; investigate after.", "Promise update times, not fix times, early in an incident.", "Every postmortem action needs an owner and a date, or it won't happen.", "Turn every AI incident into new eval cases so it can't silently return."],
  qs: [
    { q: "During an incident, what comes first?", o: ["Mitigating the impact (rollback, kill switch, limits)", "Finding the perfect root cause", "Writing the postmortem", "Assigning blame"], a: 0, why: "Reduce harm quickly; analysis comes after." },
    { q: "What does 'blameless' mean in a postmortem?", o: ["Focus on system and process causes so people share honestly", "Nobody is responsible for action items", "Skip the timeline", "Only managers attend"], a: 0, why: "Psychological safety reveals real causes." },
    { q: "Your agent issued three wrong refunds overnight. Immediate step?", o: ["Disable the refund tool via kill switch/flag, then investigate", "Wait for the weekly review", "Retrain the model", "Delete the logs"], a: 0, why: "Stop further harm immediately." },
    { q: "What must each postmortem action item have?", o: ["An owner and a due date", "A long description only", "A new model", "Customer approval"], a: 0, why: "Ownership and deadlines make improvements happen." },
  ],
  scen: [{ t: "Write a postmortem", d: "Invent an incident for your RAG assistant (e.g., HR chunks shown to a non-HR user). Write a full blameless postmortem with timeline, 5 Whys, contributing causes, and 5 action items with owners." }],
  where: [["Google SRE: postmortem culture", "https://sre.google/sre-book/postmortem-culture/", "How and why"], ["PagerDuty incident response guide", "https://response.pagerduty.com/", "Free, detailed process"], ["AI Incident Database", "https://incidentdatabase.ai/", "Real AI failures to learn from"]] },

{ id: "pr-value", topic: "prod", title: "Proving value and driving adoption", mins: 40,
  body: `
<p>A working system isn't a successful deployment until the customer can see and repeat the value, especially at renewal time.</p>
<p><b>Prove value:</b></p>
<ul><li>Compare against the <b>baseline</b> you captured in discovery, using the agreed metrics.</li>
<li>Show both <b>hard numbers</b> (minutes saved, deflection, error reduction, cost per case) and <b>stories</b> (a specific user's before/after, a quote).</li>
<li>Report honestly, including what didn't improve and why.</li>
<li>Build a simple <b>executive dashboard</b>: primary metric trend, adoption, quality guardrails, cost.</li>
<li>Run a <b>quarterly business review (QBR)</b>: results, lessons, next opportunities.</li></ul>
<p><b>Drive adoption:</b> most AI deployments stall because people don't change habits, not because the tech fails.</p>
<ul><li>Embed the tool where people already work (their CRM, Slack/Teams, email), not in yet another tab.</li>
<li>Find and celebrate power users; ask them to coach peers.</li>
<li>Remove friction fast: fix small annoyances reported in week one.</li>
<li>Measure adoption weekly by team; talk to low-adoption teams to find out why.</li>
<li>Get managers to reinforce it in team routines.</li></ul>
<p><b>Expansion</b> comes from success: the next workflow, the next department. Keep a list of opportunities you spot during the pilot.</p>`,
  watch: [V("Driving AI adoption in enterprises", "driving ai adoption in the enterprise"), V("How to run a QBR", "how to run a quarterly business review")],
  cheat: `<pre>Value = baseline vs now on agreed metrics + stories + honest gaps
Exec dashboard: primary metric trend | adoption | quality guardrails | cost
QBR: results > lessons > roadmap > next opportunities > asks
Adoption levers: embed in existing tools | power users | fix friction fast
                 | weekly adoption by team | manager reinforcement
Expansion list: new workflows/departments spotted during pilot</pre>`,
  tips: ["Collect one strong user quote every week; stories persuade executives as much as numbers.", "Put the AI inside the tool people already use; every extra click costs adoption.", "Report what didn't work too; honesty makes the good numbers believable.", "Keep a running list of expansion ideas from day one."],
  qs: [
    { q: "What's the most common reason AI deployments stall after a good pilot?", o: ["Low adoption: people don't change their habits", "The model forgets how to work", "Too much accuracy", "Excess documentation"], a: 0, why: "Value depends on usage; adoption needs deliberate work." },
    { q: "Where should an AI assistant for sales reps ideally live?", o: ["Inside the CRM or chat tool they already use", "A separate new website", "An email they must forward", "A PDF"], a: 0, why: "Meeting users in their existing workflow reduces friction." },
    { q: "What makes a value report credible?", o: ["Comparison to the baseline, clear metrics, stories, and honest gaps", "Only positive anecdotes", "Model benchmark scores", "Token counts"], a: 0, why: "Balanced evidence builds trust." },
    { q: "What is a QBR?", o: ["A quarterly business review of results, lessons and next steps with the customer", "A query builder", "A security audit", "A model type"], a: 0, why: "It keeps executives aligned and opens expansion." },
  ],
  scen: [{ t: "Value story", d: "Create a one-page value report and a mock executive dashboard (Google Sheets or Streamlit) for your support-triage pilot, with baseline vs current, adoption by team, a guardrail metric, cost, and one user quote." }],
  where: [["Looker Studio", "https://lookerstudio.google.com/", "Free dashboards"], ["Streamlit", "https://streamlit.io/", "Build a quick metrics dashboard"]] },

{ id: "pr-scale", topic: "prod", title: "Scale and repeatability: playbooks and field feedback", mins: 40,
  body: `
<p>The best FDE teams don't solve the same problem from scratch for every customer. They turn field work into reusable assets and feed learnings back into the product. OpenAI's posting asks for exactly this: documenting patterns into reusable tools and playbooks, and sharing field feedback with research and product.</p>
<p><b>Spot patterns across deployments:</b> after 2-3 similar projects, list what was the same (connectors, prompts, eval sets, UI components, infrastructure modules) and what was truly custom.</p>
<p><b>Turn the same into assets:</b></p>
<ul><li><b>Templates</b>: scope doc, security answers, architecture diagrams, status updates.</li>
<li><b>Code</b>: reusable connectors/MCP servers, a reference app, Terraform modules, eval harness.</li>
<li><b>Configuration</b>: customer differences expressed as config (prompts, field mappings, thresholds), not forks.</li>
<li><b>Playbooks</b>: step-by-step guides for a use case ("Support triage in 6 weeks").</li></ul>
<p><b>Field feedback to product:</b> write it so product teams can act: the customer need, how many customers have it, the workaround you built, the cost of not solving it, and a suggested product change. Include evidence (quotes, data, eval failures).</p>
<p><b>Multi-customer operations:</b> version your reference solution; track which customer runs which version; plan upgrades; keep each customer's data and config isolated.</p>
<p>This is also how FDEs grow: people who create leverage for the whole team get noticed.</p>`,
  watch: [V("Productising services work", "productizing professional services"), V("Writing product feedback that gets acted on", "how to write customer feedback for product teams")],
  cheat: `<pre>After each deployment: SAME (reusable) vs CUSTOM (bespoke) list
Assets: templates | connectors/MCP | reference app | IaC modules | eval harness | playbooks
Differences -> config (prompts, mappings, thresholds), not forks
Feedback format: need | # customers | workaround | cost of not solving | proposal | evidence
Fleet ops: version reference solution, track versions per customer, planned upgrades, isolation</pre>`,
  tips: ["The third time you build something, make it reusable.", "Feedback with numbers and customer counts gets prioritised; anecdotes don't.", "Keep a 'patterns' doc updated after every engagement.", "Your reusable assets are also excellent portfolio and interview material."],
  qs: [
    { q: "Three customers needed nearly the same Zendesk connector. What should you do?", o: ["Build a reusable connector with per-customer configuration", "Copy-paste it a fourth time", "Ignore it", "Tell customers to build their own"], a: 0, why: "Reusable, configurable assets scale FDE work." },
    { q: "What makes field feedback actionable for a product team?", o: ["The need, how many customers have it, the workaround, cost of not solving, evidence", "A vague complaint", "Only a feature name", "A screenshot with no context"], a: 0, why: "Product teams prioritise with evidence and impact." },
    { q: "Why express customer differences as configuration rather than forks?", o: ["One codebase can be upgraded and fixed for everyone", "Forks are illegal", "Config is always faster to run", "No reason"], a: 0, why: "Forks multiply maintenance and drift." },
    { q: "What is a deployment playbook?", o: ["A step-by-step guide for delivering a specific use case repeatedly", "A sports strategy", "A model card", "A billing report"], a: 0, why: "It captures proven steps for the next team." },
  ],
  scen: [{ t: "Extract a template", d: "Look at your projects (or imagine 3 similar support-AI deployments). Write a table of reusable vs bespoke parts, then a 1-page playbook 'Support triage pilot in 6 weeks' and one product feedback note." }],
  where: [["GitHub template repositories", "https://docs.github.com/en/repositories/creating-and-managing-repositories/creating-a-template-repository", "Package your reference app"], ["Cookiecutter", "https://cookiecutter.readthedocs.io/", "Project templates with config"]] },

{ id: "iv-coding", topic: "intv", title: "The practical coding round", mins: 45,
  body: `
<p>FDE coding rounds usually look like real work: parse and transform data, call an API, fix a bug, build a small feature, write tests. DSA basics (hash maps, sorting, two pointers, BFS) still appear, which is why this site has 5 daily problems.</p>
<p><b>Typical prompts:</b></p>
<ul><li>"Here's a CSV of transactions with messy dates and currencies. Compute monthly totals per customer."</li>
<li>"Write a client for this paginated, rate-limited API and aggregate the results."</li>
<li>"This function has a bug and no tests. Find it, fix it, add tests."</li>
<li>"Implement a simple in-memory rate limiter / cache / job queue."</li>
<li>"Given these support tickets, group duplicates."</li></ul>
<p><b>How to run the round:</b></p>
<ol><li><b>Clarify</b> input/output formats, edge cases, scale. Restate the problem.</li>
<li><b>Plan out loud</b>: a quick approach and its complexity before typing.</li>
<li><b>Write clean, small functions</b> with good names; handle errors and edge cases.</li>
<li><b>Test as you go</b>: run with examples; add edge cases (empty, duplicates, bad data).</li>
<li><b>Narrate</b>: say what you're doing and why; interviewers score your thinking.</li>
<li><b>Refine</b>: mention what you'd do with more time (logging, retries, types, more tests).</li></ol>
<p>Using AI tools may or may not be allowed; ask. If allowed, you're judged on how well you direct and verify them.</p>`,
  watch: [V("How to approach coding interviews", "how to approach coding interviews think out loud"), V("Practical coding interview Python data processing", "python data processing interview question")],
  cheat: `<pre>CLARIFY (inputs, outputs, edge cases, scale) > RESTATE > PLAN + complexity
> CODE small functions > TEST (normal, empty, dup, bad data) > NARRATE > REFINE
Common tasks: parse/clean data, aggregate, API client with pagination/retries,
              debug + add tests, rate limiter, cache, dedupe
Python must-knows: dict/Counter/defaultdict, sorted(key=), csv/json, datetime,
                   try/except, list comprehensions, classes, pytest basics
Ask: "Can I use AI tools / the internet / docs?"</pre>`,
  tips: ["Silence is the enemy; keep narrating even when stuck.", "Write a tiny test case before the solution; it clarifies the problem.", "Handle the messy-data case explicitly; it's usually the hidden test.", "If you run out of time, explain exactly what's left and how you'd do it."],
  qs: [
    { q: "What should you do first in a practical coding round?", o: ["Clarify inputs, outputs, edge cases and scale, then restate the problem", "Start typing immediately", "Ask for the answer", "Optimise prematurely"], a: 0, why: "Misunderstanding the task is the most expensive mistake." },
    { q: "You're stuck for two minutes. Best move?", o: ["Say what you're thinking, try a small example, and discuss options", "Stay silent", "Give up", "Change the problem"], a: 0, why: "Interviewers can help and score reasoning they can hear." },
    { q: "Which test case is most likely to reveal bugs in data-processing code?", o: ["Messy or empty input (bad dates, missing fields, duplicates)", "The example given in the prompt", "A very clean sample", "No tests"], a: 0, why: "Real data is messy; interviewers check you handle it." },
    { q: "What should you mention if time runs out?", o: ["What's left and how you'd finish, including tests and error handling", "Nothing", "That the problem was unfair", "Your salary expectations"], a: 0, why: "It shows you can plan and prioritise." },
  ],
  scen: [{ t: "Timed drill", d: "Set a 45-minute timer: write a Python function that reads a messy transactions CSV (make one with mixed date formats, currency symbols, duplicates) and outputs monthly totals per customer, with 5 pytest tests. Record yourself narrating." }],
  where: [["LeetCode", "https://leetcode.com/problemset/", "DSA practice"], ["NeetCode 150", "https://neetcode.io/practice", "Curated interview problems with videos"], ["Exercism Python", "https://exercism.org/tracks/python", "Practical, test-driven exercises"]] },

{ id: "iv-design", topic: "intv", title: "The system design round (FDE flavour)", mins: 45,
  body: `
<p>Expect prompts like: "Design an AI assistant for a bank's 3,000 call-centre agents", "Design a document-processing pipeline for 1 million insurance claims a year", or "Design how our product integrates with a customer's on-prem data".</p>
<p><b>What makes FDE design rounds different:</b> the interviewer adds customer realities partway through: "Security says data can't leave their VPC", "Their CRM API allows 100 calls a minute", "The data is scanned PDFs". They want to see you adapt calmly.</p>
<p><b>A 45-minute structure:</b></p>
<ol><li><b>Requirements (5-8 min)</b>: users, workflows, volumes, latency, accuracy needs, security/compliance, existing systems, success metric.</li>
<li><b>High-level design (10 min)</b>: diagram with data flow; mark trust boundaries.</li>
<li><b>Key components (15 min)</b>: data ingestion, retrieval/model layer, integrations, auth, storage; justify choices.</li>
<li><b>Quality and operations (7 min)</b>: evals, monitoring, failure modes, rollback, cost estimate.</li>
<li><b>Rollout (3 min)</b>: pilot → production phases.</li>
<li><b>Trade-offs and open questions (2 min)</b>.</li></ol>
<p><b>Signals interviewers look for:</b> asking before designing, simple-first choices, numbers (volume, cost, latency), security woven in (not bolted on), clear failure handling, and a phased delivery plan a customer could actually approve.</p>`,
  watch: [V("AI system design interview", "ai system design interview llm"), V("System design mock interview", "system design mock interview")],
  cheat: `<pre>Req (users, flows, volume, latency, accuracy, security, systems, metric)
> Diagram + data flow + trust boundaries
> Components: ingest | retrieval/model | integrations | auth | storage
> Quality/ops: evals, monitoring, failure modes, rollback, cost math
> Rollout phases > trade-offs + open questions
When constraints change mid-interview: restate, adapt one component, explain impact
Say numbers out loud ; keep it simple first ; security from the start</pre>`,
  tips: ["When the interviewer adds a constraint, restate it and adjust the specific part; don't restart.", "Put the cost estimate on the board; few candidates do.", "End with a phased plan; it shows you think like a deployer.", "Practise drawing fast: boxes, arrows, dotted trust boundaries."],
  qs: [
    { q: "Mid-interview: 'data can't leave the customer's VPC'. Best reaction?", o: ["Restate it and adapt: deploy inside their VPC, use a model available there, private endpoints", "Start the whole design over", "Say it's impossible", "Ignore it"], a: 0, why: "Calm, targeted adaptation is the skill being tested." },
    { q: "Which signal do FDE design interviewers value?", o: ["A phased rollout plan a customer could approve", "The most complex architecture", "Avoiding numbers", "Skipping security"], a: 0, why: "It shows practical deployment thinking." },
    { q: "When should security be discussed?", o: ["Throughout the design, starting with requirements", "Only if asked at the end", "Never in design rounds", "After deployment"], a: 0, why: "Security shapes architecture choices." },
    { q: "Why estimate cost during the design?", o: ["LLM usage costs can make or break the business case", "Interviewers need invoices", "It replaces evals", "It isn't useful"], a: 0, why: "It shows business awareness and informs model choices." },
  ],
  scen: [{ t: "Mock design", d: "Do a 45-minute mock with a friend: 'Design an AI assistant for 3,000 call-centre agents at an Indian bank.' Ask them to inject two constraints mid-way (on-prem only; CRM rate limit). Record and review." }],
  where: [["System Design Primer", "https://github.com/donnemartin/system-design-primer", "Fundamentals"], ["Excalidraw", "https://excalidraw.com/", "Practise fast diagrams"], ["Exponent system design practice", "https://www.tryexponent.com/", "Mock interviews"]] },

{ id: "iv-decomp", topic: "intv", title: "The decomposition / case round", mins: 45,
  body: `
<p>The decomposition round gives you a vague business problem and watches how you structure it. Example: "A hospital chain says discharge summaries take too long. How would you approach it?" There's no code; it's pure FDE thinking.</p>
<p><b>A reliable structure:</b></p>
<ol><li><b>Clarify the goal</b>: Who is affected? What does 'too long' mean in numbers? Why does it matter now? What does success look like?</li>
<li><b>Map the current process</b>: steps, people, systems, data, where time goes.</li>
<li><b>Break the problem into parts</b> (e.g., data gathering, drafting, review, approval, delivery), and identify the biggest bottleneck.</li>
<li><b>State assumptions</b> explicitly: "I'll assume records are in an EHR with an API and doctors must approve every summary."</li>
<li><b>Generate options</b> for the key bottleneck, from simple to ambitious, and compare impact, effort and risk.</li>
<li><b>Choose an MVP</b>: the smallest valuable pilot, with a metric, users, timeline.</li>
<li><b>Plan beyond</b>: risks (clinical safety, privacy), how you'd evaluate, stakeholders, and what phase 2 might be.</li></ol>
<p><b>What interviewers score:</b> clarifying before solving, making assumptions visible, structured breakdown (not a random list), prioritisation, business sense, risk awareness, and clear communication. Summarising your recommendation at the end in 3 sentences is powerful.</p>`,
  watch: [V("Case interview frameworks explained", "case interview structure explained"), V("Problem decomposition for engineers", "problem decomposition technique")],
  cheat: `<pre>1 Clarify goal + metric + who + why now
2 Map current process (steps, people, systems, data, time)
3 Decompose -> find the biggest bottleneck
4 State assumptions out loud
5 Options (simple > ambitious) x impact / effort / risk
6 MVP: smallest valuable pilot + metric + users + timeline
7 Risks, evals, stakeholders, phase 2
Close: 3-sentence recommendation
Think out loud ; use a whiteboard/list ; check in with the interviewer</pre>`,
  tips: ["Spend the first few minutes only asking questions.", "Write assumptions where the interviewer can see them.", "Always end with an MVP and a metric; it shows you can act, not just analyse.", "Check in: 'Does this breakdown match what you had in mind?'"],
  qs: [
    { q: "What's the first move in a decomposition round?", o: ["Clarify the goal, users, metric and why it matters", "Propose an LLM solution immediately", "Estimate cost", "Draw architecture"], a: 0, why: "Solving the wrong problem well still fails." },
    { q: "Why state assumptions out loud?", o: ["So the interviewer can correct them and sees your reasoning", "To fill time", "It's a formality", "To avoid answering"], a: 0, why: "Visible assumptions make your logic checkable." },
    { q: "Which ending is strongest?", o: ["A clear MVP with metric, users, timeline, plus key risks", "A list of 20 ideas", "'It depends'", "A technology name"], a: 0, why: "It shows you can turn analysis into action." },
    { q: "How should options be compared?", o: ["By impact, effort and risk", "Alphabetically", "By which uses the newest model", "Randomly"], a: 0, why: "Prioritisation needs explicit criteria." },
  ],
  scen: [{ t: "Three cases", d: "Solve these out loud in 30 minutes each, recording yourself: (1) 'Discharge summaries take too long at a hospital chain'; (2) 'An e-commerce company's returns team is overwhelmed'; (3) 'A bank's compliance team can't keep up with regulatory updates'." }],
  where: [["The Forward Deployed: interview practice", "https://www.theforwarddeployed.io/interview-practice", "FDE case prompts"], ["Case in Point summaries", "https://www.youtube.com/results?search_query=case+interview+framework", "Consulting-style structuring"]] },

{ id: "iv-client", topic: "intv", title: "Client simulation and behavioural rounds", mins: 45,
  body: `
<p><b>Client simulation:</b> an interviewer plays a customer. Common scenarios: the project is late; the AI made an embarrassing mistake; the customer wants a big change at the last minute; a stakeholder is hostile; the customer asks for something unsafe or impossible.</p>
<p><b>What they score:</b> listening, empathy, clarity, ownership language ("I will..."), honesty, offering options, pushing back respectfully, staying calm, and ending with concrete next steps. Use the bad-news and de-escalation scripts from the Delivery &amp; Communication topic.</p>
<p><b>Behavioural round:</b> answer with <b>STAR</b>:</p>
<ul><li><b>Situation</b>: brief context (1-2 sentences).</li>
<li><b>Task</b>: what you were responsible for.</li>
<li><b>Action</b>: what <i>you</i> did, specifically (most of the answer).</li>
<li><b>Result</b>: the outcome with numbers, and what you learned.</li></ul>
<p><b>Common FDE behavioural questions:</b></p>
<ul><li>Tell me about a time you worked with a difficult customer or stakeholder.</li>
<li>Describe a project that failed or went wrong. What did you own?</li>
<li>Tell me about a time you had to learn something new very quickly.</li>
<li>Describe a decision you made with incomplete information.</li>
<li>Tell me about a time you pushed back on a request.</li>
<li>When did you go beyond your role to get something done?</li>
<li>Why FDE? Why this company?</li></ul>
<p>Be specific, use "I" for your actions, include numbers, and show reflection. Mission and values matter at AI labs: show you've thought about responsible deployment.</p>`,

  cheat: `<pre>Client sim: listen > acknowledge > clarify > options + recommendation

Question bank: difficult stakeholder | failure | fast learning | ambiguity

{ id: "iv-takehome", topic: "intv", title: "Take-home projects", mins: 40,
  body: `
<p>Some companies (AI labs often) give a 4-8 hour take-home: build a small RAG system, an agent with tools, or an eval harness, then present it. It's the closest thing to real FDE work, and your projects on this roadmap are direct practice.</p>
<p><b>How to do well:</b></p>
<ol><li><b>Read the brief twice</b>; list explicit requirements and implicit expectations (tests, README, evals). Ask clarifying questions by email if allowed.</li>
<li><b>Timebox</b>: plan hours per part; get an end-to-end version working early, then improve.</li>
<li><b>Show judgement</b>: simple design, clear trade-offs, a short "decisions and trade-offs" section in the README.</li>
<li><b>Prove it works</b>: a small eval set with results, tests for core logic, and example runs.</li>
<li><b>Make it easy to run</b>: one command (Docker or uv), .env.example, clear README, sample data included.</li>
<li><b>Be honest</b> about limitations and what you'd do with more time.</li>
<li><b>Prepare the walkthrough</b>: 10 minutes covering problem, design, demo, evals, trade-offs, next steps. Expect deep questions about every choice.</li></ol>
<p><b>Common pitfalls:</b> over-engineering (a multi-agent framework for a simple task), no evals, no tests, hard to run, hidden limitations, and running far over the time budget without saying so.</p>`,
  watch: [V("How to ace take-home assignments", "take home coding assignment tips"), V("Build a RAG app end to end", "build rag application end to end python")],
  cheat: `<pre>Brief > requirements list > time plan > end-to-end v0 EARLY > improve
README: problem | how to run (1 command) | design | decisions & trade-offs
        | eval results | tests | limitations | next steps | time spent
Must include: eval set + results, tests, .env.example, sample data
Avoid: over-engineering, no evals, hard setup, hidden limits
Walkthrough (10 min): problem > design > demo > evals > trade-offs > next</pre>`,
  tips: ["A working simple solution with evals beats an unfinished clever one.", "Report how long you spent; honesty is noticed.", "Test your README on a clean machine or container before submitting.", "Rehearse the walkthrough; the discussion often matters more than the code."],
  qs: [
    { q: "You have 6 hours for a RAG take-home. What should exist by hour 2?", o: ["A simple end-to-end version that answers questions", "A perfect ingestion pipeline only", "Slides", "A multi-agent framework"], a: 0, why: "End-to-end first reduces risk; then improve." },
    { q: "What most often distinguishes strong take-home submissions?", o: ["Evals with results, clear trade-offs, and easy setup", "More libraries", "Longer code", "Fancy UI only"], a: 0, why: "They prove it works and show judgement." },
    { q: "Your solution has a known weakness you ran out of time to fix. What do you do?", o: ["Document it clearly with how you'd fix it", "Hide it", "Remove the feature silently", "Blame the brief"], a: 0, why: "Honest limitations show maturity." },
    { q: "What should the README include?", o: ["How to run, design, decisions/trade-offs, eval results, limitations, next steps", "Only the title", "Your life story", "Nothing; code speaks for itself"], a: 0, why: "Reviewers read the README first." },
  ],
  scen: [{ t: "Mock take-home", d: "Give yourself 6 hours: 'Build a question-answering system over the attached 20 policy PDFs with citations and an eval showing faithfulness.' Use any 20 public documents. Submit it to a friend as if to a company and do a 10-minute walkthrough." }],
  where: [["Anthropic courses", "https://github.com/anthropics/courses", "Tool use and RAG notebooks to learn patterns"], ["promptfoo", "https://www.promptfoo.dev/", "Quick eval harness"], ["Render / Railway / Fly.io", "https://render.com/", "Host a live demo link"]] },
];
