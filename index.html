{ id: "be-scale", topic: "backend", title: "Caching, queues and background work", mins: 50,
  body: `
<p>LLM calls are slow (seconds) and expensive. Customer systems have rate limits. Traffic spikes at 10 a.m. These three tools handle all of that.</p>
<p><b>Caching</b> stores results so repeated requests are instant and free.</p>
<ul><li>Where: in memory (per process), <b>Redis</b> (shared), HTTP caches/CDNs.</li>
<li>Strategy: <i>cache-aside</i>: check cache → if missing, compute, store with a <b>TTL</b> (time to live).</li>
<li>For LLMs: cache identical prompts; provider-side <b>prompt caching</b> reduces cost for long repeated prefixes; <b>semantic caching</b> matches similar questions (use carefully).</li>
<li>Invalidation is the hard part: when source data changes, stale answers must expire.</li></ul>
<p><b>Queues and workers</b> move slow work out of the request:</p>
<pre>POST /documents  -> save file, enqueue job, return 202 {"job_id": "..."}
worker           -> takes job, extracts text, embeds, updates status
GET /jobs/{id}   -> {"status": "done", "result_url": "..."}</pre>
<p>Tools: Celery or RQ with Redis, cloud queues (SQS, Pub/Sub), or Temporal for long multi-step workflows with retries.</p>
<p><b>Rate limiting</b> protects you and the systems you call: token bucket or fixed window per user/tenant; return 429 with Retry-After.</p>
<p><b>Concurrency:</b> async I/O for many network calls; worker processes for CPU-heavy work; always cap concurrency against external APIs.</p>`,
  watch: [V("Redis crash course", "redis crash course caching"), V("Celery with Redis tutorial", "celery redis python tutorial"), V("Rate limiting algorithms explained", "rate limiting algorithms token bucket explained")],
  cheat: `<pre>Cache-aside:
  v = redis.get(k)
  if v is None: v = compute(); redis.set(k, v, ex=3600)
Key design: f"summary:{doc_id}:{model}:{prompt_version}"
LLM: exact-match cache | provider prompt caching | semantic cache
Async job pattern: 202 Accepted + job_id -> poll or webhook
Celery: @app.task def process(doc_id): ... ; process.delay(doc_id)
Retries with backoff; dead-letter after N tries
Rate limit: token bucket per tenant; 429 + Retry-After
Concurrency cap: asyncio.Semaphore(8)</pre>`,
  tips: ["Include the model name and prompt version in LLM cache keys, or you'll serve stale answers after changes.", "Anything over a couple of seconds belongs in a background job with a status endpoint.", "Make jobs idempotent; queues deliver at least once.", "A cache without a TTL is a future bug."],
  qs: [
    { q: "Document processing takes 90 seconds. What should POST /documents return?", o: ["202 Accepted with a job ID, processing in a worker", "Wait 90 seconds and return 200", "500", "Nothing"], a: 0, why: "Long work goes async; clients poll or get a webhook." },
    { q: "Why include prompt version and model in an LLM cache key?", o: ["So changing the prompt or model doesn't return old cached answers", "To make keys longer", "Redis requires it", "For encryption"], a: 0, why: "The cached answer is only valid for that exact prompt and model." },
    { q: "What does a TTL on a cache entry do?", o: ["Expires it automatically after a set time", "Encrypts it", "Makes it permanent", "Compresses it"], a: 0, why: "TTL limits how stale cached data can get." },
    { q: "A queue may deliver the same job twice. What must the worker be?", o: ["Idempotent", "Faster", "Written in Java", "Single-threaded"], a: 0, why: "At-least-once delivery requires handling duplicates safely." },
  ],
  scen: [{ t: "Async summariser", d: "Build POST /summarise that enqueues a job (RQ or Celery + Redis in Docker), a worker that 'summarises' (sleep 5 s + first sentence), and GET /jobs/{id}. Add a Redis cache so the same text returns instantly the second time." }],
  where: [["Redis docs", "https://redis.io/docs/latest/", "Data types and caching patterns"], ["RQ (Redis Queue)", "https://python-rq.org/", "Simplest Python job queue"], ["Temporal", "https://temporal.io/", "Durable workflows for long-running processes"]] },

{ id: "ops-docker", topic: "cloud", title: "Docker and containers", mins: 60,
  body: `
<p>"It works on my machine" ends with containers. A <b>container</b> packages your app with its exact Python version, libraries and files, so it runs the same on your laptop, a customer's server or the cloud. Postings list Docker as a basic expectation.</p>
<pre># Dockerfile
FROM python:3.12-slim
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY . .
ENV PORT=8000
EXPOSE 8000
CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]</pre>
<p><b>Image</b> = the built package (a recipe's result). <b>Container</b> = a running instance of an image. <b>Registry</b> = where images are stored (Docker Hub, AWS ECR, GitHub Container Registry).</p>
<pre>docker build -t triage-api:1.0 .
docker run -p 8000:8000 --env-file .env triage-api:1.0</pre>
<p><b>Docker Compose</b> runs several containers together (API + Postgres + Redis) with one file and one command: <code>docker compose up</code>.</p>
<p><b>Good practices:</b> slim base images, copy requirements before code so rebuilds are fast (layer caching), a <code>.dockerignore</code>, never bake secrets into images (pass them at runtime), run as a non-root user, tag images with versions (not only <code>latest</code>), and scan images for vulnerabilities.</p>
<p>Customers with strict security often require images built from their approved base images and pushed to their private registry.</p>`,
  watch: [V("Docker in 100 seconds + tutorial", "docker tutorial for beginners"), V("Docker compose tutorial", "docker compose tutorial"), V("Docker in Hindi (Piyush Garg / Chai aur Code)", "docker tutorial hindi", "HI")],
  cheat: `<pre>docker build -t name:tag .          docker images
docker run -d -p 8000:8000 --env-file .env --name api name:tag
docker ps [-a]   docker logs -f api   docker exec -it api sh
docker stop api  docker rm api   docker rmi name:tag
docker compose up -d --build   docker compose down   docker compose logs -f
Dockerfile order: FROM > WORKDIR > COPY reqs > RUN install > COPY code > CMD
.dockerignore: .git .venv __pycache__ .env
Secrets: runtime env / secret mounts, never COPY .env into image
USER appuser   (don't run as root)
docker push registry/name:tag</pre>`,
  tips: ["Copy requirements.txt and install BEFORE copying code; code changes then rebuild in seconds.", "Bind to 0.0.0.0 inside containers, or the app is unreachable from outside.", "Secrets never go in the image; anyone who pulls it can read them.", "docker logs and docker exec are your first debugging tools."],

{ id: "ops-aws", topic: "cloud", title: "Cloud fundamentals (AWS, Azure, GCP)", mins: 75,
  body: `
<p>Customers run on AWS, Azure or Google Cloud, often more than one. Postings name AWS most often. The concepts transfer between clouds; learn one well and the others become renaming.</p>
<table class="ops"><tr><td><b>Concept</b></td><td><b>AWS</b></td><td><b>Azure</b></td><td><b>GCP</b></td></tr>
<tr><td>Identity & permissions</td><td>IAM</td><td>Entra ID + RBAC</td><td>IAM</td></tr>
<tr><td>Private network</td><td>VPC</td><td>VNet</td><td>VPC</td></tr>
<tr><td>Virtual machines</td><td>EC2</td><td>Virtual Machines</td><td>Compute Engine</td></tr>
<tr><td>Containers</td><td>ECS / EKS / App Runner</td><td>Container Apps / AKS</td><td>Cloud Run / GKE</td></tr>
<tr><td>Functions</td><td>Lambda</td><td>Functions</td><td>Cloud Functions</td></tr>
<tr><td>Object storage</td><td>S3</td><td>Blob Storage</td><td>Cloud Storage</td></tr>
<tr><td>Managed Postgres</td><td>RDS / Aurora</td><td>Azure Database for PostgreSQL</td><td>Cloud SQL</td></tr>
<tr><td>Secrets</td><td>Secrets Manager</td><td>Key Vault</td><td>Secret Manager</td></tr>
<tr><td>Logs & metrics</td><td>CloudWatch</td><td>Monitor</td><td>Cloud Logging</td></tr>
<tr><td>Hosted LLMs</td><td>Bedrock</td><td>Azure OpenAI / AI Foundry</td><td>Vertex AI</td></tr></table>
<p><b>IAM and least privilege:</b> every service gets a role with only the permissions it needs. Prefer roles (temporary credentials) over long-lived access keys.</p>
<p><b>Networking basics:</b> a VPC is your private network; <b>public subnets</b> face the internet, <b>private subnets</b> don't. Databases live in private subnets. <b>Security groups</b> are firewalls. <b>Private endpoints / PrivateLink</b> let services talk without the public internet, which enterprise security teams often require.</p>
<p><b>Cost:</b> set budgets and alerts on day one. Idle GPUs, NAT gateways and forgotten databases burn money quietly.</p>`,
  watch: [V("AWS cloud practitioner full course", "aws cloud practitioner full course"), V("AWS VPC explained", "aws vpc explained simply"), V("AWS in Hindi (Technical Guftgu)", "aws tutorial hindi technical guftgu", "HI")],
  cheat: `<pre>Least privilege: role per service, only needed actions + resources
Prefer IAM roles / workload identity over static access keys
VPC: public subnet (LB) | private subnet (app, DB) | security groups
Private connectivity: VPC endpoints / PrivateLink / Private Endpoint
Deploy options: VM (EC2) < containers (ECS/Cloud Run) < functions (Lambda)
Storage: S3 buckets private by default; presigned URLs for sharing
aws configure ; aws s3 ls ; aws sts get-caller-identity
Regions matter: data residency + latency + model availability
Budgets + alerts from day one
LLM hosting in customer cloud: Bedrock / Azure OpenAI / Vertex AI</pre>`,
  tips: ["Learn one cloud deeply (AWS is the safest bet), then map the others with a table like the one above.", "`aws sts get-caller-identity` answers 'who am I right now?' when permissions act strange.", "Enterprise customers often want the LLM called inside their own cloud account (Bedrock/Azure OpenAI) for data control.", "Tag every resource with project and owner so you can find and delete it later."],
  qs: [
    { q: "What does least privilege mean in IAM?", o: ["Each identity gets only the permissions it needs", "Everyone gets admin to avoid delays", "Only one user can log in", "Passwords must be short"], a: 0, why: "Limiting permissions limits the damage from bugs or stolen credentials." },
    { q: "Where should a production database usually sit?", o: ["In a private subnet, not reachable from the internet", "In a public subnet with an open port", "On a developer laptop", "In an S3 bucket"], a: 0, why: "Only the application should reach the database." },
    { q: "A bank wants the LLM to run inside its own AWS account. Which service fits?", o: ["Amazon Bedrock", "Amazon S3", "AWS Lambda alone", "CloudFront"], a: 0, why: "Bedrock provides foundation models inside the customer's AWS environment." },
    { q: "What is the Azure equivalent of AWS S3?", o: ["Blob Storage", "Key Vault", "Entra ID", "AKS"], a: 0, why: "Both are object storage services." },
  ],
  scen: [{ t: "Deploy to the cloud", d: "On a free tier, deploy your containerised API to a managed container service (AWS App Runner/ECS, Google Cloud Run, or Azure Container Apps), with the database in a managed service and the secret in a secrets manager. Then delete everything and check the bill." }],
  where: [["AWS Skill Builder", "https://skillbuilder.aws/", "Free Cloud Practitioner training"], ["AWS Free Tier", "https://aws.amazon.com/free/", "Hands-on account"], ["Google Cloud Skills Boost", "https://www.cloudskillsboost.google/", "Labs with temporary accounts"], ["Microsoft Learn: Azure fundamentals", "https://learn.microsoft.com/en-us/training/", "Free AZ-900 path"]] },

{ id: "ops-cicd", topic: "cloud", title: "CI/CD with GitHub Actions", mins: 45,
  body: `
<p><b>Continuous Integration (CI)</b> runs your tests, linters and builds automatically on every push or pull request. <b>Continuous Delivery/Deployment (CD)</b> ships passing code to staging or production automatically.</p>
<pre># .github/workflows/ci.yml
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "build image, push, deploy"   # e.g. docker build/push, cloud deploy
        env:
          API_KEY: \${{ secrets.API_KEY }}</pre>
<p><b>Concepts:</b> <b>workflow</b> (YAML file) → <b>jobs</b> (run on fresh machines, can depend on each other) → <b>steps</b> (commands or reusable <b>actions</b>). <b>Secrets</b> are stored in repo/org settings, never in YAML.</p>
<p><b>A good pipeline:</b> lint → unit tests → build image → security scan → deploy to staging → smoke tests → (approval) → production. For AI systems, add an <b>eval step</b> that fails the build if answer quality drops (Evals topic).</p>
<p>Prefer <b>OIDC</b> federation from GitHub to your cloud over storing long-lived cloud keys as secrets.</p>`,
  watch: [V("GitHub Actions tutorial", "github actions tutorial beginners"), V("CI/CD explained", "ci cd explained simply"), V("GitHub Actions in Hindi", "github actions hindi", "HI")],
  cheat: `<pre>.github/workflows/*.yml
on: push | pull_request | schedule: [{cron: "0 2 * * *"}] | workflow_dispatch
jobs.<id>.runs-on / needs / if / strategy.matrix
steps: - uses: owner/action@v4   - run: shell command
Secrets: \${{ secrets.NAME }}  (Settings > Secrets and variables)
Environments: staging / production with required reviewers
Cache deps: actions/setup-python with cache: pip
Cloud auth: OIDC (aws-actions/configure-aws-credentials role-to-assume)
Pipeline: lint > test > build > scan > deploy staging > smoke > prod
AI: add eval job with a pass threshold</pre>`,
  tips: ["Make CI fast (under ~5 minutes) or people stop waiting for it.", "Protect main: require passing checks and a review before merge.", "Use environments with required reviewers for production deploys.", "A scheduled (cron) workflow is a free way to run nightly evals or data checks."],
  qs: [
    { q: "What is the main job of CI?", o: ["Automatically test and check every change", "Write code for you", "Host the website", "Store passwords"], a: 0, why: "CI catches problems before they merge." },
    { q: "Where should a deployment API key used by GitHub Actions be stored?", o: ["Repository or organisation secrets", "In the workflow YAML", "In the README", "In a commit message"], a: 0, why: "Secrets are encrypted and masked in logs." },
    { q: "`needs: test` on the deploy job means...", o: ["Deploy only runs after the test job succeeds", "Deploy runs tests itself", "Tests run after deploy", "Nothing"], a: 0, why: "needs creates a dependency between jobs." },
    { q: "What extra CI step suits LLM applications?", o: ["An eval suite that fails the build if quality drops below a threshold", "Deleting old branches", "Changing the logo", "Nothing extra"], a: 0, why: "Prompt or model changes can silently degrade quality; evals catch it." },
  ],
  scen: [{ t: "Add CI to your project", d: "Add a workflow to your FastAPI repo: ruff + pytest on every PR, and on main build the Docker image and push it to GitHub Container Registry. Break a test on purpose and watch the PR go red." }],
  where: [["GitHub Actions docs", "https://docs.github.com/en/actions", "Quickstart and reference"], ["GitHub Skills: Actions", "https://skills.github.com/", "Guided hands-on courses"]] },

{ id: "ops-k8s", topic: "cloud", title: "Kubernetes basics", mins: 60,
  body: `
<p>Large enterprises run containers on <b>Kubernetes</b> (K8s). You don't need to be an expert, but FDE postings ask for "Kubernetes basics", and you'll deploy into customers' clusters.</p>
<p>Kubernetes keeps your containers running in the state you declare: "3 copies of this image, reachable on this address, restarted if they crash".</p>
<table class="ops"><tr><td><b>Pod</b></td><td>one or more containers running together; the smallest unit</td></tr>
<tr><td><b>Deployment</b></td><td>keeps N identical pods running; handles rolling updates and rollbacks</td></tr>
<tr><td><b>Service</b></td><td>stable internal address and load balancing across pods</td></tr>
<tr><td><b>Ingress</b></td><td>routes external HTTP traffic into services</td></tr>
<tr><td><b>ConfigMap / Secret</b></td><td>configuration and sensitive values injected into pods</td></tr>
<tr><td><b>Namespace</b></td><td>a folder-like boundary for teams or apps</td></tr>
<tr><td><b>Probes</b></td><td>liveness (restart if dead) and readiness (send traffic only when ready)</td></tr></table>
<pre>apiVersion: apps/v1
kind: Deployment
metadata: { name: triage-api }
spec:
  replicas: 3
  selector: { matchLabels: { app: triage-api } }
  template:
    metadata: { labels: { app: triage-api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/me/triage-api:1.4.0
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: triage-secrets } }]
          readinessProbe: { httpGet: { path: /readyz, port: 8000 } }
          resources: { requests: { cpu: "250m", memory: "256Mi" } }</pre>
<p><b>Helm</b> packages Kubernetes YAML into reusable charts with values per environment; many customers will ask for a Helm chart. Managed clusters: EKS (AWS), AKS (Azure), GKE (Google).</p>`,
  watch: [V("Kubernetes explained in 15 minutes", "kubernetes explained simply"), V("Kubernetes crash course", "kubernetes crash course beginners"), V("Kubernetes in Hindi", "kubernetes tutorial hindi", "HI")],
  cheat: `<pre>kubectl get pods|deploy|svc|ingress -n ns
kubectl describe pod NAME        (events: why won't it start?)
kubectl logs -f NAME [-c container]    kubectl exec -it NAME -- sh
kubectl apply -f file.yaml       kubectl delete -f file.yaml
kubectl rollout status deploy/x  kubectl rollout undo deploy/x
kubectl port-forward svc/x 8000:80
Common failures: ImagePullBackOff (image/registry auth)
                 CrashLoopBackOff (app crashes: check logs)
                 Pending (no resources / node selector)
Helm: helm install name ./chart -f values-prod.yaml ; helm upgrade</pre>`,
  tips: ["`kubectl describe` shows the events that explain most startup failures.", "CrashLoopBackOff = your app is crashing; read the logs. ImagePullBackOff = the cluster can't pull your image.", "Readiness probes prevent traffic hitting pods that aren't ready.", "Practise on a local cluster (kind or minikube) before touching a customer's."],
  qs: [
    { q: "What does a Deployment do?", o: ["Keeps a desired number of identical pods running and manages updates", "Stores secrets", "Routes internet traffic", "Builds images"], a: 0, why: "Deployments reconcile reality with the declared replica count and handle rollouts." },
    { q: "A pod shows CrashLoopBackOff. What do you check first?", o: ["kubectl logs for the crashing container", "Buy more nodes", "Delete the namespace", "Change the image tag to latest"], a: 0, why: "The container keeps crashing; the logs say why." },
    { q: "What gives pods a stable internal address?", o: ["A Service", "A ConfigMap", "A Namespace", "A Probe"], a: 0, why: "Pods come and go; Services provide a fixed name and load balancing." },
    { q: "What is Helm?", o: ["A package manager that templates Kubernetes manifests into charts", "A container runtime", "A monitoring tool", "A cloud provider"], a: 0, why: "Helm charts make deployments repeatable across environments." },
  ],
  scen: [{ t: "Local cluster", d: "Install kind or minikube, deploy your API image with 2 replicas, a Service and a readiness probe. Break the image tag and diagnose it with describe and logs, then roll back." }],
  where: [["Kubernetes basics tutorial", "https://kubernetes.io/docs/tutorials/kubernetes-basics/", "Official interactive tutorial"], ["Killercoda Kubernetes", "https://killercoda.com/playgrounds", "Free browser clusters"], ["kind", "https://kind.sigs.k8s.io/", "Kubernetes in Docker on your laptop"]] },

{ id: "ops-iac", topic: "cloud", title: "Infrastructure as code with Terraform", mins: 50,
  body: `
<p>Clicking around a cloud console is fine for learning, but production infrastructure must be <b>reproducible, reviewable and repeatable</b>, especially when you deploy the same solution for many customers. <b>Infrastructure as Code (IaC)</b> describes cloud resources in files kept in Git.</p>
<pre># main.tf
provider "aws" { region = "ap-south-1" }

resource "aws_s3_bucket" "docs" {
  bucket = "acme-rag-docs-prod"
  tags   = { project = "rag-pilot", owner = "fde" }
}

resource "aws_s3_bucket_public_access_block" "docs" {
  bucket                  = aws_s3_bucket.docs.id
  block_public_acls       = true
  block_public_policy     = true
  ignore_public_acls      = true
  restrict_public_buckets = true
}</pre>
<p><b>The workflow:</b> <code>terraform init</code> (download providers) → <code>terraform plan</code> (preview what will change) → <code>terraform apply</code> (make it so) → <code>terraform destroy</code> (tear down).</p>
<p><b>Core ideas:</b> <b>resources</b> (things to create), <b>variables</b> (inputs per customer/environment), <b>outputs</b> (values to use elsewhere), <b>modules</b> (reusable bundles), and <b>state</b> (Terraform's record of what exists; store it remotely, e.g. S3 with locking, never commit it; it can contain secrets).</p>
<p><b>Why FDEs care:</b> the same module deploys the solution into customer after customer, with only variables changing. Code review catches risky changes before they happen. Alternatives you'll meet: <b>OpenTofu</b> (open-source Terraform fork), <b>Pulumi</b> (IaC in Python/TypeScript), AWS CDK, CloudFormation, Azure Bicep.</p>`,
  watch: [V("Terraform in 100 seconds + course", "terraform course for beginners"), V("Terraform in Hindi", "terraform tutorial hindi", "HI")],
  cheat: `<pre>terraform init | fmt | validate | plan | apply | destroy
resource "type" "name" { ... }     data "type" "name" { ... }
variable "env" { type = string }    var.env
output "url" { value = aws_lb.api.dns_name }
module "rag" { source = "./modules/rag" ; env = "prod" }
Remote state: backend "s3" { bucket, key, dynamodb_table/lockfile }
Never commit: *.tfstate, *.tfvars with secrets
Plan in CI on PR, apply after approval
Pulumi = same idea in Python/TS ; OpenTofu = open-source fork</pre>`,
  tips: ["Always read the plan before apply; look for 'destroy' and 'replace'.", "State files can contain secrets; keep them in encrypted remote storage.", "Make a module once, then pass variables per customer; that's the FDE scaling trick.", "Tag every resource with project, owner and environment."],
  qs: [
    { q: "What does `terraform plan` do?", o: ["Shows what would change without changing anything", "Deletes everything", "Applies changes immediately", "Formats files"], a: 0, why: "plan is a safe preview; apply makes changes." },
    { q: "Why should Terraform state be stored remotely with locking?", o: ["So teammates share one source of truth and can't apply at the same time", "It's faster locally", "To make it public", "It isn't needed"], a: 0, why: "Remote locked state prevents conflicts and lost state." },
    { q: "How do IaC modules help an FDE team?", o: ["Deploy the same solution to many customers by changing only variables", "They replace testing", "They write application code", "They're only for AWS"], a: 0, why: "Reusable modules turn bespoke setups into repeatable ones." },
    { q: "The plan says an RDS database will be 'destroyed and replaced'. What do you do?", o: ["Stop and investigate; data loss is likely", "Apply quickly", "Ignore it", "Delete the state file"], a: 0, why: "Replacing a database usually means losing its data unless handled carefully." },
  ],
  scen: [{ t: "Codify your deployment", d: "Write Terraform (or Pulumi) that creates a private S3 bucket and a small container service for your API, with variables for environment name. Apply, change a tag, plan again to see the diff, then destroy." }],
  where: [["Terraform tutorials", "https://developer.hashicorp.com/terraform/tutorials", "Official hands-on paths for AWS/Azure/GCP"], ["OpenTofu", "https://opentofu.org/docs/", "Open-source alternative"], ["Pulumi get started", "https://www.pulumi.com/docs/get-started/", "IaC in Python"]] },

{ id: "ops-envs", topic: "cloud", title: "Deploying anywhere: private cloud, on-prem, air-gapped", mins: 50,
  body: `
<p>Regulated customers (banks, hospitals, governments, defence) often won't let data leave their network. "Deploy anywhere" is a named FDE skill.</p>
<p><b>The spectrum:</b></p>
<table class="ops"><tr><td><b>SaaS</b></td><td>you host everything; customer data comes to you. Fastest, least control for them.</td></tr>
<tr><td><b>Single-tenant / dedicated</b></td><td>a separate copy of your stack just for them, in your cloud.</td></tr>
<tr><td><b>Customer's cloud (VPC)</b></td><td>you deploy into their AWS/Azure/GCP account; data stays in their account.</td></tr>
<tr><td><b>On-premises</b></td><td>their own data centre and hardware.</td></tr>
<tr><td><b>Air-gapped</b></td><td>no internet connection at all. Everything, including models and packages, must be brought in.</td></tr></table>
<p><b>Model access options when data can't leave:</b> the cloud provider's hosted models inside their account (Bedrock, Azure OpenAI, Vertex AI) with private endpoints; or <b>self-hosted open-weight models</b> served with <b>vLLM</b>, TGI, or Ollama on their GPUs.</p>
<p><b>Air-gapped checklist:</b> container images mirrored to their internal registry; Python/npm packages from an internal mirror; model weights transferred and checksummed; no telemetry or license checks calling home; time sync, certificates and DNS all internal; update process documented.</p>
<p><b>Remote debugging etiquette:</b> you may only get screen-share or log exports. Build good logs, a diagnostics command that bundles config (with secrets redacted), versions and recent errors, and runbooks the customer's team can follow.</p>`,
  watch: [V("Self-hosting LLMs with vLLM", "vllm tutorial self host llm"), V("Ollama tutorial", "ollama tutorial run llm locally"), V("Azure OpenAI private endpoint", "azure openai private endpoint explained")],
  cheat: `<pre>Deployment models: SaaS > single-tenant > customer VPC > on-prem > air-gapped
                   (speed ->)                      (<- control)
Data can't leave? -> Bedrock / Azure OpenAI / Vertex in THEIR account
                  -> or self-host: vLLM / TGI / Ollama on their GPUs
Private networking: private endpoints, no public IPs, egress allow-lists
Air-gap kit: images -> internal registry; pip/npm mirror;
             model weights + sha256; offline docs; no phone-home
Proxy aware: HTTPS_PROXY, custom CA certificates (REQUESTS_CA_BUNDLE)
Support bundle: versions, redacted config, last N errors, health checks</pre>`,
  tips: ["Ask about network egress on day one; 'the server can't reach the internet' blocks everything.", "Corporate proxies with custom certificates break Python HTTPS calls; know REQUESTS_CA_BUNDLE and SSL_CERT_FILE.", "Open-weight models let you run where APIs can't, but you now own GPUs, scaling and upgrades.", "Ship a diagnostics command; you'll often debug through someone else's hands."],
  qs: [
    { q: "A hospital requires that patient data never leaves its Azure tenant. Which model option fits?", o: ["Azure OpenAI (or another model) deployed in their tenant with private networking", "A public consumer chatbot", "Your laptop", "Emailing data to the vendor"], a: 0, why: "The model runs inside their controlled environment." },
    { q: "In an air-gapped deployment, how do you install Python packages?", o: ["From an internal mirror or pre-downloaded wheels", "pip install from the internet", "They're not needed", "Ask the model"], a: 0, why: "There's no internet; everything must be brought in and hosted internally." },
    { q: "Python HTTPS calls fail with certificate errors inside a corporate network. Likely cause?", o: ["A proxy using a custom CA certificate that Python doesn't trust", "Python is too new", "The API is down", "Wrong JSON"], a: 0, why: "Set REQUESTS_CA_BUNDLE/SSL_CERT_FILE to the corporate CA bundle." },
    { q: "Which tool serves open-weight LLMs efficiently on your own GPUs?", o: ["vLLM", "Excel", "Airflow", "Postman"], a: 0, why: "vLLM is a high-throughput inference server for open models." },
  ],
  scen: [{ t: "Offline pilot plan", d: "A defence customer wants your RAG assistant with zero internet access. Write a one-page deployment plan: model choice, hardware, how images/packages/weights get in, updates, monitoring, and what you can't offer offline." }],
  where: [["Ollama", "https://ollama.com/", "Run open models locally to practise"], ["vLLM docs", "https://docs.vllm.ai/", "Serving open models"], ["Amazon Bedrock docs", "https://docs.aws.amazon.com/bedrock/", "Models inside AWS accounts"]] },

// ───────── SYSTEM DESIGN
{ id: "sd-basics", topic: "design", title: "System design fundamentals", mins: 75,
  body: `
<p>System design is a dedicated FDE interview round and a daily job skill: "how would you build X for this customer?" You're judged on clear thinking and trade-offs, not on a single right answer.</p>
<p><b>The building blocks:</b></p>
<ul><li><b>Clients</b> → <b>load balancer</b> → several stateless <b>app servers</b> (scale horizontally by adding more).</li>
<li><b>Database</b>: relational by default; add <b>read replicas</b> for heavy reads; <b>sharding</b> when one database can't hold it all.</li>
<li><b>Cache</b> (Redis) for hot data; <b>CDN</b> for static files near users.</li>
<li><b>Queue</b> + <b>workers</b> for slow or spiky work.</li>
<li><b>Object storage</b> (S3) for files; <b>search</b> (Elasticsearch/OpenSearch) and <b>vector DB</b> for retrieval.</li></ul>
<p><b>Back-of-envelope numbers</b> guide choices: 1 million requests/day ≈ 12/second average (peak maybe 5-10×). 1 KB × 1 million rows ≈ 1 GB. An LLM call ≈ 1-10 s and costs real money per 1,000 calls.</p>
<p><b>Classic trade-offs:</b> consistency vs availability (CAP: when the network splits you must choose), latency vs cost, simplicity vs flexibility, build vs buy. Say which you choose and why.</p>
<p><b>An interview method (about 45 minutes):</b></p>
<ol><li>Clarify requirements: functional (what it does) and non-functional (scale, latency, security, availability).</li>
<li>Estimate scale.</li>
<li>Sketch a high-level diagram and the data flow.</li>
<li>Design the data model and APIs.</li>
<li>Deep-dive the hardest part; discuss bottlenecks and failure modes.</li>
<li>Summarise trade-offs and what you'd do next.</li></ol>`,
  watch: [V("System design for beginners", "system design course for beginners"), V("ByteByteGo system design basics", "bytebytego system design"), V("System design in Hindi", "system design hindi", "HI")],
  cheat: `<pre>Method: requirements > estimates > diagram > data+APIs > deep dive > trade-offs
Numbers: 1M/day ~ 12 rps ; 86,400 s/day ; peak = 5-10x avg
         RAM read ~100 ns | SSD ~100 us | same-DC call ~0.5 ms
         cross-region ~100 ms | LLM call 1-10 s
Scale reads: cache, replicas, CDN      Scale writes: queue, shard, batch
Stateless app servers behind a load balancer
CAP: partition -> choose consistency or availability
SQL default; NoSQL for huge scale / flexible docs; vector DB for semantic search
Always cover: auth, observability, failure modes, cost</pre>`,
  tips: ["Spend the first 5 minutes asking questions; jumping to boxes is the most common failure.", "Say numbers out loud; estimates justify every design choice.", "Name at least one failure mode per component and how you'd handle it.", "Draw the data flow for one request end-to-end."],
  qs: [

{ id: "sd-reliability", topic: "design", title: "Reliability, failure modes and observability", mins: 60,
  body: `
<p>Everything fails eventually: networks, disks, third-party APIs, LLM providers, and the customer's CRM during their month-end close. Design for it.</p>
<p><b>Failure-handling toolkit:</b></p>
<ul><li><b>Timeouts</b> everywhere; <b>retries</b> with backoff for transient errors only.</li>
<li><b>Circuit breaker</b>: after repeated failures, stop calling a broken dependency for a while and fail fast.</li>
<li><b>Fallbacks / graceful degradation</b>: if the LLM is down, show search results or queue the request; if the premium model is slow, use a smaller one.</li>
<li><b>Idempotency</b> so retries don't duplicate side effects.</li>
<li><b>Bulkheads</b>: isolate resources so one noisy tenant or feature can't take down everything.</li>
<li><b>Backpressure</b>: queues and rate limits so bursts don't overwhelm systems.</li></ul>
<p><b>Observability</b> is how you know what's happening:</p>
<table class="ops"><tr><td><b>Logs</b></td><td>events with context (structured JSON, request IDs)</td></tr>
<tr><td><b>Metrics</b></td><td>numbers over time: request rate, error rate, latency percentiles (p50/p95/p99), queue depth, cost</td></tr>
<tr><td><b>Traces</b></td><td>the path of one request across services, with timing per step (OpenTelemetry)</td></tr></table>
<p><b>SLIs, SLOs, SLAs:</b> an SLI is a measurement (successful requests %); an SLO is your target (99.5% over 30 days); an SLA is a contract with penalties. The gap between 100% and the SLO is your <b>error budget</b>.</p>
<p>Watch <b>p95/p99 latency</b>, not just the average: the slowest 5% of users are the ones who complain.</p>`,
  watch: [V("Circuit breaker pattern explained", "circuit breaker pattern explained"), V("Observability logs metrics traces", "observability logs metrics traces explained"), V("SLO SLI SLA explained", "sli slo sla explained google sre")],
  cheat: `<pre>Timeout > Retry(backoff, jitter, cap) > Circuit breaker > Fallback
Idempotency keys for side effects
Bulkhead: separate pools/limits per tenant or feature
Backpressure: queue + rate limit + 429
Golden signals: latency, traffic, errors, saturation
Percentiles: p50 typical, p95/p99 tail pain
SLI measure -> SLO target -> SLA contract ; error budget = 100% - SLO
Tools: OpenTelemetry, Prometheus + Grafana, Datadog, CloudWatch, Sentry
LLM extras: tokens, cost per request, model/prompt version, eval score</pre>`,
  tips: ["For each dependency in your diagram, ask: what happens when this is slow? when it's down?", "Alert on symptoms users feel (error rate, latency), not every internal blip.", "Averages hide pain; track p95 and p99.", "Log model name, prompt version and token counts for every LLM call."],
  qs: [
    { q: "What does a circuit breaker do?", o: ["Stops calling a failing dependency for a while so the system fails fast instead of piling up", "Cuts electricity to servers", "Encrypts traffic", "Restarts the database"], a: 0, why: "It prevents cascading failures and gives the dependency time to recover." },
    { q: "Average latency is 300 ms but users complain. What should you check?", o: ["p95/p99 latency", "Only the average again", "Disk space", "Nothing"], a: 0, why: "Tail latency reveals the slow experiences averages hide." },
    { q: "An SLO of 99.9% monthly availability allows roughly how much downtime per 30 days?", o: ["About 43 minutes", "About 7 hours", "About 4 minutes", "Zero"], a: 0, why: "0.1% of 43,200 minutes ≈ 43 minutes: that's the error budget." },
    { q: "The LLM provider is down. What's a graceful degradation?", o: ["Show keyword search results or queue the request and notify the user", "Return a 500 to everyone", "Crash the app", "Retry forever"], a: 0, why: "Users get something useful instead of a hard failure." },
  ],
  scen: [{ t: "Failure-mode table", d: "For your support-copilot design, make a table: component | how it fails | user impact | detection (metric/alert) | mitigation. Cover at least 8 rows including the LLM, vector DB, CRM API and queue." }],
  where: [["Google SRE book (free)", "https://sre.google/sre-book/table-of-contents/", "SLOs, monitoring, incident response"], ["OpenTelemetry docs", "https://opentelemetry.io/docs/", "Standard for traces/metrics/logs"], ["Grafana Play", "https://play.grafana.org/", "Explore real dashboards"]] },

{ id: "sd-enterprise", topic: "design", title: "Designing for enterprise constraints", mins: 60,
  body: `
<p>FDE system design rounds are different from standard ones: interviewers add enterprise constraints. Guides describe it as "real-world deployment architecture": data flow, <b>trust boundaries</b>, auth, observability, failure modes and rollback.</p>
<p><b>Constraints to ask about (and design for):</b></p>
<ul><li><b>Identity</b>: users log in with the customer's SSO; permissions follow their existing roles.</li>
<li><b>Data residency</b>: data must stay in a country or region (e.g., India, EU).</li>
<li><b>Network</b>: no public internet from their servers; traffic via private links; egress allow-lists.</li>
<li><b>Compliance</b>: SOC 2, HIPAA, GDPR, DPDP; audit logs of who did what.</li>
<li><b>Existing systems</b>: must integrate with their CRM/ERP/ticketing, not replace them.</li>
<li><b>Change control</b>: deploy only in approved windows; changes need tickets and approvals.</li>
<li><b>Messy data</b>: inconsistent, incomplete, and owned by different teams.</li></ul>
<p><b>Trust boundaries</b> are lines where data crosses between different levels of trust: the user's browser → your API → the LLM provider → the customer's CRM. At each crossing, ask: who is authenticated, what is validated, what is logged, what is encrypted, what data is allowed across?</p>
<p><b>Draw the data flow</b> for sensitive data explicitly: where it enters, where it's stored, how long it's kept (retention), who can see it, and whether it's sent to a model provider (and whether that provider retains or trains on it).</p>
<p><b>Rollback plan</b>: every change needs a way back: versioned deployments, feature flags, database migrations that can be reversed or are backwards-compatible.</p>`,
  watch: [V("Enterprise architecture for AI applications", "enterprise ai architecture security design"), V("Threat modeling and trust boundaries", "threat modeling trust boundaries explained")],
  cheat: `<pre>Ask: SSO? residency? network egress? compliance regime?
     systems of record? change windows? data owners? retention?
Trust boundary checklist at each hop:
  authN | authZ | validate | encrypt (TLS/at rest) | log | minimise data
Data-flow diagram for sensitive data: enter > store > process > model > output > delete
Audit log: who, what, when, from where, result
Rollback: versioned artifacts + feature flags + backward-compatible migrations
Deliverables: architecture diagram, data-flow diagram, security answers, runbook</pre>`,
  tips: ["Mark trust boundaries on the diagram with dotted lines; interviewers look for them.", "State where the model runs and whether prompts are retained; security teams always ask.", "Design migrations as expand → migrate → contract so each step is reversible.", "Assume change freezes near month-end and holidays; plan timelines around them."],
  qs: [
    { q: "What is a trust boundary?", o: ["A point where data or requests cross between components with different trust levels", "A firewall brand", "A legal contract", "A team boundary in Jira"], a: 0, why: "Each crossing needs authentication, validation and controls." },
    { q: "A customer requires EU data to stay in the EU. What does that affect?", o: ["Which regions host storage, processing and the LLM endpoint", "Only the UI language", "Nothing if encrypted", "Only backups"], a: 0, why: "Data residency covers every place data is stored or processed." },
    { q: "What's the purpose of an audit log in enterprise systems?", o: ["Record who did what and when, for security and compliance", "Speed up queries", "Store passwords", "Replace monitoring"], a: 0, why: "Auditors and security teams need a trustworthy history of actions." },
    { q: "Which migration approach supports safe rollback?", o: ["Expand-migrate-contract: add new structure, move data, remove old later", "Drop old columns immediately", "Edit production by hand", "No migrations"], a: 0, why: "Each step stays compatible with the previous version." },
  ],
  scen: [{ t: "Bank deployment design", d: "Design a document Q&A assistant for a bank: SSO, per-department document permissions, data stays in India, model inside their cloud, audit logging, and a rollback plan. Produce an architecture diagram and a data-flow diagram with trust boundaries marked." }],
  where: [["OWASP Threat Modeling", "https://owasp.org/www-community/Threat_Modeling", "How to reason about trust boundaries"], ["AWS Well-Architected Framework", "https://aws.amazon.com/architecture/well-architected/", "Security, reliability, cost pillars"], ["draw.io", "https://app.diagrams.net/", "Free architecture diagrams"]] },

{ id: "sd-llm", topic: "design", title: "Designing LLM systems", mins: 60,
  body: `
<p>AI-lab FDE interviews increasingly ask you to design an LLM application end to end: "Design an assistant that answers HR policy questions for 50,000 employees" or "Design an agent that processes invoices."</p>
<p><b>A reference architecture:</b></p>
<pre>User (SSO) → UI → API gateway
   → Orchestrator (your code)
       ├─ Input guardrails (PII, injection, policy)
       ├─ Retrieval (permission-filtered search / vector DB)
       ├─ LLM gateway → model(s) (primary + fallback)
       ├─ Tools (CRM, ticketing, DB) with scoped credentials
       └─ Output checks (schema, citations, policy)
   → Response (+ sources, feedback buttons)
Logging/tracing → eval pipeline → dashboards</pre>
<p><b>Design decisions to discuss:</b></p>
<ul><li><b>Which pattern</b>: plain prompt, RAG, workflow, or agent? Choose the simplest that works.</li>
<li><b>Model choice</b>: quality vs latency vs cost; routing easy requests to smaller models.</li>
<li><b>Cost math</b>: requests/day × tokens/request × price. Caching and shorter prompts cut it.</li>
<li><b>Latency</b>: streaming, parallel retrieval, smaller models, precomputation.</li>
<li><b>An LLM gateway</b> centralises keys, rate limits, retries, fallbacks, logging and cost tracking.</li>
<li><b>Evaluation</b>: golden set, online feedback, regression tests before each change.</li>
<li><b>Safety</b>: permissions on retrieval and tools, prompt-injection defences, human approval for risky actions.</li>
<li><b>Failure modes</b>: hallucination, stale data, model outage, rate limits, runaway agent loops, cost spikes.</li></ul>`,
  watch: [V("Designing LLM applications system design", "llm system design interview"), V("LLM app architecture explained", "llm application architecture production"), V("Chip Huyen building LLM applications for production", "chip huyen building llm applications for production")],
  cheat: `<pre>Pattern ladder: prompt > prompt+RAG > workflow > agent (use lowest that works)
Cost/day = requests x (in_tokens x in_price + out_tokens x out_price)
Latency: stream, cache, smaller model, parallelise retrieval, precompute
LLM gateway: keys, routing, fallback, retries, rate limits, logs, cost
Guardrails: input (PII/injection) | retrieval (permissions) | tools (scopes,
            approvals) | output (schema, citations, policy)
Observe: trace per request: prompt ver, model, tokens, latency, retrieved ids
Eval: golden set offline + feedback online + regression gate in CI</pre>`,
  tips: ["Start the design with 'what does success look like and how will we measure it?'", "Do the cost math out loud; interviewers love a quick estimate.", "Always mention where permissions are enforced: at retrieval and at tool calls.", "Propose a phased rollout: internal users → pilot group → everyone."],
  qs: [
    { q: "10,000 requests/day, 2,000 input + 500 output tokens each. Input costs $3 and output $15 per million tokens. Daily cost?", o: ["$135", "$1,350", "$13.50", "$45"], a: 0, why: "Input: 20M tokens × $3/M = $60. Output: 5M × $15/M = $75. Total $135/day." },
    { q: "Where must document permissions be enforced in an enterprise RAG assistant?", o: ["At retrieval, so users only get chunks they're allowed to see", "Only in the UI", "In the prompt text", "Nowhere; the model decides"], a: 0, why: "If restricted text reaches the prompt, the model can reveal it." },
    { q: "What's the role of an LLM gateway?", o: ["Central point for model routing, keys, retries, fallbacks, logging and cost tracking", "A UI component", "A vector database", "A training framework"], a: 0, why: "It keeps cross-cutting concerns out of every app." },
    { q: "Which pattern should you try first for a new use case?", o: ["The simplest that meets the need, often a well-crafted prompt or prompt + RAG", "A multi-agent system", "Fine-tuning a model", "Training from scratch"], a: 0, why: "Complexity adds cost, latency and failure modes; earn it." },
  ],
  scen: [{ t: "Design review", d: "Design 'an assistant that answers HR policy questions for 50,000 employees, in English and Hindi, with SSO'. Include architecture, cost estimate, latency budget, eval plan, and 5 failure modes. Present it in 10 minutes to a friend and take questions." }],
  where: [["Anthropic: Building effective agents", "https://www.anthropic.com/engineering/building-effective-agents", "Patterns for LLM workflows and agents"], ["Chip Huyen's blog", "https://huyenchip.com/blog/", "Production LLM system design essays"], ["LiteLLM", "https://docs.litellm.ai/", "Open-source LLM gateway to study"]] },
];

{ id: "llm-how", topic: "llm", title: "How LLMs work (for builders)", mins: 60,
  body: `
<p>You don't need to train models, but you must understand their behaviour well enough to predict failures and explain them to customers.</p>
<p><b>A large language model predicts the next token.</b> Given text so far, it outputs probabilities for the next piece of text, picks one, appends it, and repeats. Everything (answers, code, JSON, tool calls) comes out this way.</p>
<p><b>Tokens</b> are chunks of text (roughly ¾ of an English word; Hindi and other scripts often use more tokens per word). Pricing, speed and limits are all counted in tokens.</p>
<p><b>Context window</b>: the maximum tokens the model can see at once (prompt + conversation + retrieved documents + its answer). Anything outside it doesn't exist for the model. Long contexts cost more, are slower, and details in the middle can get less attention.</p>
<p><b>Training stages:</b> <i>pre-training</i> on huge text (general knowledge, frozen at a cutoff date) → <i>instruction tuning</i> and <i>reinforcement learning from feedback</i> (follows instructions, safer, more helpful). The model doesn't browse or remember past chats unless your system gives it that information.</p>
<p><b>Sampling settings:</b> <code>temperature</code> controls randomness (0 = most deterministic, higher = more varied); <code>max_tokens</code> caps the answer length; <code>stop</code> sequences end generation.</p>
<p><b>Why hallucinations happen:</b> the model generates plausible text, not verified facts. It is most likely to invent when asked about things not in its training or context (a customer's internal policy, recent events, specific numbers). Fixes: give it the source material (RAG), ask for citations, allow "I don't know", and evaluate.</p>
<p><b>Model families:</b> closed API models (Claude, GPT, Gemini) and open-weight models (Llama, Mistral, Qwen, DeepSeek, Gemma) you can host yourself. Also: embedding models (text → vectors), reasoning models that think before answering, and multimodal models that read images and documents.</p>`,
  watch: [V("Andrej Karpathy · Intro to Large Language Models", "andrej karpathy intro to large language models"), V("3Blue1Brown · LLMs explained briefly", "3blue1brown large language models explained briefly"), V("How LLMs work in Hindi", "how large language models work hindi", "HI")],
  cheat: `<pre>LLM = next-token predictor (trained on text, then tuned to follow instructions)
Token ~ 0.75 English words ; 1,000 tokens ~ 750 words
Context window = everything the model can see in one call (in + out)
temperature 0 -> focused/repeatable   1 -> varied/creative
max_tokens caps output ; stop sequences end it
Knowledge cutoff: no awareness of newer facts unless you provide them
No memory between calls unless you resend history
Hallucination fix kit: provide sources, ask for citations,
  allow "I don't know", constrain output, evaluate
Closed: Claude, GPT, Gemini | Open-weight: Llama, Mistral, Qwen, DeepSeek, Gemma</pre>`,
  tips: ["If information isn't in the context window, the model is guessing.", "Temperature 0 reduces randomness but doesn't guarantee identical output or truth.", "Every chat message is a fresh call; 'memory' is your code resending history.", "Count tokens, not characters, when estimating cost and limits."],
  qs: [
    { q: "At its core, what does an LLM do?", o: ["Predicts the next token repeatedly", "Looks up answers in a database", "Browses the web by default", "Runs SQL queries"], a: 0, why: "Every output is produced one token at a time from learned probabilities." },
    { q: "A customer asks the model about their internal leave policy and it gives a confident wrong answer. Why?", o: ["The policy wasn't in its training data or context, so it generated something plausible", "The model is broken", "Temperature was 0", "The context window was too big"], a: 0, why: "Without the source, the model can only guess; provide the document (RAG)." },
    { q: "What does the context window limit?", o: ["How many tokens the model can consider in one request, including its answer", "How many users can chat", "The model's training data", "The number of API keys"], a: 0, why: "Prompt + history + retrieved text + output must fit." },
    { q: "Why might Hindi text cost more than the same content in English?", o: ["It often splits into more tokens per word", "Hindi is billed at a higher rate", "Models refuse Hindi", "It doesn't; tokens are words"], a: 0, why: "Tokenisers are often more efficient for English; check token counts for other languages." },
  ],
  scen: [{ t: "Token and temperature lab", d: "Use a tokenizer tool to count tokens for the same paragraph in English and Hindi. Then ask a model the same question 5 times at temperature 0 and 5 times at 1; note the differences." }],
  where: [["OpenAI tokenizer", "https://platform.openai.com/tokenizer", "See how text splits into tokens"], ["Anthropic courses (GitHub)", "https://github.com/anthropics/courses", "Free API fundamentals and prompt engineering notebooks"], ["Hugging Face LLM course", "https://huggingface.co/learn/llm-course", "How transformers work, hands-on"]] },

{ id: "llm-prompt", topic: "llm", title: "Prompt engineering that works in production", mins: 60,
  body: `
<p>Prompting is the fastest, cheapest lever you have. Production prompting is less about clever tricks and more about clear specification, like briefing a smart new colleague who knows nothing about the customer.</p>
<p><b>A strong prompt contains:</b></p>
<ol><li><b>Role and context</b>: who the model is acting as, who the users are, what the business is.</li>
<li><b>The task</b>, stated plainly.</li>
<li><b>Inputs</b>, clearly separated, often with XML-style tags: <code>&lt;ticket&gt;...&lt;/ticket&gt;</code>.</li>
<li><b>Rules and constraints</b>: what to do when information is missing, what never to do, tone, length.</li>
<li><b>Output format</b>: exact structure (JSON schema, headings, labels).</li>
<li><b>Examples</b> (few-shot): 2-5 input→output pairs, including tricky cases.</li></ol>
<pre>System: You classify customer support tickets for Acme Bank.
Categories: card_block, loan_query, kyc_update, complaint, other.
If the ticket mentions fraud or unauthorised transactions, always use card_block.
If you're unsure, use other. Reply with JSON only:
{"category": "...", "confidence": 0-1, "reason": "one sentence"}

User: &lt;ticket&gt;Someone used my card in Delhi, I'm in Pune!&lt;/ticket&gt;</pre>
<p><b>Techniques:</b> let the model think step by step before answering (or use a reasoning model) for complex tasks; <b>chain</b> prompts (extract → analyse → write) instead of one giant prompt; put long documents first and the question last; ask it to quote the evidence it used.</p>
<p><b>Treat prompts as code:</b> version them, test them against a fixed set of examples (evals), and change one thing at a time. A prompt that works on three examples often fails on the thirtieth.</p>`,
  watch: [V("Anthropic prompt engineering overview", "anthropic prompt engineering tutorial"), V("Prompt engineering for developers (DeepLearning.AI)", "chatgpt prompt engineering for developers deeplearning ai"), V("Prompt engineering in Hindi", "prompt engineering tutorial hindi", "HI")],
  cheat: `<pre>PROMPT = role/context + task + <inputs> + rules + output format + examples
Separate data from instructions with tags: <doc>...</doc> <question>...</question>
Say what to do when unsure: "If not in the document, reply NOT_FOUND"
Few-shot: 2-5 diverse examples incl. edge cases
Complex tasks: think first (reasoning), or chain: extract > analyse > write
Long docs first, question last
Ask for evidence/quotes to reduce hallucination
Version prompts (v1, v2...), test on a fixed example set, change one thing at a time
Negative instructions work better with a positive alternative:
  "Don't use jargon" -> "Explain in plain words a bank customer understands"</pre>`,
  tips: ["If a new colleague would need to ask a clarifying question, your prompt is missing information.", "Always define the behaviour for missing or ambiguous input.", "Examples teach format and edge cases faster than paragraphs of rules.", "Keep prompts in files under version control, not pasted in code strings."],
  qs: [
    { q: "What is the main benefit of wrapping inputs in tags like <ticket>...</ticket>?", o: ["It clearly separates data from instructions", "It makes the model faster", "It encrypts the data", "Models require XML"], a: 0, why: "Clear boundaries reduce confusion and some injection risk." },
    { q: "Your classifier is right on your 3 test examples but wrong often in production. What's the fix?", o: ["Build a larger, representative eval set and iterate the prompt against it", "Add 'be accurate' to the prompt", "Raise temperature", "Switch off logging"], a: 0, why: "Prompts must be tested on realistic, varied cases." },
    { q: "Which instruction best reduces hallucinated answers in document Q&A?", o: ["'Answer only from the document; if it isn't there, say you don't know'", "'Be creative'", "'Answer quickly'", "'Use your general knowledge'"], a: 0, why: "It gives the model permission and a format for 'not found'." },
    { q: "For a complex multi-step task, what usually beats one giant prompt?", o: ["Chaining smaller prompts, each with one clear job", "Using ALL CAPS", "Longer role descriptions", "Removing examples"], a: 0, why: "Smaller steps are easier to get right, debug and evaluate." },
  ],
  scen: [{ t: "Prompt iteration", d: "Write 20 realistic support tickets (include 5 tricky ones). Write a classification prompt, run it on all 20, record accuracy, improve the prompt twice, and log what changed and the accuracy each time." }],
  where: [["Claude prompt engineering docs", "https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview", "Official techniques"], ["Anthropic interactive prompt tutorial", "https://github.com/anthropics/courses", "Hands-on notebooks"], ["OpenAI prompting guide", "https://platform.openai.com/docs/guides/prompt-engineering", "Another vendor's view"]] },

{ id: "llm-struct", topic: "llm", title: "Structured outputs and validation", mins: 50,
  body: `
<p>In production, an LLM's output usually feeds code, not a person: a category to route a ticket, fields to fill a CRM record, arguments for a tool. You need output your code can trust.</p>
<p><b>Ways to get structure:</b></p>
<ul><li><b>Ask for JSON with a schema</b> in the prompt, plus an example.</li>
<li><b>Native structured output / JSON mode</b>: most providers can constrain output to a JSON schema.</li>
<li><b>Tool/function calling</b>: define a "tool" whose parameters are your schema; the model fills them in.</li></ul>
<p><b>Always validate.</b> Parse and check with Pydantic, then decide what to do on failure:</p>
<pre>from pydantic import BaseModel, Field, ValidationError
from typing import Literal

class Triage(BaseModel):
    category: Literal["card_block", "loan_query", "kyc_update", "complaint", "other"]
    confidence: float = Field(ge=0, le=1)
    reason: str

def parse(raw: str) -> Triage | None:
    try:
        return Triage.model_validate_json(raw)
    except ValidationError as e:
        log.warning("bad output: %s", e)
        return None          # retry once with the error message, then fall back</pre>
<p><b>On failure:</b> retry once, feeding back the validation error; then fall back (default category, human review queue). Never let unvalidated model output write to a customer's system.</p>
<p><b>Design tips:</b> use enums (fixed choices) instead of free text where possible; keep schemas small and flat; add a <code>reason</code> or <code>evidence</code> field for debugging; add an explicit <code>"unknown"</code> option so the model isn't forced to guess. For extraction, ask for <code>null</code> when a field isn't present.</p>`,
  watch: [V("Structured outputs with LLMs and Pydantic", "llm structured output pydantic tutorial"), V("Instructor library for structured LLM outputs", "instructor python structured outputs llm")],
  cheat: `<pre>Get structure: JSON schema in prompt | provider structured output | tool calling
Validate: Pydantic model_validate_json ; Zod in TS
Literal[...] / Enum for categories ; Field(ge=, le=) ranges
Optional fields -> None when absent (don't invent)
Always include: "unknown"/"other" option ; short reason/evidence field
On invalid: retry once with error text -> fallback -> human queue
Log raw output + parsed result + validation errors
Libraries: instructor, pydantic-ai, outlines (open models)</pre>`,
  tips: ["Treat model output like user input: untrusted until validated.", "An 'unknown' option reduces confidently wrong answers.", "Log invalid outputs; they're your best examples for improving the prompt.", "Numbers in model output (amounts, dates) deserve extra checks against the source."],
  qs: [
    { q: "Why validate LLM JSON output with Pydantic even when using JSON mode?", o: ["JSON can be valid but still have wrong fields, types or values", "Pydantic makes the model smarter", "It reduces tokens", "It's required by the API"], a: 0, why: "Syntax is not correctness; check the schema and business rules." },

{ id: "llm-choose", topic: "llm", title: "Choosing models: quality, cost, latency, and fine-tuning", mins: 50,
  body: `
<p>Customers ask "which model should we use?" and "should we fine-tune?" The right answer comes from their task, data and constraints, measured, not assumed.</p>
<p><b>The three-way trade-off:</b> larger models are usually more capable but slower and pricier; smaller models are fast and cheap and often good enough for classification, extraction or routing. Many systems <b>route</b>: a small model handles easy requests, a larger one handles hard ones.</p>
<p><b>How to choose:</b></p>
<ol><li>Build an eval set from real examples (Evals topic).</li>
<li>Test 2-4 candidate models with the same prompt.</li>
<li>Compare quality, latency (p95), and cost per task.</li>
<li>Factor in constraints: data residency, where the model can run, context length, languages, vision/document support, rate limits.</li></ol>
<p><b>Cost per workflow</b> matters more than price per token: a cheap model that needs three retries and a human fix can cost more than a strong model that gets it right once.</p>
<p><b>Customise in this order:</b></p>
<table class="ops"><tr><td>1. Prompting</td><td>fastest, free to change; start here</td></tr>
<tr><td>2. RAG</td><td>when the model needs the customer's knowledge or fresh facts</td></tr>
<tr><td>3. Tools / workflows</td><td>when it must take actions or compute exactly</td></tr>
<tr><td>4. Fine-tuning</td><td>when you need a consistent style/format at scale, a smaller cheaper model to match a bigger one on a narrow task, or domain language; needs quality labelled data and ongoing maintenance</td></tr></table>
<p>Fine-tuning teaches behaviour and format well; it's a poor way to add facts that change. Use RAG for knowledge.</p>`,
  watch: [V("RAG vs fine-tuning vs prompt engineering", "rag vs fine tuning vs prompt engineering"), V("How to choose an LLM for your use case", "how to choose llm model for production")],
  cheat: `<pre>Pick with evals: quality | p95 latency | cost per completed task | constraints
Constraints: residency, deploy location, context length, languages, vision, rate limits
Routing: small model for easy/most, large for hard/escalated
Customise ladder: prompt > RAG > tools/workflow > fine-tune
Fine-tune for: format/style consistency, cheaper model on narrow task, jargon
Don't fine-tune for: frequently changing facts (use RAG)
LoRA/PEFT = cheap fine-tuning of open models
Recheck when new models ship: rerun the eval, compare</pre>`,

{ id: "bld-api", topic: "build", title: "Calling LLM APIs: messages, streaming, errors", mins: 60,
  body: `
<p>Every LLM provider's API follows the same shape: you send a list of <b>messages</b> and parameters; you get back generated content plus usage (token counts).</p>
<pre>import anthropic, os
client = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])

resp = client.messages.create(
    model=MODEL,                      # from config, not hard-coded
    max_tokens=500,
    system="You are a concise assistant for Acme Bank support agents.",
    messages=[
        {"role": "user", "content": "Summarise this ticket: ..."},
    ],
)
print(resp.content[0].text)
print(resp.usage.input_tokens, resp.usage.output_tokens)</pre>
<p><b>Key pieces:</b></p>
<ul><li><b>System prompt</b>: standing instructions and context.</li>
<li><b>Messages</b>: alternating user/assistant turns. For a conversation, you resend the history each time (the API is stateless).</li>
<li><b>Streaming</b>: receive tokens as they're generated for responsive UIs.</li>
<li><b>Multimodal inputs</b>: images and PDFs can be sent as content blocks.</li>
<li><b>Usage</b>: log input/output tokens for cost tracking.</li></ul>
<p><b>Production concerns:</b> handle rate limits (429) and overloads (5xx) with retries and backoff (SDKs do some of this); set timeouts; keep API keys in a secrets manager; log model, prompt version, latency and tokens per call; cap <code>max_tokens</code>; trim or summarise long histories to stay within the context window; use <b>prompt caching</b> for long repeated prefixes (system prompts, documents) to cut cost and latency; use <b>batch APIs</b> for large offline jobs at lower cost.</p>`,
  watch: [V("Claude API tutorial for beginners", "claude api tutorial python"), V("OpenAI API Python tutorial", "openai api python tutorial"), V("LLM API in Hindi", "openai api python hindi", "HI")],
  cheat: `<pre>pip install anthropic openai
Request: model, system, messages[{role, content}], max_tokens, temperature
Response: content (text/tool_use blocks), stop_reason, usage (tokens)
Conversation = resend history each call (stateless API)
Streaming: SDK stream helpers / SSE events -> render incrementally
Errors: 429 rate limit, 529/5xx overloaded -> backoff; 400 bad request -> fix
Cost controls: max_tokens cap, prompt caching, batch API, smaller model routing
Log per call: request_id, model, prompt_version, in/out tokens, latency, status
Keys: env/secret manager; separate keys per environment/customer</pre>`,
  tips: ["Keep model names and prompt versions in config so they appear in every log line.", "The API has no memory; your code decides which history to send.", "Stream for anything user-facing that takes more than a second or two.", "Use batch APIs for overnight jobs like re-classifying a backlog; they're cheaper."],

{ id: "bld-tools", topic: "build", title: "Tool use (function calling)", mins: 60,
  body: `
<p><b>Tool use</b> lets a model call your functions: look up an order, search documents, create a ticket, run a calculation. The model doesn't run anything itself; it asks, your code executes, and you send back the result.</p>
<pre>tools = [{
  "name": "get_order_status",
  "description": "Look up the current status of a customer's order by order ID. "
                 "Use when the user asks where their order is.",
  "input_schema": {
    "type": "object",
    "properties": {"order_id": {"type": "string", "description": "e.g. ORD-12345"}},
    "required": ["order_id"],
  },
}]

# 1. send messages + tools
# 2. model replies with a tool_use block: get_order_status({"order_id": "ORD-881"})
# 3. your code runs the real function (with the user's permissions)
# 4. send back a tool_result block with the output
# 5. model writes the final answer using that result</pre>
<p>This loop (model → tool → result → model) is the heart of every agent.</p>
<p><b>Designing good tools:</b></p>
<ul><li>Clear names and <b>detailed descriptions</b>: when to use it, when not to, what it returns. The model only knows what you tell it.</li>
<li>Few, well-scoped tools beat many overlapping ones.</li>
<li>Return concise, relevant results (not a 5 MB JSON dump); include useful error messages the model can act on.</li>
<li><b>Validate arguments</b> before executing; never trust them blindly.</li>
<li>Run tools with the <b>end user's permissions</b>, not an admin account.</li>
<li>Require <b>human confirmation</b> for risky actions (refunds, deletes, emails to customers).</li></ul>`,
  watch: [V("LLM function calling explained", "llm function calling tool use explained"), V("Claude tool use tutorial", "claude tool use tutorial python"), V("Function calling in Hindi", "function calling llm hindi", "HI")],
  cheat: `<pre>Tool = name + description + JSON schema for inputs
Loop: request(tools) -> tool_use -> execute -> tool_result -> final answer
Description: what it does, when to use, when NOT to, input format, output
Return: short, relevant, structured; errors as helpful text
Safety: validate args | user-scoped credentials | allow-list actions
        | confirm destructive/external actions with a human
tool_choice: auto | force a specific tool | none
Parallel tool calls: handle several tool_use blocks in one turn
Log every tool call: name, args, result size, latency, success</pre>`,
  tips: ["Write tool descriptions like docs for a new teammate; they're the model's only guide.", "If the model picks the wrong tool, improve descriptions before adding prompt rules.", "Return errors as readable text ('order not found, check format ORD-12345') so the model can recover.", "Anything irreversible or customer-visible needs an approval step."],

{ id: "bld-mcp", topic: "build", title: "Model Context Protocol (MCP)", mins: 60,
  body: `
<p>Anthropic's FDE posting explicitly lists building <b>MCP servers</b>. The <b>Model Context Protocol</b> is an open standard for connecting AI applications to tools and data. Instead of writing custom tool code for every app, you build one MCP server for a system (say, the customer's ticketing tool) and any MCP-capable client (Claude apps, Claude Code, IDEs, agent frameworks) can use it.</p>
<p><b>The parts:</b></p>
<ul><li><b>Host / client</b>: the AI application that connects to servers.</li>
<li><b>Server</b>: exposes capabilities of one system.</li>
<li><b>Tools</b>: actions the model can call (<code>create_ticket</code>, <code>search_orders</code>).</li>
<li><b>Resources</b>: data the app can read (files, records, schemas).</li>
<li><b>Prompts</b>: reusable prompt templates the server offers.</li>
<li><b>Transports</b>: <i>stdio</i> (local process) or <i>streamable HTTP</i> (remote server, with auth such as OAuth).</li></ul>
<pre>from mcp.server.fastmcp import FastMCP

mcp = FastMCP("helpdesk")

@mcp.tool()
def search_tickets(query: str, status: str = "open") -> list[dict]:
    """Search helpdesk tickets by keywords. status: open | pending | closed."""
    return helpdesk.search(query=query, status=status)[:10]

@mcp.resource("ticket://{ticket_id}")
def ticket(ticket_id: str) -> str:
    """Full text of one ticket."""
    return helpdesk.get(ticket_id).as_text()

if __name__ == "__main__":
    mcp.run()</pre>
<p><b>Why it matters for FDEs:</b> the same connector works across many AI apps and customers; it's a repeatable deliverable. Security still applies: authenticate remote servers, scope permissions per user, validate inputs, log calls, and be careful about installing untrusted servers (they can inject instructions into the model's context).</p>`,
  watch: [V("Model Context Protocol explained", "model context protocol mcp explained"), V("Build an MCP server in Python", "build mcp server python tutorial"), V("MCP in Hindi", "mcp model context protocol hindi", "HI")],
  cheat: `<pre>MCP = standard plug between AI apps (clients) and systems (servers)
Server exposes: tools (actions) | resources (readable data) | prompts (templates)
Transports: stdio (local) | streamable HTTP (remote, add OAuth)
Python: pip install "mcp[cli]" ; FastMCP ; @mcp.tool() ; @mcp.resource("uri://{id}")
TypeScript: @modelcontextprotocol/sdk
Test: MCP Inspector ; connect from Claude Desktop / Claude Code
Security: auth for remote, per-user scopes, validate inputs, log calls,
          trust only vetted servers (tool descriptions can carry injections)</pre>`,
  tips: ["Docstrings become tool descriptions; write them carefully.", "Test every server with the MCP Inspector before connecting it to an assistant.", "One MCP server per system keeps permissions and ownership clear.", "Treat third-party MCP servers like third-party code: review before installing."],
  qs: [
    { q: "What problem does MCP solve?", o: ["A standard way to connect AI apps to tools and data so one connector works across many clients", "It trains models faster", "It replaces HTTP", "It's a vector database"], a: 0, why: "Build once per system, use from any MCP-capable client." },
    { q: "In MCP, what is a 'tool'?", o: ["An action the model can invoke, like create_ticket", "A read-only document", "A UI widget", "A model weight file"], a: 0, why: "Tools perform actions; resources provide data." },
    { q: "Which transport suits a remote MCP server used by many employees?", o: ["Streamable HTTP with authentication", "stdio", "Email", "FTP"], a: 0, why: "stdio is for local processes; remote servers use HTTP with auth." },
    { q: "Why be careful installing an unknown MCP server?", o: ["Its tool descriptions or outputs could inject malicious instructions or misuse access", "It will slow down Python", "MCP servers are always paid", "No risk"], a: 0, why: "Anything placed in the model's context can influence it." },
  ],
  scen: [{ t: "Your first MCP server", d: "Build an MCP server over a local SQLite 'helpdesk' with tools search_tickets and add_comment and a ticket resource. Test with MCP Inspector, then connect it to Claude Desktop or Claude Code and use it in a conversation." }],
  where: [["MCP official docs", "https://modelcontextprotocol.io/", "Concepts, quickstarts, SDKs"], ["MCP Python SDK", "https://github.com/modelcontextprotocol/python-sdk", "FastMCP examples"], ["MCP example servers", "https://github.com/modelcontextprotocol/servers", "Reference implementations"]] },

{ id: "bld-coding", topic: "build", title: "Coding agents, skills and rapid prototyping", mins: 50,
  body: `
<p>FDEs are expected to build convincing demos in <b>days</b>. Coding agents make that possible, and postings now mention hands-on experience with them (Claude Code, Cursor, Codex), plus building <b>sub-agents</b> and <b>agent skills</b> for customers.</p>
<p><b>How to work with a coding agent effectively:</b></p>
<ul><li><b>Plan first</b>: describe the goal, constraints and acceptance criteria; ask for a plan before code.</li>
<li><b>Give context</b>: point it at the right files, docs and examples; keep a project instructions file (like CLAUDE.md) with conventions, commands and gotchas.</li>
<li><b>Work in small steps</b> with tests; review every diff like a senior engineer; run the code.</li>
<li><b>Let it verify</b>: have it run tests, linters and the app, and fix what fails.</li>
<li><b>Own the result</b>: you're accountable for security, correctness and licensing, not the tool.</li></ul>
<p><b>Skills and sub-agents</b>: <i>skills</i> are packaged instructions (plus scripts/resources) that teach an agent to do a specific task well, like following a customer's report format. <i>Sub-agents</i> are specialised agents a main agent delegates to (a researcher, a reviewer) with their own instructions and tools. Both turn repeated customer know-how into reusable assets.</p>
