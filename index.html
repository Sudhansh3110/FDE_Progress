{ id: "craft-git", topic: "craft", title: "Git and GitHub", mins: 60,
  body: `
<p><b>Git</b> records snapshots (commits) of your project so you can go back, compare, and work in parallel. <b>GitHub</b> hosts Git repositories online and adds pull requests, reviews and automation.</p>
<p><b>The everyday loop:</b></p>
<pre>git clone URL                  # get a copy
git switch -c fix-login        # new branch for your change
# ...edit files...
git status                     # what changed?
git add app.py                 # stage the change
git commit -m "Fix login timeout"
git push -u origin fix-login   # upload the branch
# open a Pull Request on GitHub, get review, merge</pre>
<p><b>Three areas:</b> working directory (your files) → staging area (<code>git add</code>) → repository history (<code>git commit</code>).</p>
<p><b>Branches</b> let you work without breaking <code>main</code>. <b>Merging</b> combines them; a <b>conflict</b> happens when both sides changed the same lines. Git marks them with <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>; you edit to the correct version, then add and commit.</p>
<p><b>Undoing:</b> <code>git restore file</code> discards unstaged edits; <code>git revert COMMIT</code> creates a new commit that undoes an old one (safe on shared branches); <code>git reset</code> rewrites history (only on your own branches).</p>
<p><b>Never commit secrets.</b> Put API keys in a <code>.env</code> file listed in <code>.gitignore</code>. If a key is ever pushed, rotate it immediately; deleting the commit isn't enough.</p>`,
  watch: [V("Git & GitHub crash course", "git and github crash course for beginners"), V("Kunal Kushwaha · Git & GitHub", "kunal kushwaha git github complete course"), V("Chai aur Code · Git (Hindi)", "chai aur code git github hindi", "HI")],
  cheat: `<pre>git init | git clone URL
git status            git diff          git log --oneline
git add file / .      git commit -m "msg"
git switch -c name    git switch main   git branch
git pull              git push -u origin name
git merge branch      git rebase main   (own branch only)
git restore file      discard edits
git revert <sha>      undo safely with a new commit
git stash / git stash pop
.gitignore: .env  __pycache__/  node_modules/  .venv/
Commit msg: imperative, <= 50 chars: "Add retry to CRM sync"</pre>`,
  tips: ["Commit small and often; each commit should do one thing.", "Pull before you start work to reduce conflicts.", "revert is safe on shared branches; reset rewrites history.", "A leaked key must be rotated, not just deleted from Git."],
  qs: [
    { q: "What does `git add` do?", o: ["Uploads to GitHub", "Moves changes into the staging area for the next commit", "Creates a new branch", "Deletes a file"], a: 1, why: "Staging lets you choose exactly which changes go into the next commit." },
    { q: "You pushed a commit containing an API key. What must you do first?", o: ["Delete the commit and force-push", "Rotate (revoke and replace) the key", "Rename the file", "Nothing if the repo is private"], a: 1, why: "Once pushed, assume the key is compromised. Removing it from history doesn't un-leak it." },
    { q: "Which command undoes a bad commit on a shared main branch safely?", o: ["git reset --hard", "git revert <sha>", "git rm -rf", "git stash"], a: 1, why: "revert adds a new commit that reverses the old one, without rewriting shared history." },
    { q: "What causes a merge conflict?", o: ["Two branches changed the same lines differently", "A missing internet connection", "Too many commits", "Using branches at all"], a: 0, why: "Git can't decide which version to keep, so it asks you." },
  ],
  scen: [{ t: "Your first PR", d: "Create a repo, add a README on a branch, open a pull request, review it yourself, and merge. Then create a deliberate conflict with two branches and resolve it." }],
  where: [["Learn Git Branching", "https://learngitbranching.js.org/", "Interactive visual levels for branching, merging, rebasing"], ["GitHub Skills", "https://skills.github.com/", "Guided exercises inside real repos"], ["Pro Git book", "https://git-scm.com/book/en/v2", "Free reference; chapters 1-3 are enough to start"]] },

{ id: "craft-cli", topic: "craft", title: "Command line and Linux", mins: 60,
  body: `
<p>Servers run Linux and have no mouse. FDEs debug customer systems over SSH, read logs, and run scripts from a terminal, so the command line is non-negotiable.</p>
<p><b>Moving around and files:</b> <code>pwd</code> (where am I), <code>ls -la</code> (list), <code>cd dir</code>, <code>mkdir</code>, <code>cp</code>, <code>mv</code>, <code>rm</code> (no undo!), <code>cat</code>, <code>less</code>, <code>head</code>, <code>tail -f app.log</code> (follow a live log).</p>
<p><b>Finding things:</b> <code>grep -r "ERROR" logs/</code> searches text; <code>find . -name "*.py"</code> finds files.</p>
<p><b>Pipes</b> connect small tools: <code>grep ERROR app.log | sort | uniq -c | sort -rn | head</code> shows the most frequent error lines.</p>
<p><b>Processes and system:</b> <code>ps aux</code>, <code>top</code>/<code>htop</code>, <code>kill PID</code>, <code>df -h</code> (disk), <code>free -h</code> (memory).</p>
<p><b>Permissions:</b> <code>chmod +x script.sh</code>; <code>sudo</code> runs as administrator.</p>
<p><b>Environment variables</b> hold configuration and secrets: <code>export API_KEY=...</code>, read with <code>echo $API_KEY</code> or in Python <code>os.environ["API_KEY"]</code>.</p>
<p><b>Remote work:</b> <code>ssh user@host</code>, <code>scp file user@host:/path</code>, and <code>curl</code> to call APIs from the terminal.</p>
<p>On Windows, install <b>WSL</b> (Windows Subsystem for Linux) to get a real Linux terminal.</p>`,
  watch: [V("Linux command line for beginners", "linux command line full course beginners"), V("MIT Missing Semester · Shell", "missing semester shell tools scripting"), V("Linux commands in Hindi", "linux commands tutorial hindi", "HI")],
  cheat: `<pre>pwd  ls -la  cd ..  mkdir -p a/b  cp -r  mv  rm -r
cat  less  head -n 20  tail -f log  wc -l
grep -rin "text" dir     find . -name "*.log"
cmd1 | cmd2              pipe      > file  overwrite   >> append
sort | uniq -c | sort -rn   count and rank lines
ps aux | grep python     kill PID     top
df -h  free -h  du -sh *
chmod +x run.sh  ./run.sh     sudo
export KEY=value   echo $KEY   env
ssh user@host   scp f user@host:~   curl -s URL | python -m json.tool</pre>`,
  tips: ["Press Tab to autocomplete paths; press ↑ to recall commands.", "rm has no recycle bin. Run ls with the same pattern first.", "tail -f on the log file is the first move when something breaks in production.", "Read a command right to left in a pipe to understand what each stage receives."],
  qs: [
    { q: "Which command shows new lines of a log file as they're written?", o: ["cat app.log", "tail -f app.log", "ls app.log", "rm app.log"], a: 1, why: "-f (follow) keeps the file open and prints new lines live." },
    { q: "What does `grep ERROR app.log | wc -l` output?", o: ["All error lines", "The number of lines containing ERROR", "The file size", "Nothing"], a: 1, why: "grep filters to matching lines; wc -l counts lines." },
    { q: "Where should an API key live on a server?", o: ["Hard-coded in the Python file", "In an environment variable or a secrets manager", "In the Git repository", "In a comment"], a: 1, why: "Environment variables and secret managers keep keys out of code and version control." },
    { q: "What does `chmod +x deploy.sh` do?", o: ["Deletes the script", "Makes the script executable", "Copies it", "Runs it as admin"], a: 1, why: "+x adds execute permission so you can run ./deploy.sh." },
  ],
  scen: [{ t: "Log detective", d: "Download any sample log file (or generate one with a Python loop). Find: the 5 most common error messages, how many errors happened per hour, and the first error of the day. Use only the terminal." }],
  where: [["OverTheWire Bandit", "https://overthewire.org/wargames/bandit/", "Game that teaches Linux commands level by level"], ["MIT Missing Semester", "https://missing.csail.mit.edu/", "Shell, scripting, editors, debugging"], ["Killercoda", "https://killercoda.com/", "Free browser-based Linux playgrounds"]] },

{ id: "craft-debug", topic: "craft", title: "Debugging like a professional", mins: 45,
  body: `
<p>FDEs are often called when something is broken in a customer environment you don't control. A calm, repeatable method matters more than cleverness.</p>
<ol><li><b>Reproduce</b>: get the exact input, time, user and environment. If you can't reproduce it, you can't be sure you fixed it.</li>
<li><b>Read the error</b>: the last line of a traceback says what; the lines above say where. Search the exact message.</li>
<li><b>Narrow it down</b>: binary-search the problem. Does it fail with half the data? With the previous version? In staging? Remove half the moving parts until it stops failing.</li>
<li><b>Form a hypothesis and test it</b>: "I think the date parser fails on DD/MM formats." Change one thing at a time.</li>
<li><b>Fix, then prove</b>: write a test that failed before and passes now.</li>
<li><b>Write it down</b>: what happened, why, and how to prevent it.</li></ol>
<p><b>Tools:</b> <code>print</code> or better <code>logging</code>; the Python debugger (<code>breakpoint()</code> drops you into pdb; <code>n</code> next line, <code>s</code> step in, <code>p var</code> print, <code>c</code> continue); your editor's debugger with breakpoints; <code>curl -v</code> for HTTP; database query logs.</p>
<p><b>Classic root causes in customer deployments:</b> different environment variables, expired credentials, firewall/proxy blocking outbound calls, timezone and date formats, character encoding, rate limits, data that's bigger or dirtier than the sample.</p>`,
  watch: [V("Python debugging with pdb and VS Code", "python debugging tutorial vs code breakpoints pdb"), V("How to debug any problem systematically", "how to debug systematically software engineering")],
  cheat: `<pre>REPRODUCE -> READ -> NARROW -> HYPOTHESISE -> FIX+TEST -> WRITE UP
breakpoint()    pdb:  n next  s step  p x  l list  c continue  q quit
import logging
logging.basicConfig(level=logging.INFO)
log = logging.getLogger(__name__)
log.info("synced %d rows", n);  log.exception("failed")  # includes traceback
curl -v URL        see headers, status, TLS
python -X dev      extra warnings
"Works on my machine" checklist: env vars, versions,
  network/proxy, credentials, timezone, encoding, data size</pre>`,
  tips: ["Change one thing at a time, or you won't know what fixed it.", "Keep a debugging log with timestamps while you work; it becomes the incident write-up.", "When stuck for 30 minutes, explain the problem out loud (rubber duck) or to a colleague.", "Most 'random' failures are data-dependent. Save the failing input."],
  qs: [
    { q: "A customer says 'the sync fails sometimes'. What's your first step?", o: ["Rewrite the sync", "Get a specific failing example: time, input, error message", "Restart all servers", "Upgrade Python"], a: 1, why: "You need a reproducible case before you can find the cause." },
    { q: "In a Python traceback, which line usually names the actual error?", o: ["The first line", "The last line", "The middle line", "None"], a: 1, why: "The last line has the exception type and message; lines above show the call path." },
    { q: "It works on your laptop but fails on the customer's server. Which is the LEAST likely cause?", o: ["A missing environment variable", "Firewall blocking outbound calls", "Different library version", "Your laptop's wallpaper"], a: 3, why: "Environment, network and versions are the usual suspects." },
    { q: "Why write a test after fixing a bug?", o: ["To prove the fix and stop the bug coming back", "Tests are required by Python", "To make the code slower", "It's optional decoration"], a: 0, why: "A regression test fails if anyone reintroduces the bug." },
  ],
  scen: [{ t: "Bug hunt", d: "Take any problem you solved on this site, introduce 3 bugs (off-by-one, wrong variable, missing return), swap with a friend, and find each other's bugs using breakpoint() only." }],
  where: [["Python pdb docs", "https://docs.python.org/3/library/pdb.html", "Commands reference"], ["VS Code Python debugging", "https://code.visualstudio.com/docs/python/debugging", "Set breakpoints and inspect variables"]] },

{ id: "craft-test", topic: "craft", title: "Testing with pytest", mins: 60,
  body: `
<p>Tests are code that checks your code. For FDEs they're how you prove something works before a customer finds out it doesn't, and how you change code later without fear.</p>
<pre># calc.py
def discount(price, pct):
    if not 0 <= pct <= 100:
        raise ValueError("pct must be 0-100")
    return round(price * (100 - pct) / 100, 2)

# test_calc.py
import pytest
from calc import discount

def test_normal():
    assert discount(200, 10) == 180.0

def test_zero():
    assert discount(99.99, 0) == 99.99

def test_invalid():
    with pytest.raises(ValueError):
        discount(100, 150)</pre>
<p>Run <code>pytest</code> in the folder; it finds files named <code>test_*.py</code> and functions named <code>test_*</code>.</p>
<p><b>Kinds of tests:</b> <b>unit</b> (one function, fast), <b>integration</b> (your code + a real database or API), <b>end-to-end</b> (the whole flow like a user). Have many unit tests, fewer integration, few end-to-end.</p>
<p><b>Mocking:</b> replace slow or external things (a paid API, a customer's CRM) with a fake that returns known data, so tests are fast and repeatable.</p>
<p><b>What to test:</b> the normal case, edge cases (empty, zero, huge, unicode), and error cases. Testing LLM outputs is different because they vary; that's what evals are for (Evals topic).</p>`,
  watch: [V("pytest tutorial for beginners", "pytest tutorial beginners"), V("Python testing in Hindi", "pytest python testing hindi", "HI")],
  cheat: `<pre>pip install pytest ; pytest -q ; pytest -k name ; pytest -x (stop on first fail)
def test_x(): assert f(2) == 4
with pytest.raises(ValueError): f(-1)
@pytest.mark.parametrize("a,b", [(1, 2), (3, 6)])
def test_double(a, b): assert double(a) == b
@pytest.fixture
def client(): return make_client()
Mock: from unittest.mock import patch
  with patch("app.call_crm", return_value={"ok": True}): ...
Coverage: pytest --cov=app
Pyramid: many unit > some integration > few e2e</pre>`,
  tips: ["Name tests after behaviour: test_rejects_negative_amount, not test_1.", "Write the failing test first when fixing a bug.", "Mock external services in unit tests; hit the real thing in a few integration tests.", "Put tests in CI so they run on every pull request."],
  qs: [
    { q: "Which file will pytest pick up automatically?", o: ["test_orders.py", "orders_check.py", "Tests.txt", "orders.py"], a: 0, why: "pytest collects files named test_*.py (or *_test.py) and functions starting with test_." },
    { q: "Why mock the customer's CRM API in unit tests?", o: ["To make tests fast, free and repeatable without touching real systems", "Because mocks are more accurate", "To hide bugs", "pytest can't make HTTP calls"], a: 0, why: "Real external calls are slow, can change, and might modify customer data." },
    { q: "What does this test check?", code: "def test_invalid():\n    with pytest.raises(ValueError):\n        discount(100, 150)", o: ["That discount returns 150", "That discount raises ValueError for an invalid percentage", "That discount is fast", "Nothing"], a: 1, why: "pytest.raises passes only if the block raises the given exception." },
    { q: "In the testing pyramid, which kind should you have the MOST of?", o: ["End-to-end", "Unit", "Manual", "Load"], a: 1, why: "Unit tests are fast and pinpoint failures; e2e tests are slow and brittle." },
  ],
  scen: [{ t: "Test a real function", d: "Take the 'Income tax' or 'Electricity bill' practice problem. Write 6 pytest tests (normal, boundaries, zero, invalid input) on your machine and run them." }],
  where: [["pytest docs: getting started", "https://docs.pytest.org/en/stable/getting-started.html", "Install and first tests"], ["Exercism Python track", "https://exercism.org/tracks/python", "Exercises come with test suites to pass"]] },

{ id: "craft-quality", topic: "craft", title: "Code quality, environments and code review", mins: 45,
  body: `
<p>Customer code gets read and maintained by other people long after you leave. Quality is a delivery skill.</p>
<p><b>Environments:</b> each project gets its own virtual environment so versions don't clash: <code>python -m venv .venv</code>, activate it, <code>pip install -r requirements.txt</code>. Modern tools like <b>uv</b> or <b>poetry</b> also lock exact versions. Pin versions for anything you deploy.</p>
<p><b>Project layout:</b> <code>src/</code> for code, <code>tests/</code> for tests, <code>README.md</code> explaining how to run it, <code>.env.example</code> listing required settings (without values), <code>requirements.txt</code> or <code>pyproject.toml</code>.</p>
<p><b>Readable code:</b> clear names, small functions that do one thing, no magic numbers (name them as constants), early returns instead of deep nesting, comments that explain <i>why</i> not <i>what</i>.</p>
<p><b>Type hints</b> make intent explicit and let tools catch mistakes:</p>
<pre>def total_price(items: list[dict], tax_rate: float = 0.18) -> float: ...</pre>
<p><b>Automatic tools:</b> a formatter (<b>ruff format</b> or <b>black</b>) ends style debates; a linter (<b>ruff</b>) catches bugs; a type checker (<b>mypy</b> or <b>pyright</b>) checks types.</p>
<p><b>Code review:</b> small pull requests, a description saying what and why, and reviewers who check correctness, security, tests and readability, and are kind about it.</p>`,
  watch: [V("Python virtual environments explained", "python virtual environment venv tutorial"), V("Clean code principles in Python", "clean code python tips"), V("uv Python package manager", "uv python package manager tutorial")],
  cheat: `<pre>python -m venv .venv ; source .venv/bin/activate  (Win: .venv\\Scripts\\activate)
pip install -r requirements.txt ; pip freeze > requirements.txt
uv init ; uv add requests ; uv run app.py
ruff check . --fix ; ruff format . ; mypy src/
project/
  src/app/...  tests/  README.md  .env.example
  pyproject.toml  .gitignore
Names: verbs for functions (fetch_orders), nouns for data
Constants: MAX_RETRIES = 3   (not a bare 3)
PR description: What / Why / How tested / Risks</pre>`,
  tips: ["If a new teammate can't run your project from the README in 10 minutes, the README isn't done.", "Commit a lock file for deployed apps so the customer gets the exact versions you tested.", "Let the formatter decide style; spend review time on logic and risk.", "Comments go stale; clear names don't."],
  qs: [
    { q: "Why use a virtual environment per project?", o: ["To isolate package versions so projects don't break each other", "To make Python faster", "It's required to use Git", "To hide code from others"], a: 0, why: "Different projects may need different versions of the same library." },
    { q: "What belongs in .env.example?", o: ["Real production API keys", "The names of required settings with placeholder values", "Customer data", "Test results"], a: 1, why: "It documents what configuration is needed without exposing secrets." },
    { q: "Which is the best comment?", o: ["# add 1 to i", "# Retry once: the vendor API returns 502 on the first call after idle", "# loop", "# TODO"], a: 1, why: "Good comments explain why something non-obvious is done." },
    { q: "What does a linter like ruff do?", o: ["Deploys the code", "Finds likely bugs and style problems automatically", "Writes tests", "Encrypts files"], a: 1, why: "Linters analyse code without running it and flag issues." },
  ],
  scen: [{ t: "Clean up", d: "Take your messiest solution from this site, move it into a proper project folder with a venv, README, tests, ruff and type hints. Compare before and after." }],
  where: [["Ruff docs", "https://docs.astral.sh/ruff/", "Linter and formatter"], ["uv docs", "https://docs.astral.sh/uv/", "Fast project and dependency manager"], ["Google engineering practices: code review", "https://google.github.io/eng-practices/review/", "How reviewers and authors should work"]] },

{ id: "web-js", topic: "web", title: "JavaScript for Python people", mins: 60,
  body: `
<p>Many FDE postings ask for Python <i>and</i> TypeScript/JavaScript, because demos and customer UIs run in the browser, and many integrations use Node.js. If you know Python, JavaScript is mostly new spelling.</p>
<table class="ops"><tr><td><b>Python</b></td><td><b>JavaScript</b></td></tr>
<tr><td><code>x = 5</code></td><td><code>let x = 5;</code> (or <code>const</code> if it never changes)</td></tr>
<tr><td><code>print(x)</code></td><td><code>console.log(x)</code></td></tr>
<tr><td><code>f"Hi {name}"</code></td><td><code>\`Hi \${name}\`</code></td></tr>
<tr><td><code>[1, 2, 3]</code> / <code>{"a": 1}</code></td><td><code>[1, 2, 3]</code> / <code>{a: 1}</code> (object)</td></tr>
<tr><td><code>def add(a, b): return a + b</code></td><td><code>const add = (a, b) => a + b;</code></td></tr>
<tr><td><code>[x * 2 for x in a]</code></td><td><code>a.map(x => x * 2)</code></td></tr>
<tr><td><code>[x for x in a if x > 0]</code></td><td><code>a.filter(x => x > 0)</code></td></tr>
<tr><td><code>None</code>, <code>True</code></td><td><code>null</code>/<code>undefined</code>, <code>true</code></td></tr>
<tr><td><code>==</code></td><td><code>===</code> (always use triple equals)</td></tr></table>
<p><b>The big difference is asynchrony.</b> Network calls don't block; they return a Promise. Use <code>async</code>/<code>await</code>:</p>
<pre>async function getUser(id) {
  const res = await fetch(\`https://api.example.com/users/\${id}\`);
  if (!res.ok) throw new Error(\`HTTP \${res.status}\`);
  return await res.json();
}</pre>
<p><b>Where JS runs:</b> in the browser (manipulating the page, the DOM) and on servers with <b>Node.js</b> (npm is its pip).</p>`,

  cheat: `<pre>const / let (never var)     === and !==
\`template \${x}\`              arr.length  str.length
arr.push(x) arr.pop() arr.includes(x)
arr.map(f) arr.filter(f) arr.reduce((acc, x) => acc + x, 0)
obj.key  obj["key"]  Object.keys(obj)  {...obj, extra: 1}

for (const x of arr) {}     for (const k in obj) {}
async/await + fetch; try { } catch (e) { }
JSON.parse(text)  JSON.stringify(obj)
Node: npm init -y ; npm install axios ; node app.js</pre>`,

  qs: [
    { q: "What does `[1, 2, 3].map(x => x * 2)` return?", o: ["[2, 4, 6]", "[1, 2, 3, 1, 2, 3]", "12", "undefined"], a: 0, why: "map applies the function to every item and returns a new array." },

{ id: "web-ts", topic: "web", title: "TypeScript essentials", mins: 45,
  body: `
<p><b>TypeScript</b> is JavaScript with types. The compiler checks your code before it runs, catching mistakes like calling a function with the wrong shape of data. Most serious frontend and Node.js codebases use it, and AI SDKs (including MCP servers) are often written in it.</p>
<pre>type Ticket = {
  id: string;
  priority: "low" | "medium" | "high";   // only these values allowed
  assignee?: string;                       // optional
};

function escalate(t: Ticket): Ticket {
  return { ...t, priority: "high" };
}

const t: Ticket = { id: "T-1", priority: "urgent" };  // error: not allowed</pre>
<p><b>Key ideas:</b></p>
<ul><li><b>Basic types</b>: <code>string</code>, <code>number</code>, <code>boolean</code>, arrays <code>string[]</code>, objects.</li>
<li><b>Type aliases and interfaces</b> describe object shapes.</li>
<li><b>Union types</b>: <code>string | null</code>, or literal unions like <code>"low" | "high"</code>.</li>
<li><b>Generics</b>: <code>Promise&lt;User&gt;</code>, <code>Array&lt;number&gt;</code>: a type that holds another type.</li>
<li><b>Type narrowing</b>: after <code>if (x !== null)</code>, TypeScript knows x isn't null.</li></ul>
<p><b>Runtime validation still matters.</b> Types disappear after compiling. Data from APIs or LLMs must be checked at runtime with a library like <b>Zod</b> (the TS cousin of Python's Pydantic).</p>`,
  watch: [V("TypeScript crash course", "typescript crash course beginners"), V("TypeScript in Hindi", "typescript tutorial hindi chai aur code", "HI")],
  cheat: `<pre>let n: number = 1;  let s: string;  let ok: boolean;
let ids: string[];   let pair: [string, number];
type User = { id: string; email?: string };
interface Order { id: string; total: number }
type Status = "open" | "closed";        union of literals
function f(x: number): string { ... }
async function g(): Promise<User> { ... }
function first<T>(a: T[]): T | undefined { return a[0]; }
x ?? "default"      nullish fallback
x?.address?.city     optional chaining
Zod: const U = z.object({ id: z.string() }); U.parse(data)
npx tsc --init ; npx tsx file.ts</pre>`,
  tips: ["Turn on \"strict\": true in tsconfig from day one.", "Avoid `any`; it switches type checking off. Use `unknown` and narrow it.", "Types check your code, not incoming data. Validate API/LLM responses with Zod.", "Hover over variables in VS Code to see what TypeScript thinks their type is."],
  qs: [
    { q: "What does `priority: \"low\" | \"high\"` mean?", o: ["priority must be exactly the string 'low' or 'high'", "priority is a number", "priority is optional", "priority can be anything"], a: 0, why: "A union of string literals restricts the allowed values." },
    { q: "Why validate API responses with Zod even in TypeScript?", o: ["TypeScript types don't exist at runtime, so bad data can still arrive", "Zod makes code faster", "TypeScript can't read JSON", "Required by browsers"], a: 0, why: "Types are erased when compiled; runtime validation protects you from real-world data." },
    { q: "What does the `?` in `assignee?: string` mean?", o: ["The field may be missing", "The field is a question", "The field is private", "The field is a number"], a: 0, why: "Optional properties can be absent (undefined)." },
    { q: "Which type should replace `any` when you don't know the type yet?", o: ["unknown", "string", "never", "void"], a: 0, why: "unknown forces you to check the type before using it; any disables checking." },
  ],
  scen: [{ t: "Type a real payload", d: "Take a JSON response from a public API (e.g., JSONPlaceholder /todos). Write a TypeScript type for it and a Zod schema; make one field deliberately wrong and watch Zod catch it." }],
  where: [["TypeScript handbook", "https://www.typescriptlang.org/docs/handbook/intro.html", "Official guide"], ["TypeScript playground", "https://www.typescriptlang.org/play", "Try code in the browser"], ["Zod docs", "https://zod.dev/", "Runtime validation"]] },

{ id: "web-react", topic: "web", title: "Building demo UIs: React, Streamlit, Gradio", mins: 60,
  body: `
<p>Customers judge a project by what they can click. FDEs need to build a clean interface quickly, sometimes in hours.</p>
<p><b>Fastest (Python only):</b> <b>Streamlit</b> and <b>Gradio</b> turn a Python script into a web app. Perfect for internal demos and pilots.</p>
<pre>import streamlit as st
st.title("Ticket triage")
text = st.text_area("Paste a customer message")
if st.button("Classify"):
    label = classify(text)          # your LLM call
    st.success(f"Category: {label}")</pre>
<p>Run <code>streamlit run app.py</code>. Gradio is similar and is common on Hugging Face Spaces.</p>
<p><b>Production-grade:</b> <b>React</b> (often with <b>Next.js</b>) is the most common frontend stack. The core ideas:</p>
<ul><li><b>Components</b>: functions that return UI.</li>
<li><b>Props</b>: inputs passed into a component.</li>
<li><b>State</b>: data that changes (<code>useState</code>); when it changes, React re-renders.</li>
<li><b>Effects</b>: run code when something changes, like fetching data (<code>useEffect</code>).</li></ul>
<pre>function Counter() {
  const [n, setN] = useState(0);
  return &lt;button onClick={() => setN(n + 1)}&gt;Clicked {n} times&lt;/button&gt;;
}</pre>
<p><b>For AI UIs</b>: stream tokens as they arrive, show sources/citations, show loading and error states, and let users give thumbs-up/down feedback (it becomes eval data).</p>
<p>Coding agents (Claude Code, Cursor) can scaffold a UI quickly; your job is to know enough to direct and review them.</p>`,
  watch: [V("Streamlit in 12 minutes", "streamlit tutorial beginners"), V("React crash course", "react js crash course"), V("Gradio tutorial", "gradio tutorial python machine learning demo"), V("React in Hindi", "react js tutorial hindi chai aur code", "HI")],
  cheat: `<pre>Streamlit: st.title  st.text_input  st.text_area  st.button
           st.write  st.dataframe  st.chat_input  st.chat_message
           st.session_state (keeps values between reruns)
           streamlit run app.py
Gradio:    gr.Interface(fn, inputs="text", outputs="text").launch()
React:     const [x, setX] = useState(init)
           useEffect(() => { fetchData() }, [dep])
           {items.map(i => <Row key={i.id} {...i} />)}
Next.js:   npx create-next-app@latest
AI UI must-haves: streaming, sources, loading, errors, feedback</pre>`,
  tips: ["For a first customer demo, Streamlit wins on speed; move to React when the pilot needs polish or scale.", "Every list rendered in React needs a stable key.", "Design the empty, loading and error states; demos fail there.", "Collect user feedback in the UI from day one; it becomes your eval set."],
  qs: [
    { q: "What's the quickest way to give a Python LLM prototype a web UI?", o: ["Streamlit or Gradio", "Write a mobile app", "Build a React app from scratch", "Email the output"], a: 0, why: "Both turn Python functions into web apps with a few lines." },
    { q: "In React, what happens when state changes via setState?", o: ["The component re-renders with the new value", "The page reloads", "Nothing until refresh", "The server restarts"], a: 0, why: "State changes trigger re-rendering of the affected components." },
    { q: "Which feature is most important for trust in an AI answer UI?", o: ["Showing sources/citations for the answer", "Animated background", "Dark mode", "Custom fonts"], a: 0, why: "Users trust answers they can verify." },
    { q: "Why stream LLM tokens to the UI?", o: ["Users see progress immediately instead of waiting for the full answer", "It reduces cost", "It improves accuracy", "It's required by APIs"], a: 0, why: "Streaming improves perceived speed for long answers." },
  ],
  scen: [{ t: "One-hour demo", d: "Build a Streamlit app with a text box and a button that runs one of your Python functions (e.g., word frequency top 3). Deploy it free on Streamlit Community Cloud and share the link." }],
  where: [["Streamlit docs", "https://docs.streamlit.io/", "Get started + chat elements"], ["Streamlit Community Cloud", "https://streamlit.io/cloud", "Free hosting"], ["react.dev Learn", "https://react.dev/learn", "Official interactive tutorial"], ["Gradio guides", "https://www.gradio.app/guides", "Quickstart"]] },

{ id: "api-http", topic: "api", title: "HTTP, REST and JSON", mins: 60,
  body: `
<p>Almost every integration an FDE builds talks over <b>HTTP</b>. A client sends a <b>request</b>; a server sends back a <b>response</b>.</p>
<p><b>A request has:</b> a method, a URL, headers, and sometimes a body.</p>
<pre>POST https://api.shop.com/v1/orders?notify=true
Authorization: Bearer sk_live_...
Content-Type: application/json

{"customer_id": "C-42", "items": [{"sku": "A1", "qty": 2}]}</pre>
<p><b>Methods (REST conventions):</b> <code>GET</code> read, <code>POST</code> create, <code>PUT</code> replace, <code>PATCH</code> partly update, <code>DELETE</code> remove. GET, PUT and DELETE should be <b>idempotent</b>: doing them twice has the same effect as once.</p>
<p><b>Status codes tell you what happened:</b></p>
<table class="ops"><tr><td>2xx success</td><td>200 OK, 201 Created, 204 No Content</td></tr>
<tr><td>3xx redirect</td><td>301 moved, 304 not modified</td></tr>
<tr><td>4xx your fault</td><td>400 bad request, 401 not authenticated, 403 not allowed, 404 not found, 409 conflict, 422 validation failed, 429 too many requests</td></tr>
<tr><td>5xx their fault</td><td>500 server error, 502 bad gateway, 503 unavailable, 504 timeout</td></tr></table>
<p><b>JSON</b> is the data format: objects <code>{}</code>, arrays <code>[]</code>, strings, numbers, true/false, null. In Python, <code>json.loads()</code> turns text into dicts/lists; <code>json.dumps()</code> does the reverse.</p>
<p><b>REST design</b>: resources are nouns in the URL (<code>/customers/42/orders</code>), actions are the methods, filters go in query parameters (<code>?status=open&amp;limit=50</code>).</p>`,
  watch: [V("HTTP crash course", "http crash course methods status codes"), V("REST API explained", "what is a rest api explained"), V("REST API in Hindi", "rest api explained hindi", "HI")],
  cheat: `<pre>GET read   POST create   PUT replace   PATCH update   DELETE remove
Idempotent: GET PUT DELETE (safe to retry)   Not: POST
200 OK 201 Created 204 No content
400 bad input 401 who are you? 403 not allowed 404 missing
409 conflict 422 invalid data 429 slow down
500 server bug 502/503/504 upstream down/timeout -> retry
Headers: Authorization, Content-Type, Accept, User-Agent,
         Idempotency-Key, Retry-After, ETag
curl -X POST URL -H "Content-Type: application/json" -d '{"a":1}'
json.loads(text) -> dict     json.dumps(obj, indent=2) -> text</pre>`,
  tips: ["401 means 'I don't know who you are'; 403 means 'I know, and you're not allowed'.", "Retry 429 and 5xx (with backoff); never blindly retry 400/401/403/404.", "Always set a Content-Type header when sending JSON.", "Use Postman or curl to call an API by hand before writing code."],
  qs: [
    { q: "Your call returns 401. What's most likely wrong?", o: ["Missing or invalid credentials", "The server crashed", "The URL has a typo in the path", "You sent too many requests"], a: 0, why: "401 Unauthorized means the server couldn't authenticate you." },
    { q: "Which status code means you're being rate-limited?", o: ["404", "429", "500", "201"], a: 1, why: "429 Too Many Requests; look for a Retry-After header." },
    { q: "Which method is NOT idempotent?", o: ["GET", "PUT", "DELETE", "POST"], a: 3, why: "Calling POST twice usually creates two resources." },
    { q: "What does this print?", code: "import json\ndata = json.loads('{\"items\": [{\"qty\": 2}, {\"qty\": 3}]}')\nprint(sum(i[\"qty\"] for i in data[\"items\"]))", o: ["5", "2", "[2, 3]", "Error"], a: 0, why: "json.loads gives a dict; the list comprehension adds the quantities." },
    { q: "Which URL best follows REST conventions to list a customer's orders?", o: ["GET /customers/42/orders", "POST /getOrdersForCustomer?id=42", "GET /orders/list/all/customer42/now", "DELETE /customers/42"], a: 0, why: "Resources as nouns, nested by relationship, with the method expressing the action." },
  ],
  scen: [{ t: "Explore an API by hand", d: "Using curl or Postman, call JSONPlaceholder: list posts, get one post, create a post (POST), and try a URL that returns 404. Write down the status code and headers of each." }],
  where: [["JSONPlaceholder", "https://jsonplaceholder.typicode.com/", "Free fake REST API"], ["httpbin", "https://httpbin.org/", "Echoes your requests; test headers, status codes, auth"], ["Postman", "https://www.postman.com/", "Call APIs without code"], ["Public APIs list", "https://github.com/public-apis/public-apis", "Hundreds of free APIs to practise on"]] },

{ id: "api-client", topic: "api", title: "Calling APIs reliably from Python", mins: 60,
  body: `
<p>Calling an API once is easy. Calling it 50,000 times against a customer's flaky system without losing or duplicating data is the FDE skill.</p>
<pre>import os, time, random, requests

session = requests.Session()
session.headers["Authorization"] = f"Bearer {os.environ['CRM_TOKEN']}"

def get_json(url, params=None, max_tries=5):
    for attempt in range(max_tries):
        try:
            r = session.get(url, params=params, timeout=10)
        except requests.ConnectionError:
            r = None
        if r is not None and r.status_code < 400:
            return r.json()
        if r is not None and r.status_code not in (429, 500, 502, 503, 504):
            r.raise_for_status()                    # don't retry 4xx
        wait = float(r.headers.get("Retry-After", 0)) if r is not None else 0
        time.sleep(max(wait, 2 ** attempt + random.random()))   # backoff + jitter
    raise RuntimeError(f"gave up on {url}")</pre>
<p><b>The reliability checklist:</b></p>
<ul><li><b>Timeouts</b> on every call. The default in requests is to wait forever.</li>
<li><b>Retries with exponential backoff and jitter</b> for 429 and 5xx only.</li>
<li><b>Respect rate limits</b>: honour <code>Retry-After</code>; throttle yourself.</li>
<li><b>Pagination</b>: loop through pages via <code>page</code>/<code>offset</code>, a <code>next</code> URL, or a <code>cursor</code>, until there are no more.</li>
<li><b>Idempotency keys</b>: send a unique <code>Idempotency-Key</code> header with POSTs so a retried "create payment" doesn't charge twice.</li>
<li><b>Log</b> the URL, status and duration of every call (never the secrets).</li>
<li><b>Checkpoint</b> long syncs so a crash can resume where it stopped.</li></ul>
<p>For many calls at once, use async (<code>httpx</code> + <code>asyncio</code>) with a concurrency limit.</p>`,
  watch: [V("Python requests tutorial", "python requests library tutorial"), V("Retries, backoff and jitter explained", "exponential backoff jitter explained"), V("API pagination explained", "api pagination cursor offset explained")],
  cheat: `<pre>r = requests.get(url, params={...}, headers={...}, timeout=10)
r.status_code  r.json()  r.headers  r.raise_for_status()
requests.post(url, json=payload, headers={"Idempotency-Key": uuid4().hex})
Session() reuses connections + default headers
Retry on: 429, 500, 502, 503, 504, connection errors
Backoff: sleep(2 ** attempt + random.random()), cap attempts
Pagination:
  while url: data = get(url); yield from data["items"]; url = data.get("next")
Async: httpx.AsyncClient + asyncio.Semaphore(10)
Never log: tokens, passwords, full PII</pre>`,
  tips: ["No timeout = a hung job at 3 a.m. Always pass timeout=.", "Jitter (a random extra wait) stops thousands of clients retrying at the same instant.", "Store the last successful cursor/page so reruns resume instead of restarting.", "Test against the sandbox environment first; many enterprise APIs have one."],
  qs: [
    { q: "Why add random jitter to exponential backoff?", o: ["So many clients don't all retry at exactly the same moment", "To make requests faster", "It's required by HTTP", "To confuse attackers"], a: 0, why: "Synchronised retries create 'thundering herd' spikes that keep the server down." },
    { q: "Which responses should your client retry automatically?", o: ["429 and 5xx", "400 and 404", "401 and 403", "All of them"], a: 0, why: "Rate limits and server errors are often temporary; client errors won't fix themselves." },
    { q: "What does an Idempotency-Key on a POST protect against?", o: ["Duplicate creations when a request is retried", "Slow responses", "Wrong JSON format", "Expired tokens"], a: 0, why: "The server recognises the repeated key and returns the first result instead of creating again." },
    { q: "What is the default timeout in Python's requests library if you don't set one?", o: ["None: it can wait forever", "10 seconds", "30 seconds", "1 minute"], a: 0, why: "Without a timeout, a stalled connection blocks your program indefinitely." },
  ],
  scen: [{ t: "Resilient downloader", d: "Write a script that downloads all pages of a paginated public API into a JSON-lines file, with timeouts, retries with backoff, and resume-from-checkpoint. Kill it halfway and restart to prove resume works." }],
  where: [["Requests docs", "https://requests.readthedocs.io/en/latest/", "Quickstart and advanced usage"], ["HTTPX docs", "https://www.python-httpx.org/", "Async HTTP client"], ["GitHub REST API", "https://docs.github.com/en/rest", "Real pagination, rate limits and tokens to practise"]] },

{ id: "api-auth", topic: "api", title: "Authentication: API keys, OAuth, SSO", mins: 60,
  body: `
<p>Every enterprise integration starts with "how do we authenticate?" Getting this wrong blocks the project or creates a security incident.</p>
<p><b>API keys / bearer tokens:</b> a long secret sent in a header. Simple, used by most AI APIs. Store in a secrets manager; rotate regularly; give each integration its own key.</p>
<p><b>OAuth 2.0</b> lets an app act on a user's or organisation's behalf <i>without seeing their password</i>. Main flows:</p>
<ul><li><b>Authorization Code (+ PKCE)</b>: the user logs in at the provider and approves; your app gets a code, then exchanges it for an <b>access token</b> (short-lived) and a <b>refresh token</b> (to get new access tokens). Used for "Connect your Google/Salesforce account".</li>
<li><b>Client Credentials</b>: machine-to-machine; your service authenticates with a client ID and secret. Used for backend integrations.</li></ul>
<p><b>Scopes</b> limit what a token can do (<code>read:tickets</code> vs <code>write:tickets</code>). Ask for the minimum.</p>
<p><b>JWT</b> (JSON Web Token): a signed token containing claims (user, expiry, roles). The server verifies the signature; anyone can <i>read</i> the contents, so never put secrets in one.</p>
<p><b>Enterprise identity:</b></p>
<ul><li><b>SSO</b> (single sign-on) via <b>SAML</b> or <b>OpenID Connect (OIDC)</b>, through identity providers like Okta, Microsoft Entra ID (Azure AD) or Google Workspace. Customers expect your app to plug into theirs.</li>
<li><b>SCIM</b> automatically creates and removes user accounts when people join or leave the company.</li>
<li><b>RBAC</b> (role-based access control): permissions come from roles like admin, agent, viewer.</li></ul>`,
  watch: [V("OAuth 2.0 and OpenID Connect in plain English", "oauth 2.0 and openid connect in plain english"), V("SAML vs OAuth vs OIDC", "saml vs oauth vs oidc explained"), V("JWT explained", "jwt json web token explained")],
  cheat: `<pre>API key      header: Authorization: Bearer <key>  |  x-api-key
OAuth 2.0    Authorization Code + PKCE  -> user-delegated
             Client Credentials         -> service-to-service
             access token (minutes/hours) + refresh token (long)
             scopes = least privilege
JWT          header.payload.signature  (base64, readable!)
             verify signature + exp + audience
OIDC         OAuth + identity (id_token) -> login
SAML         XML-based enterprise SSO (older, very common)
SCIM         auto provision / deprovision users
RBAC         roles -> permissions
IdPs         Okta, Microsoft Entra ID, Google Workspace, Ping</pre>`,
  tips: ["Authentication = who you are; authorisation = what you may do.", "Refresh tokens are as sensitive as passwords; store them encrypted.", "Ask the customer's IT team early: SSO provider, allowed OAuth scopes, service account process. It often takes weeks.", "Decode a JWT at jwt.io to see its claims, but never paste production tokens into websites."],
  qs: [
    { q: "Your backend job syncs tickets every night with no user present. Which OAuth flow fits?", o: ["Client Credentials", "Authorization Code", "Implicit", "No auth"], a: 0, why: "Client Credentials is for machine-to-machine access without a user login." },
    { q: "What does a refresh token do?", o: ["Gets a new access token without the user logging in again", "Refreshes the web page", "Deletes old tokens", "Encrypts data"], a: 0, why: "Access tokens expire quickly; refresh tokens obtain new ones." },
    { q: "Can anyone read the contents of a JWT?", o: ["Yes, it's only encoded and signed, not encrypted (by default)", "No, it's fully encrypted", "Only admins", "Only the browser"], a: 0, why: "The signature proves it wasn't changed, but the payload is readable base64." },
    { q: "A customer uses Okta and wants employees to log in with company accounts. What do you implement?", o: ["SSO via SAML or OIDC", "A shared password", "API keys per user", "SCIM only"], a: 0, why: "SSO connects your app to their identity provider." },

{ id: "api-events", topic: "api", title: "Webhooks, events, GraphQL and streaming", mins: 50,
  body: `
<p>Polling ("any new tickets?" every minute) is wasteful and slow. Most modern systems push events to you instead.</p>
<p><b>Webhooks:</b> you give a system a URL; when something happens (a ticket is created, a payment succeeds) it POSTs a JSON event to that URL.</p>
<ul><li><b>Verify signatures</b>: providers sign the body with a shared secret (HMAC). Reject anything that doesn't match, or anyone can send fake events.</li>
<li><b>Respond fast (200 within seconds)</b> and do the real work in a background queue.</li>
<li><b>Expect duplicates and out-of-order delivery</b>: store the event ID and skip ones you've processed (idempotent handling).</li>
<li><b>Handle retries</b>: if you return an error, the provider will resend later.</li></ul>
<p><b>Event-driven architecture:</b> services publish events to a <b>message queue</b> or stream (SQS, RabbitMQ, Kafka, Google Pub/Sub); consumers process them at their own pace. It decouples systems and absorbs spikes. A <b>dead-letter queue</b> holds messages that keep failing so they can be inspected.</p>
<p><b>GraphQL:</b> one endpoint where the client asks for exactly the fields it needs:</p>
<pre>query { customer(id: "42") { name orders(last: 3) { id total } } }</pre>
<p>Used by Shopify, GitHub and many modern SaaS tools.</p>
<p><b>Streaming:</b> <b>Server-Sent Events (SSE)</b> push a stream of messages over one HTTP response. LLM APIs use it to stream tokens. <b>WebSockets</b> give two-way real-time channels (chat, live dashboards).</p>`,
  watch: [V("Webhooks explained", "what are webhooks explained"), V("Message queues explained", "message queues explained kafka rabbitmq sqs"), V("GraphQL explained", "graphql explained in 100 seconds")],
  cheat: `<pre>Webhook handler
  1. verify HMAC signature (hmac.compare_digest)
  2. dedupe by event id (store processed ids)
  3. enqueue work, return 200 fast
  4. worker processes; failures -> retry -> dead-letter queue
Polling vs webhook: pull on a timer vs push on change
Queues: SQS, RabbitMQ, Redis streams  |  Streams: Kafka, Kinesis, Pub/Sub
At-least-once delivery => handlers must be idempotent
GraphQL: POST /graphql {query, variables}; ask only needed fields
SSE: Content-Type: text/event-stream ; lines "data: {...}\\n\\n"
WebSocket: ws:// two-way</pre>`,
  tips: ["Assume every webhook can arrive twice and in the wrong order.", "Use hmac.compare_digest to compare signatures, not ==, to avoid timing attacks.", "For local testing, expose your laptop with a tunnel (ngrok, cloudflared) or use a webhook inspector.", "Log the raw event body (minus secrets) for debugging replays."],
  qs: [
    { q: "Why must webhook handlers be idempotent?", o: ["Providers may deliver the same event more than once", "Webhooks are always sent twice on purpose", "To save disk space", "HTTP requires it"], a: 0, why: "At-least-once delivery means duplicates are normal." },
    { q: "Why return 200 quickly and process in the background?", o: ["Slow responses cause the provider to time out and retry, creating duplicates", "200 is faster to type", "Background jobs are free", "It's required by GraphQL"], a: 0, why: "Providers expect quick acknowledgement." },
    { q: "What does a dead-letter queue hold?", o: ["Messages that repeatedly failed processing", "Deleted users", "Old log files", "Encrypted secrets"], a: 0, why: "It isolates poison messages so the main queue keeps flowing." },
    { q: "How do LLM APIs usually stream tokens to clients?", o: ["Server-Sent Events", "Email", "FTP", "Webhooks"], a: 0, why: "SSE sends a stream of data events over one HTTP connection." },
  ],
  scen: [{ t: "Receive a real webhook", d: "Create a free webhook inspector URL, register it as a GitHub repo webhook, push a commit, and inspect the payload and signature header. Then write a small Python function that verifies the signature." }],
  where: [["webhook.site", "https://webhook.site/", "Instant URL to inspect incoming webhooks"], ["Stripe webhooks guide", "https://docs.stripe.com/webhooks", "Industry-standard signature verification and retry behaviour"], ["GitHub GraphQL explorer", "https://docs.github.com/en/graphql/overview/explorer", "Run real GraphQL queries"]] },

{ id: "api-enterprise", topic: "api", title: "Enterprise systems and integration patterns", mins: 60,
  body: `
<p>FDE projects live inside the customer's existing software. You'll rarely get a clean modern API; you'll integrate with what they have.</p>
<p><b>Systems you'll meet constantly:</b></p>
<table class="ops"><tr><td>CRM</td><td>Salesforce, HubSpot, Microsoft Dynamics: customers, leads, deals, cases</td></tr>
<tr><td>ITSM / support</td><td>ServiceNow, Zendesk, Jira Service Management, Freshdesk: tickets and incidents</td></tr>
<tr><td>ERP</td><td>SAP, Oracle, NetSuite: finance, inventory, orders</td></tr>
<tr><td>HR</td><td>Workday, SuccessFactors: employees</td></tr>
<tr><td>Work / docs</td><td>Jira, Confluence, SharePoint, Google Drive, Notion, Slack, Teams</td></tr>
<tr><td>Data</td><td>Snowflake, BigQuery, Databricks, Postgres, legacy SQL Server/Oracle</td></tr></table>
<p><b>Integration patterns:</b></p>
<ul><li><b>Direct API</b>: REST/SOAP calls from your service (most control).</li>
<li><b>Webhooks / events</b>: react to changes in near real time.</li>
<li><b>Batch file exchange</b>: CSV/Excel over SFTP or cloud storage, often nightly. Still extremely common.</li>
<li><b>Database access</b>: read replicas or views, usually read-only.</li>
<li><b>iPaaS / middleware</b>: MuleSoft, Boomi, Workato, Zapier, n8n connect systems without custom code.</li>
<li><b>MCP connectors</b>: expose a system's data and actions to AI agents (Building with LLM APIs topic).</li></ul>
<p><b>Legacy realities:</b> SOAP/XML APIs, per-customer custom fields (Salesforce fields ending in <code>__c</code>), strict API quotas, sandboxes that differ from production, change freezes, and data that "should" be clean but isn't. Build a <b>field mapping</b> document early: source field → your field → transformation → owner.</p>`,
  watch: [V("Salesforce API integration basics", "salesforce rest api integration tutorial"), V("ServiceNow REST API tutorial", "servicenow rest api table api tutorial"), V("Enterprise integration patterns explained", "enterprise integration patterns explained")],
  cheat: `<pre>Integration options (least -> most effort to maintain)
  iPaaS connector | batch file | webhook | direct API | custom DB
Salesforce  REST /services/data/vXX.X/query?q=SOQL ; custom fields end __c
            SOQL: SELECT Id, Name FROM Account WHERE CreatedDate = TODAY
ServiceNow  Table API: /api/now/table/incident?sysparm_limit=10
Jira        /rest/api/3/search?jql=project=OPS
SOAP        XML envelopes; use zeep in Python
Field mapping doc: source | target | transform | owner | notes
Always ask: sandbox? quotas? service account? change windows?</pre>`,
  tips: ["Ask for a sandbox account and sample exports in week one; access takes longest.", "Custom fields vary per customer; never hard-code field names without a mapping config.", "Batch CSV is not old-fashioned if it's what the customer can support reliably.", "Respect API quotas: one bad loop can lock out the customer's whole org."],

    { q: "In Salesforce, what does a field name ending in __c indicate?", o: ["A custom field specific to that org", "A deleted field", "A calculated field in all orgs", "A primary key"], a: 0, why: "Custom objects and fields carry the __c suffix and vary per customer." },

    { q: "Why write a field mapping document early?", o: ["It aligns everyone on how source data becomes target data and exposes gaps", "It's needed for billing", "Python requires it", "To replace testing"], a: 0, why: "Mismatched fields and transformations cause most integration bugs." },
  ],

{ id: "sql-basics", topic: "data", title: "SQL basics: SELECT, WHERE, ORDER BY", mins: 60,
  body: `
<p>Customer data almost always lives in a relational database or warehouse, and SQL is how you ask it questions. Postings list it as a core skill because every FDE ends up exploring customer data.</p>
<p>A <b>table</b> has rows and columns, like a spreadsheet with strict types.</p>
<pre>SELECT name, city, signup_date
FROM customers
WHERE city = 'Jaipur' AND signup_date >= '2026-01-01'
ORDER BY signup_date DESC
LIMIT 10;</pre>
<p>Read it as: <b>FROM</b> which table → <b>WHERE</b> which rows → <b>SELECT</b> which columns → <b>ORDER BY</b> sort → <b>LIMIT</b> how many.</p>
<p><b>Filtering tools:</b> <code>=</code>, <code>&lt;&gt;</code>, <code>&lt;</code>, <code>BETWEEN 10 AND 20</code>, <code>IN ('A', 'B')</code>, <code>LIKE 'Raj%'</code> (starts with), <code>IS NULL</code> (never <code>= NULL</code>).</p>
<p><b>Aggregates</b> summarise many rows: <code>COUNT(*)</code>, <code>SUM(amount)</code>, <code>AVG</code>, <code>MIN</code>, <code>MAX</code>. With <b>GROUP BY</b> you get one row per group:</p>
<pre>SELECT city, COUNT(*) AS customers, AVG(order_total) AS avg_order
FROM customers
GROUP BY city
HAVING COUNT(*) >= 50        -- filter groups (WHERE filters rows)
ORDER BY customers DESC;</pre>
<p><b>Changing data:</b> <code>INSERT INTO t (a, b) VALUES (1, 'x')</code>, <code>UPDATE t SET a = 2 WHERE id = 7</code>, <code>DELETE FROM t WHERE id = 7</code>. Always run the WHERE as a SELECT first; an UPDATE without WHERE changes every row.</p>
<p>From Python, use parameterised queries, never string formatting: <code>cur.execute("SELECT * FROM users WHERE email = %s", (email,))</code>. That prevents SQL injection.</p>`,
  watch: [V("SQL tutorial for beginners", "sql tutorial for beginners full course"), V("SQL in 100 seconds", "sql explained in 100 seconds"), V("SQL in Hindi", "sql tutorial hindi complete", "HI")],
  cheat: `<pre>SELECT cols FROM t WHERE cond GROUP BY g HAVING agg_cond ORDER BY c DESC LIMIT n;
Execution order: FROM > WHERE > GROUP BY > HAVING > SELECT > ORDER BY > LIMIT
=  <>  >  BETWEEN a AND b  IN (...)  LIKE 'a%'  IS NULL  IS NOT NULL
COUNT(*) COUNT(DISTINCT x) SUM AVG MIN MAX
AS  rename       DISTINCT  unique rows
CASE WHEN x > 100 THEN 'big' ELSE 'small' END
COALESCE(phone, 'n/a')   first non-null
INSERT / UPDATE ... WHERE / DELETE ... WHERE   (SELECT the WHERE first!)
Python: cur.execute("... WHERE id = %s", (id,))   never f-strings</pre>`,
  tips: ["WHERE filters rows before grouping; HAVING filters groups after.", "NULL isn't equal to anything, not even NULL. Use IS NULL.", "Before any UPDATE or DELETE, run the same WHERE as a SELECT and check the row count.", "Never build SQL with f-strings from user input; that's SQL injection."],
  qs: [
    { q: "Which clause filters groups after aggregation?", o: ["WHERE", "HAVING", "ORDER BY", "LIMIT"], a: 1, why: "HAVING works on aggregated results like COUNT(*) >= 50." },
    { q: "Which condition correctly finds customers with no phone number?", o: ["phone = NULL", "phone IS NULL", "phone == ''", "phone = 'NULL'"], a: 1, why: "Comparisons with NULL are never true; SQL needs IS NULL." },
    { q: "What does `UPDATE accounts SET status = 'closed';` do?", o: ["Closes every account in the table", "Closes one account", "Nothing without a WHERE", "Creates a new column"], a: 0, why: "Without WHERE, UPDATE applies to all rows. A classic production disaster." },
    { q: "Why use parameterised queries from Python?", o: ["They prevent SQL injection by keeping data separate from the query", "They make SQL shorter", "Databases require them", "They're faster to type"], a: 0, why: "User input is treated as data, never executed as SQL." },
  ],
  scen: [{ t: "Answer business questions", d: "In SQLBolt or SQLZoo, answer: top 5 countries by population, average population per continent, and continents with more than 10 countries. Write each answer as a one-line insight a manager would understand." }],
  where: [["SQLBolt", "https://sqlbolt.com/", "Interactive lessons in the browser"], ["SQLZoo", "https://sqlzoo.net/", "Practice sets with real-looking data"], ["LeetCode SQL 50", "https://leetcode.com/studyplan/top-sql-50/", "Interview-style SQL problems"]] },

{ id: "sql-joins", topic: "data", title: "Joins and relationships", mins: 60,
  body: `
<p>Real databases split data across tables to avoid repetition: <code>customers</code>, <code>orders</code>, <code>order_items</code>, <code>products</code>. <b>Joins</b> put it back together.</p>
<p>Tables connect with <b>keys</b>: each table has a <b>primary key</b> (unique id). A <b>foreign key</b> in another table points to it: <code>orders.customer_id</code> → <code>customers.id</code>.</p>
<pre>SELECT c.name, o.id AS order_id, o.total
FROM customers c
JOIN orders o ON o.customer_id = c.id
WHERE o.created_at >= '2026-09-01';</pre>
<p><b>Join types:</b></p>
<table class="ops"><tr><td><b>INNER JOIN</b></td><td>only rows with a match in both tables</td></tr>
<tr><td><b>LEFT JOIN</b></td><td>all rows from the left table; NULLs where the right has no match</td></tr>
<tr><td><b>RIGHT JOIN</b></td><td>the mirror image (rarely used; swap tables and LEFT JOIN instead)</td></tr>
<tr><td><b>FULL OUTER JOIN</b></td><td>all rows from both, matched where possible</td></tr></table>
<p><b>Find things that are missing</b> with LEFT JOIN + IS NULL:</p>
<pre>-- customers who never ordered
SELECT c.name
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.id
WHERE o.id IS NULL;</pre>
<p><b>Watch the row count.</b> Joining a customer to 5 orders produces 5 rows; summing a customer-level column after that join counts it 5 times. Aggregate first, or join at the right level.</p>
<p><b>Relationship types:</b> one-to-many (customer → orders), many-to-many (orders ↔ products, through an <code>order_items</code> table), one-to-one (user → profile).</p>`,
  watch: [V("SQL joins explained visually", "sql joins explained visually"), V("SQL joins in Hindi", "sql joins hindi", "HI")],
  cheat: `<pre>SELECT ... FROM a
  [INNER] JOIN b ON b.a_id = a.id      matches only
  LEFT JOIN b ON ...                    keep all of a
  FULL OUTER JOIN b ON ...              keep all of both
Anti-join (missing):  LEFT JOIN b ... WHERE b.id IS NULL
Semi-join (exists):   WHERE EXISTS (SELECT 1 FROM b WHERE b.a_id = a.id)
Self join: employees e JOIN employees m ON e.manager_id = m.id
Many-to-many: orders -> order_items -> products
Check counts: SELECT COUNT(*) before and after each join</pre>`,
  tips: ["Always alias tables (c, o) and prefix columns; ambiguity causes silent bugs.", "Row count jumped after a join? You joined one-to-many; aggregate at the right grain.", "LEFT JOIN + IS NULL is the standard way to find 'X without Y'.", "Putting a condition on the right table in WHERE turns a LEFT JOIN back into an INNER JOIN; put it in ON instead."],
  qs: [
    { q: "You want all customers, including those with no orders. Which join?", o: ["INNER JOIN orders", "LEFT JOIN orders", "CROSS JOIN orders", "No join"], a: 1, why: "LEFT JOIN keeps every row from the left table." },
    { q: "customers has 100 rows; each has exactly 3 orders. How many rows does customers INNER JOIN orders return?", o: ["100", "3", "300", "103"], a: 2, why: "Each customer row repeats once per matching order: 100 × 3." },
    { q: "Which query finds products that have never been sold?", o: ["products LEFT JOIN order_items ... WHERE order_items.id IS NULL", "products INNER JOIN order_items", "SELECT * FROM order_items", "products WHERE sold = NULL"], a: 0, why: "The anti-join pattern keeps products with no matching sale." },
    { q: "What is a foreign key?", o: ["A column that references the primary key of another table", "An encryption key", "A key from another country", "The first column in a table"], a: 0, why: "Foreign keys link related rows across tables." },
  ],
  scen: [{ t: "Customer 360", d: "Using a sample database (e.g., the Chinook or Northwind sample), build one query that shows each customer with their total spend, number of orders and last order date, including customers with zero orders." }],
  where: [["PostgreSQL Exercises", "https://pgexercises.com/", "Join-heavy practice on a real schema"], ["SQLBolt joins lessons", "https://sqlbolt.com/lesson/select_queries_with_joins", "Interactive"], ["Chinook sample database", "https://github.com/lerocha/chinook-database", "Realistic music store data"]] },

{ id: "sql-advanced", topic: "data", title: "Window functions, CTEs and performance", mins: 60,
  body: `
<p>FDE interview guides specifically call out window functions, CTEs and query optimisation. These let you answer real analytical questions in one query.</p>
<p><b>CTEs</b> (<code>WITH</code>) name intermediate results so complex queries read top to bottom:</p>
<pre>WITH monthly AS (
  SELECT customer_id, DATE_TRUNC('month', created_at) AS month, SUM(total) AS spend
  FROM orders GROUP BY 1, 2
)
SELECT * FROM monthly WHERE spend > 10000;</pre>
<p><b>Window functions</b> compute across related rows <i>without</i> collapsing them like GROUP BY does:</p>
<pre>SELECT customer_id, created_at, total,
  ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY created_at) AS nth_order,
  SUM(total)   OVER (PARTITION BY customer_id ORDER BY created_at) AS running_spend,
  LAG(created_at) OVER (PARTITION BY customer_id ORDER BY created_at) AS prev_order
FROM orders;</pre>
<ul><li><code>PARTITION BY</code>: restart the calculation for each group.</li>
<li><code>ROW_NUMBER</code>, <code>RANK</code>, <code>DENSE_RANK</code>: numbering (top-N per group).</li>
<li><code>LAG</code>/<code>LEAD</code>: previous/next row's value (gaps, changes).</li>
<li>Running totals and moving averages with <code>ORDER BY</code> and frames.</li></ul>
<p><b>Top N per group</b> (a very common question): number rows per group in a CTE, then filter <code>WHERE rn &lt;= 3</code>.</p>
<p><b>Performance:</b> an <b>index</b> is like a book's index: it lets the database jump to rows instead of scanning the whole table. Index columns you filter or join on. Use <code>EXPLAIN ANALYZE</code> to see whether a query scans everything (<i>Seq Scan</i>) or uses an index. Select only needed columns, filter early, and avoid functions on indexed columns in WHERE.</p>`,
  watch: [V("SQL window functions explained", "sql window functions explained"), V("Ankit Bansal · SQL for analytics", "ankit bansal sql window functions", "HI"), V("SQL indexes explained", "database indexes explained")],
  cheat: `<pre>WITH a AS (...), b AS (... FROM a ...) SELECT ... FROM b;
fn() OVER (PARTITION BY g ORDER BY t [ROWS BETWEEN 6 PRECEDING AND CURRENT ROW])
ROW_NUMBER() unique 1,2,3   RANK() 1,1,3   DENSE_RANK() 1,1,2
LAG(x, 1) / LEAD(x, 1)       previous / next value
SUM(x) OVER (PARTITION BY g ORDER BY t)   running total
AVG(x) OVER (... ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)  7-day avg
Top N per group:
  WITH r AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY g ORDER BY v DESC) rn FROM t)
  SELECT * FROM r WHERE rn <= 3;
CREATE INDEX idx_orders_cust ON orders(customer_id);
EXPLAIN ANALYZE SELECT ...;   Seq Scan = full table read</pre>`,
  tips: ["GROUP BY collapses rows; window functions keep every row and add a column.", "You can't filter on a window function in the same SELECT's WHERE; wrap it in a CTE.", "Use ROW_NUMBER for exactly N per group; RANK if ties should share a position.", "Indexes speed reads but slow writes; don't index everything."],
  qs: [
    { q: "What's the key difference between GROUP BY and a window function?", o: ["Window functions keep each row while adding a computed value", "GROUP BY is faster always", "Window functions only work on text", "No difference"], a: 0, why: "GROUP BY returns one row per group; OVER() returns every row." },
    { q: "Values 90, 90, 80 ordered descending. What does DENSE_RANK() give?", o: ["1, 1, 2", "1, 2, 3", "1, 1, 3", "0, 0, 1"], a: 0, why: "DENSE_RANK gives ties the same rank without gaps. RANK would give 1, 1, 3." },
    { q: "Which function gives the previous order date for each customer?", o: ["LAG(created_at) OVER (PARTITION BY customer_id ORDER BY created_at)", "LEAD(created_at)", "MAX(created_at)", "COUNT(*)"], a: 0, why: "LAG looks one row back within the partition." },
    { q: "EXPLAIN shows 'Seq Scan' on a 50-million-row table for WHERE email = ?. What usually helps?", o: ["Add an index on email", "Add more columns", "Use SELECT *", "Remove the WHERE"], a: 0, why: "An index lets the database find matching rows without reading the whole table." },
  ],
  scen: [{ t: "Cohort question", d: "With a sample orders table, answer: for each customer, their 1st and 2nd order dates, the days between them, and the average gap per signup month. Use CTEs and LAG." }],
  where: [["LeetCode SQL 50", "https://leetcode.com/studyplan/top-sql-50/", "Includes window-function problems"], ["DataLemur SQL", "https://datalemur.com/", "Real interview SQL questions"], ["Use The Index, Luke", "https://use-the-index-luke.com/", "Free guide to SQL performance"]] },

{ id: "data-model", topic: "data", title: "Data modelling and Postgres", mins: 50,
  body: `
<p>You'll often design small databases for a pilot, and you'll read customers' schemas all the time. Good modelling prevents painful data bugs.</p>
<p><b>Normalisation</b>: store each fact once. Instead of repeating a customer's address on every order, keep a <code>customers</code> table and reference it by id. That avoids update anomalies (changing an address in one place but not another).</p>
<p><b>Denormalisation</b>: deliberately duplicating data for faster reads, typical in analytics and reporting.</p>
<p><b>Design steps:</b> list the entities (nouns: Customer, Ticket, Agent), their attributes, and the relationships (one-to-many, many-to-many). Draw an <b>ER diagram</b>. Pick primary keys (an id or a UUID), foreign keys, and constraints.</p>
<pre>CREATE TABLE tickets (
  id          BIGSERIAL PRIMARY KEY,
  customer_id BIGINT NOT NULL REFERENCES customers(id),
  subject     TEXT NOT NULL,
  status      TEXT NOT NULL CHECK (status IN ('open', 'pending', 'closed')),
  priority    SMALLINT DEFAULT 3,
  metadata    JSONB,
  created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
);</pre>
<p><b>Constraints are free data quality</b>: NOT NULL, UNIQUE, CHECK and foreign keys stop bad data at the door.</p>
<p><b>Why Postgres keeps appearing:</b> reliable, free, supports JSONB for semi-structured data, full-text search, and vector search with <b>pgvector</b>, so one database can hold app data and RAG embeddings. <b>Transactions</b> (BEGIN … COMMIT) make multi-step changes all-or-nothing. Store times as <code>TIMESTAMPTZ</code> in UTC.</p>
<p><b>Other stores:</b> document DBs (MongoDB), key-value (Redis), search engines (Elasticsearch/OpenSearch), warehouses (Snowflake, BigQuery), vector DBs. Choose based on access patterns.</p>`,
  watch: [V("Database design course", "database design course beginners normalization"), V("PostgreSQL tutorial", "postgresql tutorial for beginners"), V("DBMS normalization in Hindi (Gate Smashers)", "gate smashers normalization dbms", "HI")],
  cheat: `<pre>Entity -> table   Attribute -> column   Relationship -> foreign key
1:N   put FK on the "many" side (orders.customer_id)
N:M   join table (order_items: order_id, product_id, qty)
PRIMARY KEY  NOT NULL  UNIQUE  CHECK (...)  REFERENCES t(id)  DEFAULT
Types: BIGINT  NUMERIC(12,2) for money  TEXT  BOOLEAN
       TIMESTAMPTZ (store UTC)  JSONB  UUID
BEGIN; ...; COMMIT;   (or ROLLBACK)
JSONB: metadata->>'source'   WHERE metadata @> '{"vip": true}'
pgvector: embedding vector(1536); ORDER BY embedding <=> $1 LIMIT 5
Tools: psql, DBeaver, pgAdmin, dbdiagram.io</pre>`,

{ id: "data-stack", topic: "data", title: "The modern data stack and pipelines", mins: 50,
  body: `
<p>Large customers keep their data in a <b>warehouse</b> or <b>lakehouse</b> and move it with <b>pipelines</b>. FDE postings name Snowflake, BigQuery, Redshift, Databricks, dbt, Airflow and Spark.</p>
<table class="ops"><tr><td><b>Warehouse</b></td><td>Snowflake, BigQuery, Redshift: SQL over huge tables; storage and compute scale separately.</td></tr>
<tr><td><b>Lakehouse</b></td><td>Databricks (Delta Lake), Apache Iceberg: files in cloud storage (Parquet) with table features on top; good for ML.</td></tr>
<tr><td><b>Ingestion</b></td><td>Fivetran, Airbyte: copy data from SaaS apps and databases into the warehouse.</td></tr>
<tr><td><b>Transformation</b></td><td><b>dbt</b>: SQL models with tests and documentation, versioned in Git.</td></tr>
<tr><td><b>Orchestration</b></td><td><b>Airflow</b>, Dagster, Prefect: schedule and chain jobs as DAGs with retries and alerts.</td></tr>
<tr><td><b>Big processing</b></td><td><b>Spark</b> (PySpark): distributed processing when data doesn't fit one machine.</td></tr>
<tr><td><b>Streaming</b></td><td>Kafka, Kinesis, Flink: continuous events.</td></tr></table>
<p><b>ETL vs ELT:</b> older ETL transforms before loading; modern ELT loads raw data into the warehouse first, then transforms with SQL (dbt). ELT keeps the raw data for re-processing.</p>
<p><b>Pipeline qualities that matter:</b> <b>idempotent</b> runs (re-running a day doesn't duplicate data), <b>incremental</b> loads (only new/changed rows), <b>data quality tests</b> (not null, unique, accepted values, freshness), lineage (where did this number come from?), and alerts when something fails or arrives late.</p>
<p>For AI projects, pipelines feed RAG indexes and eval datasets, and log model outputs back into the warehouse for analysis.</p>`,
  watch: [V("Modern data stack explained", "modern data stack explained"), V("dbt in 10 minutes", "dbt tutorial beginners"), V("Airflow tutorial", "apache airflow tutorial for beginners"), V("Data engineering roadmap in Hindi", "data engineering roadmap hindi", "HI")],
  cheat: `<pre>Sources -> Ingest (Fivetran/Airbyte) -> Warehouse/Lakehouse
        -> Transform (dbt) -> Marts -> BI / ML / RAG

dbt: models/*.sql  {{ ref('stg_orders') }}  tests: not_null unique
     accepted_values relationships ; dbt run ; dbt test ; dbt docs
Idempotent load: MERGE / upsert by key, or overwrite partition
Incremental: WHERE updated_at > (last watermark)
Parquet = columnar files; partition by date
Spark: df = spark.read.parquet(p); df.groupBy(k).agg(...)
Snowflake/BigQuery = SQL + pay for compute/scan</pre>`,
  tips: ["Design every load so it can be safely re-run for the same day.", "Keep raw data forever-ish; transformations change, raw facts don't.", "On pay-per-scan warehouses (BigQuery), SELECT * on a big table costs real money.", "Ask the customer's data team what they already use; plug into it rather than adding tools."],

{ id: "be-fastapi", topic: "backend", title: "Building APIs with FastAPI", mins: 75,
  body: `
<p>FDEs regularly wrap a model, a workflow or an integration in a small web service so other systems can call it. <b>FastAPI</b> is the most popular Python choice: fast, typed, and it generates interactive docs automatically.</p>
<pre>from fastapi import FastAPI, HTTPException
from pydantic import BaseModel, Field

app = FastAPI(title="Ticket triage")

class TicketIn(BaseModel):
    subject: str = Field(min_length=3, max_length=200)
    body: str
    customer_id: int

class TicketOut(BaseModel):
    id: int
    category: str
    priority: int

DB: dict[int, TicketOut] = {}

@app.post("/tickets", response_model=TicketOut, status_code=201)
def create_ticket(t: TicketIn):
    category = "billing" if "invoice" in t.body.lower() else "general"
    out = TicketOut(id=len(DB) + 1, category=category, priority=3)
    DB[out.id] = out
    return out

@app.get("/tickets/{ticket_id}", response_model=TicketOut)
def get_ticket(ticket_id: int):
    if ticket_id not in DB:
        raise HTTPException(status_code=404, detail="Ticket not found")
    return DB[ticket_id]</pre>
<p>Run with <code>uvicorn main:app --reload</code> and open <code>/docs</code> for a clickable API page.</p>
<p><b>What you get for free:</b> <b>Pydantic</b> validates input (wrong types → a clear 422 error), path and query parameters are parsed and typed, and the OpenAPI spec documents everything.</p>
<p><b>Dependencies</b> (<code>Depends</code>) inject shared things like a database session or the current user. <b>Async endpoints</b> (<code>async def</code>) let one server handle many slow I/O calls (like LLM requests) at once.</p>`,
  watch: [V("FastAPI full course", "fastapi course for beginners"), V("FastAPI in Hindi", "fastapi tutorial hindi", "HI")],
  cheat: `<pre>pip install "fastapi[standard]" ; fastapi dev main.py  (or uvicorn main:app --reload)

class ItemIn(BaseModel): name: str = Field(min_length=1); price: float = Field(gt=0)
raise HTTPException(404, "Not found")
def get_db(): ...   def f(db = Depends(get_db))
async def f(): r = await client.get(...)
BackgroundTasks for fire-and-forget work
/docs Swagger UI   /openapi.json spec
Test: from fastapi.testclient import TestClient; TestClient(app).get("/")</pre>`,

{ id: "be-prod", topic: "backend", title: "Production-ready backends", mins: 60,
  body: `
<p>A demo API and a production API differ in everything around the happy path. FDE interviews test exactly this: auth, validation, errors, config, logging and tests.</p>
<p><b>Configuration:</b> read settings from environment variables (12-factor app), validated at startup with <code>pydantic-settings</code>. The same code runs in dev, staging and production with different config.</p>
<p><b>Authentication and authorisation:</b> verify an API key, a JWT from the customer's SSO, or an OAuth token on every request; then check the caller may do this action on this resource. Return 401 vs 403 correctly.</p>
<p><b>Error handling:</b> never leak stack traces to clients. Return consistent JSON errors (<code>{"error": "ticket_not_found", "message": "..."}</code>), log the details server-side with a request ID.</p>
<p><b>Structured logging:</b> log JSON lines with request_id, user/tenant, route, status, latency. It makes debugging in customer environments possible.</p>
<p><b>Database access:</b> an ORM (<b>SQLAlchemy</b>, SQLModel) or plain SQL with a connection pool; migrations with <b>Alembic</b> so schema changes are versioned and repeatable.</p>
<p><b>Health checks:</b> <code>/healthz</code> (process alive) and <code>/readyz</code> (dependencies reachable) so load balancers and Kubernetes know when to route traffic.</p>
<p><b>Multi-tenancy:</b> when one deployment serves several customers or teams, every query must be scoped by tenant. A missing tenant filter is a data leak.</p>`,
  watch: [V("Production-ready FastAPI", "fastapi production best practices"), V("12 factor app explained", "12 factor app explained"), V("SQLAlchemy and Alembic tutorial", "sqlalchemy alembic migrations tutorial")],
  cheat: `<pre>Config:   class Settings(BaseSettings): db_url: str; api_key: SecretStr
Auth:     Depends(verify_token) on routes; 401 unknown / 403 forbidden
Errors:   @app.exception_handler(MyError) -> JSONResponse({"error": code})
Logging:  JSON lines: ts, level, request_id, tenant, route, status, ms
Request ID: middleware sets X-Request-ID, include in logs + responses
DB:       SQLAlchemy engine + session per request; pool_pre_ping=True
Migrations: alembic revision --autogenerate -m "add tickets" ; alembic upgrade head
Health:   GET /healthz -> 200 ; GET /readyz checks DB, queue, LLM API
Tenancy:  every query WHERE tenant_id = :tenant (enforce centrally)</pre>`,
  tips: ["Validate config at startup; crash immediately with a clear message rather than failing later.", "Include the request ID in every error response; customers can quote it and you can find the logs.", "Enforce tenant scoping in one place (a dependency or row-level security), not in every query by hand.", "Schema changes go through migrations, never manual ALTERs on production."],
