{ id: "llm-ml", topic: "llm", title: "Machine learning foundations for AI engineers", mins: 60,
  body: `
<p>You'll mostly use pretrained models, but customers ask ML questions, older systems use classic ML, and evals borrow ML's measurement tools. Andrew Ng's 2026 AI-engineering skills map still lists ML foundations as a core skill.</p>
<p><b>The core idea:</b> a model learns a mapping from inputs to outputs from examples. <b>Supervised learning</b> uses labelled examples (ticket text → category). <b>Unsupervised learning</b> finds structure without labels (clustering similar tickets). <b>Reinforcement learning</b> learns from rewards (and is how LLMs are tuned to follow instructions).</p>
<p><b>Train / validation / test split:</b> learn on training data, tune on validation data, and report on test data the model has never seen. Testing on training data is the classic mistake: it measures memory, not skill.</p>
<p><b>Overfitting</b> means great on training data, poor on new data. <b>Underfitting</b> means poor everywhere. More (and more varied) data, simpler models and regularisation fight overfitting.</p>
<p><b>Classification metrics</b> you'll use in every LLM eval:</p>
<table class="ops"><tr><td><b>Accuracy</b></td><td>share of all predictions that are right; misleading when classes are unbalanced</td></tr>
<tr><td><b>Precision</b></td><td>of the items you flagged, how many were right (few false alarms)</td></tr>
<tr><td><b>Recall</b></td><td>of the items that should be flagged, how many you caught (few misses)</td></tr>
<tr><td><b>F1</b></td><td>a balance of precision and recall</td></tr>
<tr><td><b>Confusion matrix</b></td><td>a table of predicted vs actual classes: shows exactly which mistakes happen</td></tr></table>
<p>Which matters more depends on cost: for fraud alerts, missing fraud (low recall) is worse; for auto-closing tickets, wrongly closing a real issue (low precision) is worse.</p>
<p><b>When classic ML beats an LLM:</b> tabular data (churn, credit risk), very high volume at tiny cost, strict latency, or when a simple model is already good enough. scikit-learn and gradient boosting (XGBoost, LightGBM) remain everyday tools.</p>`,
  watch: [V("Andrew Ng · Machine Learning Specialization", "andrew ng machine learning specialization"), V("StatQuest · precision and recall", "statquest precision recall confusion matrix"), V("Machine learning in Hindi (Krish Naik)", "krish naik machine learning hindi", "HI")],
  cheat: `<pre>Supervised (labels) | Unsupervised (structure) | RL (rewards)
Split: train (learn) / validation (tune) / test (report, untouched)
Overfit = train great, test poor  -> more data, simpler model, regularise
Accuracy = correct / all          (bad with unbalanced classes)
Precision = TP / (TP + FP)        few false alarms
Recall    = TP / (TP + FN)        few misses
F1 = 2PR / (P + R)
Confusion matrix: rows actual, cols predicted
Classic ML wins: tabular data, huge volume, strict latency, cheap
Tools: scikit-learn, XGBoost/LightGBM, pandas</pre>`,
  tips: ["Never report a score measured on data the model (or your prompt iterations) already saw.", "With 95% of tickets in one class, 95% accuracy can mean the model learned nothing.", "Ask 'which mistake is more expensive here?' before choosing precision or recall.", "A logistic regression baseline takes minutes; beat it before proposing an LLM for tabular data."],
  scen: [{ t: "Metrics by hand", d: "Take your Project 4 classifier results and build a confusion matrix in a spreadsheet. Compute precision, recall and F1 per category. Decide which category's mistakes matter most for the customer and why." }],
  where: [["scikit-learn tutorials", "https://scikit-learn.org/stable/tutorial/index.html", "Classic ML in Python"], ["Kaggle Learn: Intro to ML", "https://www.kaggle.com/learn/intro-to-machine-learning", "Free hands-on course"], ["Google ML Crash Course", "https://developers.google.com/machine-learning/crash-course", "Free, practical fundamentals"]] },

{ id: "llm-multi", topic: "llm", title: "Multimodal, reasoning and voice models", mins: 50,
  body: `
<p>2026 deployments go well beyond text chat. Customers bring scanned forms, screenshots, call recordings and complex analytical questions.</p>
<p><b>Vision and document understanding:</b> modern models read images and PDFs directly: invoices, charts, handwritten notes, screenshots of legacy screens. Common FDE uses: extracting fields from documents (with a schema and validation), answering questions about charts, checking photos for completeness (insurance claims, site inspections). Always validate numbers against a second source or a rule; vision models can misread digits.</p>
<p><b>Reasoning models</b> "think" before answering (extended or adaptive thinking). They're much better at multi-step problems: planning, maths, complex policy interpretation, code. Trade-offs: more tokens, higher latency and cost. Use them where the task needs it, not for simple classification.</p>
<p><b>Speech and voice:</b></p>
<ul><li><b>Speech-to-text (STT)</b>: transcribe calls and meetings (Whisper and hosted equivalents). Watch accents, code-mixed speech (Hinglish), and speaker labelling.</li>
<li><b>Text-to-speech (TTS)</b>: natural voices for IVR and assistants.</li>
<li><b>Realtime voice agents</b>: speech-to-speech models or STT → LLM → TTS pipelines. Latency budgets are tight (people notice pauses over about a second), interruptions ("barge-in") must be handled, and every tool call adds delay.</li></ul>
<p><b>Image generation</b> appears in marketing and design use cases; it brings brand, copyright and consent questions.</p>
<p><b>Design questions for any multimodal pilot:</b> file sizes and formats, cost per page or minute, languages and accents, where audio or images may be stored (they're often sensitive), and how a human reviews low-confidence results.</p>`,
  watch: [V("Multimodal LLMs explained", "multimodal llm explained vision"), V("Building voice AI agents", "building voice ai agents realtime latency"), V("Reasoning models explained", "reasoning models explained thinking tokens")],
  cheat: `<pre>Vision/docs: images + PDFs in, schema out -> validate digits and totals
Reasoning models: better multi-step thinking; cost more tokens + latency
  use for: planning, maths, complex policy, code | skip for: simple labels
STT: Whisper-class models; test accents, Hinglish, diarisation
TTS: voices for IVR/assistants
Voice agent: speech-to-speech or STT -> LLM -> TTS
  budget < ~1 s per turn; handle barge-in; minimise tool calls mid-turn
Cost units: per image/page, per audio minute, per thinking token
Sensitive: call audio, ID photos, medical images -> retention rules</pre>`,
  tips: ["Test document extraction on the customer's worst scans, not the clean sample.", "Turn reasoning on per task, not globally; measure whether it actually improves your eval.", "For voice, measure end-to-end latency per turn from the user's perspective.", "Audio and images are often more sensitive than text; agree retention before recording anything."],
  scen: [{ t: "Invoice reader", d: "Photograph or download 5 varied invoices. Extract vendor, date, total and line items with a vision-capable model into a Pydantic schema, then check totals against the sum of line items in code. Record which fields failed." }, { t: "Call summary", d: "Record a 2-minute mock support call (with a friend, in mixed Hindi-English). Transcribe it with a speech-to-text model and summarise it into a ticket. Note transcription errors and how they affected the summary." }],
  where: [["Claude vision docs", "https://docs.claude.com/en/docs/build-with-claude/vision", "Images and documents as input"], ["OpenAI Whisper (GitHub)", "https://github.com/openai/whisper", "Open speech-to-text model"], ["Pipecat", "https://github.com/pipecat-ai/pipecat", "Open-source framework for voice agents"]] },

{ id: "ops-serve", topic: "cloud", title: "Serving open models: GPUs, quantisation, vLLM", mins: 60,
  body: `
<p>When data can't leave a customer's network, or volume makes API pricing too expensive, you'll run <b>open-weight models</b> (Llama, Qwen, Mistral, DeepSeek, Gemma) yourself. Inference is its own engineering skill.</p>
<p><b>Memory is the first constraint.</b> A model's weights need roughly <i>parameters × bytes per parameter</i> of GPU memory: a 7-8B model at 16-bit is about 16 GB; a 70B model is about 140 GB. You also need memory for the <b>KV cache</b>, which grows with context length and the number of concurrent requests.</p>
<p><b>Quantisation</b> stores weights in fewer bits (8-bit, 4-bit: GPTQ, AWQ, GGUF), cutting memory 2-4× with a small quality loss. Always re-run your eval after quantising.</p>
<p><b>Serving engines:</b></p>
<table class="ops"><tr><td><b>vLLM</b></td><td>high-throughput server with continuous batching and paged attention; OpenAI-compatible API</td></tr>
<tr><td><b>TGI / SGLang / TensorRT-LLM</b></td><td>alternatives tuned for speed on specific hardware</td></tr>
<tr><td><b>Ollama / llama.cpp</b></td><td>easy local and CPU/Mac use; great for prototypes and laptops</td></tr></table>
<p><b>Metrics that matter:</b> time to first token (TTFT), tokens per second per user, total throughput, p95 latency, GPU utilisation, and cost per million tokens compared with API pricing.</p>
<p><b>Capacity planning:</b> estimate peak concurrent users × average tokens, test with a load tool, and leave headroom. <b>Autoscaling GPUs</b> is slow (minutes to load a model), so plan minimum replicas for business hours.</p>
<p><b>Security and ops:</b> pin model versions and checksums, keep the server private, add auth in front of the OpenAI-compatible endpoint, and log usage per team like any other API.</p>`,
  watch: [V("vLLM explained", "vllm explained paged attention continuous batching"), V("LLM quantization explained", "llm quantization explained gguf awq gptq"), V("Run LLMs locally with Ollama (Hindi)", "ollama tutorial hindi", "HI")],
  cheat: `<pre>Weights memory ~ params x bytes: 8B@16-bit ~ 16 GB ; 70B@16-bit ~ 140 GB
+ KV cache (grows with context x concurrency)
Quantise: 8-bit ~2x smaller, 4-bit ~4x smaller -> re-run evals
vLLM: vllm serve <model> --max-model-len 8192   (OpenAI-compatible /v1)
Ollama: ollama run qwen2.5:7b    (local prototypes)
Metrics: TTFT, tokens/s/user, throughput, p95, GPU util, $/M tokens
Break-even: self-host when volume x API price > GPUs + ops time
Ops: pin model + sha256, private network, auth proxy, per-team usage logs</pre>`,
  tips: ["Do the memory maths before requesting GPUs; it avoids week-long procurement mistakes.", "Compare self-hosting against API cost honestly: include engineers' time and idle GPUs.", "Quantisation is free speed until your eval says otherwise.", "Keep an OpenAI-compatible endpoint so application code doesn't care where the model runs."],
  scen: [{ t: "Local serving lab", d: "Run a 7-8B open model with Ollama (or vLLM if you have a GPU). Point your Project 4 classifier at it through an OpenAI-compatible endpoint, run your golden set, and compare accuracy, latency and estimated cost with the API model." }],
  where: [["Ollama", "https://ollama.com/", "Run open models locally"], ["vLLM docs", "https://docs.vllm.ai/", "Production serving"], ["Hugging Face model hub", "https://huggingface.co/models", "Open-weight models and quantised variants"]] },

{ id: "rag-graph", topic: "rag", title: "GraphRAG, knowledge graphs and text-to-SQL", mins: 55,
  body: `
<p>Vector search finds passages that <i>sound</i> relevant. Some questions need <b>relationships</b> or <b>exact numbers</b> instead, and that's where structured retrieval comes in.</p>
<p><b>Knowledge graphs</b> store entities (customers, products, contracts, people) and relationships (signed, owns, reports to) as nodes and edges. Questions like "Which suppliers of our top-5 products had a late delivery last quarter?" need hops across relationships that chunks rarely contain in one place.</p>
<p><b>GraphRAG</b> builds a graph from documents (often with an LLM extracting entities and relations), then retrieves by traversing it, or by summarising clusters of related entities for broad "what are the main themes?" questions. Tools: Neo4j, Microsoft GraphRAG, LlamaIndex property graphs, Postgres with graph extensions.</p>
<p><b>Text-to-SQL</b> answers questions over databases by having the model write a SQL query, running it, and explaining the result. It's the right choice for "how many / how much / trend" questions, since the numbers come from the database rather than the model's memory.</p>
<ul><li>Give the model the schema, table descriptions and example queries.</li>
<li>Run queries with a <b>read-only</b> user, row limits and timeouts.</li>
<li>Validate or allow-list the SQL (no writes, no system tables), and show the query to the user.</li>
<li>Build an eval of questions with known correct results.</li></ul>
<p><b>Route by question type:</b> policy wording → vector/hybrid RAG; relationships → graph; numbers and aggregates → SQL; and let an agent combine them when a question needs several.</p>`,
  watch: [V("GraphRAG explained", "graphrag explained microsoft knowledge graph rag"), V("Text to SQL with LLMs", "text to sql llm tutorial"), V("Knowledge graphs explained", "knowledge graph explained neo4j")],
  cheat: `<pre>Question type -> retrieval
  wording/policy        -> vector + keyword (hybrid)
  relationships/hops    -> knowledge graph (Cypher / graph traversal)
  numbers/aggregates    -> text-to-SQL on a read-only connection
  mixed                 -> agent routing across tools
GraphRAG: extract entities+relations -> graph -> traverse / community summaries
Text-to-SQL safety: read-only user | allow-list SELECT | LIMIT | timeout
                    | show query | eval with known answers
Tools: Neo4j, Microsoft GraphRAG, LlamaIndex, pgvector + SQL, Vanna</pre>`,
  tips: ["Never let a model compute totals from retrieved text when a database can compute them exactly.", "Text-to-SQL must run as a read-only user; no exceptions.", "Show users the generated SQL or graph path; it builds trust and catches mistakes.", "Start with a router and plain SQL before investing in a full knowledge graph."],
  scen: [{ t: "Ask your data", d: "Point a text-to-SQL prototype at your Project 2 database with a read-only user. Write 15 questions with known answers (counts, top-N, trends), measure how many it gets right, and add guardrails for any unsafe query it tried." }],
  where: [["Neo4j GraphAcademy", "https://graphacademy.neo4j.com/", "Free graph database courses"], ["Microsoft GraphRAG", "https://github.com/microsoft/graphrag", "Reference implementation"], ["LlamaIndex docs", "https://docs.llamaindex.ai/", "Property graphs and SQL retrieval"]] },

{ id: "ag-context", topic: "agent", title: "Context engineering and agent memory", mins: 55,
  body: `
<p>Market guides in 2026 describe <b>context engineering</b> as having replaced prompt engineering as the core skill. The question is no longer "what's the perfect wording?" but "what should be in the model's context window at each step, and what should be left out?"</p>
<p><b>What goes into context:</b> system instructions, tool definitions, retrieved documents, conversation history, memory about the user, tool results, and the agent's own notes. Every token competes for the model's attention and costs money.</p>
<p><b>Techniques:</b></p>
<ul><li><b>Selecting</b>: retrieve only what the current step needs; load tools or skills on demand instead of all at once.</li>
<li><b>Compressing</b>: summarise long histories and bulky tool outputs ("compaction"); keep IDs and key facts, drop noise.</li>
<li><b>Structuring</b>: clear sections and tags, stable ordering, the most important instructions where they won't be buried.</li>
<li><b>Isolating</b>: give sub-agents their own clean context, and pass back summaries rather than transcripts.</li>
<li><b>Externalising</b>: let the agent write notes, plans and progress to files or a store it can re-read (scratchpads, to-do lists).</li></ul>
<p><b>Memory types:</b> <i>short-term</i> (this conversation), <i>working</i> (task notes and state), and <i>long-term</i> (facts across sessions: preferences, past cases), stored in a database or memory service (Mem0, Zep, Letta) and retrieved by relevance. Long-term memory needs rules: what gets saved, who can see it, how it's corrected or forgotten, and retention limits.</p>
<p><b>Failure modes:</b> context rot (quality drops as context grows), stale memory, contradictory instructions, and sensitive data persisting where it shouldn't.</p>`,
  watch: [V("Context engineering explained", "context engineering for ai agents explained"), V("Anthropic: effective context engineering", "anthropic effective context engineering ai agents"), V("AI agent memory Mem0 Letta", "ai agent long term memory mem0 letta")],
  cheat: `<pre>Context = instructions + tools + retrieved docs + history + memory + tool results + notes
Select   : retrieve per step; load tools/skills on demand
Compress : summarise history + big tool outputs (keep IDs, facts)
Structure: tagged sections, stable order, key rules not buried
Isolate  : sub-agents with clean contexts; return summaries
Externalise: notes/plans/progress in files or a store
Memory: short-term | working (task state) | long-term (store + retrieval)
Memory rules: what's saved, who sees it, correction, forgetting, retention
Watch for: context rot, stale memory, conflicting instructions, PII persistence</pre>`,
  tips: ["Log the exact context each agent step received; most agent bugs are context bugs.", "A 10-line summary of a 5,000-token tool result often works better than the raw result.", "Give long-term memory a delete path from day one; customers will ask.", "Measure quality as conversations get long; context rot is gradual and silent."],
  scen: [{ t: "Context audit", d: "Log the full context your Project 6 agent sends on its 5th step of a long conversation. Mark every part as needed / not needed. Add compaction of old turns and trimming of tool results, then re-run your scenario tests and compare token use and pass rate." }],
  where: [["Anthropic engineering blog", "https://www.anthropic.com/engineering", "Context engineering and agent articles"], ["Letta docs", "https://docs.letta.com/", "Agents with long-term memory"], ["Mem0", "https://github.com/mem0ai/mem0", "Open-source memory layer"]] },

{ id: "bld-protocols", topic: "build", title: "Agent protocols and computer-use agents", mins: 50,
  body: `
<p>The 2026 agent stack has a <b>protocols</b> layer. MCP (covered earlier) connects agents to tools and data. Two more ideas come up in customer conversations:</p>
<p><b>Agent-to-agent (A2A) protocols</b> let agents built by different vendors discover each other and hand off tasks: for example, a customer's internal HR agent asking a vendor's payroll agent to check a payslip. Google's A2A protocol (now under the Linux Foundation) defines agent "cards" that describe capabilities, and task messages with status updates. IBM's ACP is a related effort. The FDE questions are practical: authentication between agents, what data may cross, audit trails, and who is accountable when a chain of agents gets something wrong.</p>
<p><b>Computer-use and browser agents</b> operate software through screenshots, clicks and typing, or by driving a browser (Playwright, Browser Use). They're how you automate legacy systems that have <i>no API</i>: old desktop apps, government portals, internal web tools.</p>
<ul><li>They're slower and less reliable than APIs, so prefer an API or file export whenever one exists.</li>
<li>Run them in isolated environments (VMs or containers) with only the access they need.</li>
<li>Require confirmation before submitting forms, sending messages or paying.</li>
<li>Websites can contain prompt injections, so treat page content as untrusted.</li>
<li>Record sessions for audit and debugging; build step-level evals (did it reach the right screen? fill the right field?).</li></ul>
<p><b>Headless browser automation</b> (Playwright scripts) is often the better middle ground: deterministic scripts for stable steps, with an LLM only for the fuzzy parts.</p>`,
  watch: [V("Google A2A protocol explained", "google agent2agent a2a protocol explained"), V("Computer use agents explained", "computer use ai agent explained"), V("Playwright tutorial Python", "playwright python tutorial")],
  cheat: `<pre>Protocols: MCP (agent <-> tools/data) | A2A (agent <-> agent) | ACP (similar)
A2A: agent card (capabilities, auth) + tasks with status/results
Ask: agent-to-agent auth? data allowed to cross? audit? accountability?
Computer-use/browser agents: for systems with NO API
  prefer API > file export > Playwright script > computer-use agent
  isolate in VM/container | least access | confirm submits/payments
  page content = untrusted (injection) | record sessions | step evals
Tools: Playwright, Browser Use, Claude computer use, OpenAI Operator-style agents</pre>`,
  tips: ["Use computer-use agents as a last resort for systems with no API; they're slow and fragile.", "Deterministic Playwright steps plus an LLM for the fuzzy parts beat a fully autonomous browser agent for most workflows.", "Every agent-to-agent hop needs its own authentication and audit log.", "Never let a browser agent enter payment details or submit forms without a human confirming."],
  scen: [{ t: "Legacy portal automation", d: "Pick a public web form (a demo site such as a practice test site). Automate it with a Playwright script, then replace one fuzzy step (e.g., choosing a category from free text) with an LLM call. Add a confirmation before submit and record the session." }],
  where: [["A2A protocol", "https://a2a-protocol.org/", "Specification and samples"], ["Playwright for Python", "https://playwright.dev/python/", "Browser automation"], ["Browser Use", "https://github.com/browser-use/browser-use", "Open-source browser agent"]] },

{ id: "sec-gov", topic: "sec", title: "AI governance and responsible AI", mins: 55,
  body: `
<p>Enterprises increasingly need AI programmes they can defend to regulators, auditors and the public. FDEs meet governance teams in almost every regulated deployment, and "AI governance specialist" is now a hiring category of its own.</p>
<p><b>Frameworks you'll hear about:</b></p>
<table class="ops"><tr><td><b>NIST AI RMF</b></td><td>US voluntary framework: Govern, Map, Measure, Manage AI risks across the lifecycle</td></tr>
<tr><td><b>ISO/IEC 42001</b></td><td>certifiable AI management system standard (like ISO 27001, but for AI)</td></tr>
<tr><td><b>EU AI Act</b></td><td>risk tiers: prohibited uses, high-risk obligations (risk management, data governance, documentation, human oversight, accuracy, logging), transparency duties</td></tr>

<p><b>What governance asks of a deployment:</b></p>

<li><b>Transparency</b>: telling people they're interacting with AI and explaining decisions where required.</li>

<p>Good governance speeds deployments up: a pilot that arrives with a system card, eval results and an oversight plan gets approved faster.</p>`,

{ id: "sec-redteam", topic: "sec", title: "AI red teaming", mins: 50,
  body: `
<p><b>Red teaming</b> means attacking your own AI system before real attackers or unlucky users do. 'AI red teamer' is a distinct job title in 2026, and enterprise customers increasingly expect red-team results before launch.</p>
<p><b>What to test:</b></p>
<ul><li><b>Prompt injection</b>, direct and indirect (documents, emails, web pages, tool outputs, MCP tool descriptions).</li>
<li><b>Data leakage</b>: other users' data, system prompts, secrets, retrieved documents outside the user's permissions.</li>
<li><b>Harmful or off-policy output</b>: advice the business must not give (legal, medical, financial), toxic content, brand-damaging replies.</li>
<li><b>Excessive agency</b>: tricking an agent into refunds, deletions, emails or purchases.</li>
<li><b>Jailbreaks</b>: role-play, encoding tricks, multi-turn manipulation, other languages (Hindi, Hinglish, transliteration).</li>
<li><b>Resource abuse</b>: prompts that trigger huge outputs, loops or cost spikes.</li></ul>
<p><b>How to run it:</b></p>
<ol><li>Threat-model the system: assets, attackers, entry points (reuse STRIDE plus the OWASP LLM list).</li>
<li>Write an attack set by category; include realistic user mistakes, not just clever attacks.</li>
<li>Automate what you can (promptfoo red-teaming, garak, PyRIT) and do manual creative testing.</li>
<li>Score each finding by severity and likelihood; fix; re-test; keep the attacks as regression tests.</li>
<li>Report clearly: what was tested, what was found, what was fixed, and residual risk.</li></ol>`,
  watch: [V("AI red teaming explained", "ai red teaming explained llm"), V("promptfoo red teaming tutorial", "promptfoo red team llm tutorial"), V("Microsoft PyRIT", "microsoft pyrit ai red teaming")],
  cheat: `<pre>Attack classes: injection (direct/indirect) | leakage | off-policy output
  | excessive agency | jailbreaks (role-play, encoding, multi-turn, other languages)
  | resource abuse (loops, giant outputs, cost)
Process: threat model > attack set by category > automate + manual
         > severity x likelihood > fix > re-test > keep as regression suite
Tools: promptfoo redteam, garak, PyRIT, Gandalf (practice)
Report: scope | method | findings (severity) | fixes | residual risk
Test in the users' languages (Hindi, Hinglish, transliteration)</pre>`,
  tips: ["Include ordinary user mistakes in the attack set; they cause more incidents than hackers.", "Test in every language users will actually use; many defences are English-only.", "Every finding becomes a permanent regression test.", "Report residual risk honestly; 'no issues found' is never the truth."],
  scen: [{ t: "Red-team report", d: "Run 40 attacks across the six classes against your Project 5 or 6 system (use promptfoo's red-team mode plus your own), including 10 in Hindi or Hinglish. Write a one-page report with severity, fixes and residual risk, and add the attacks to CI." }],

<p>Learning gets you ready; a deliberate search gets you hired. The GitHub FDE roadmap recommends treating the search like a pipeline you manage, not a lottery of applications.</p>
<p><b>1. Build a target list.</b> Around 30 companies across tiers: AI labs, AI application startups in domains you know (fintech, healthcare, legal, support), data platforms, and IT services firms building FDE or applied-AI practices. For each, note 2-3 role variants they hire (FDE, Applied AI Engineer, Solutions Engineer, Implementation Engineer, AI QA) and one person to contact.</p>
<p><b>2. Track a pipeline.</b> A simple sheet: company, role, contact, referral status, applied date, stage, next action, date. Review it weekly. Expect many "no reply"s; the pipeline smooths out luck.</p>
<p><b>3. Referrals beat cold applications.</b> Reach out to FDEs and engineers at target companies with something specific: a short note about their product plus a link to a relevant project demo. Ask for 15 minutes of advice, not a job. Contribute publicly (write-ups, small open-source fixes, LinkedIn posts about what you built) so people can find you.</p>
<p><b>4. Resume shape for FDE roles:</b> customer outcomes with numbers; end-to-end ownership; a "Deployments and operations" section (what you ran in production, monitoring, incidents); and repeatable patterns you created (templates, connectors, playbooks).</p>
<p><b>5. Compensation signals</b> from postings compiled in the roadmap: OpenAI FDE roughly $162K-$280K plus equity; Palantir FDSE about $135K-$200K; India aggregates around ₹10.5-16.7 lakh, with wide variation by company and seniority. Check current postings and levels data before negotiating.</p>
<p><b>6. Progression:</b> FDE → Senior FDE (owns multiple deployments) → Staff/Lead (sets patterns across customers, often specialises in a vertical) → Manager, or out to solutions architecture, product, or founding roles.</p>`,

// ---------- Python runner ----------
let shimmed=false;
function run(code,inputs,prelude){
  return new Promise(resolve=>{
    if(typeof Sk==="undefined"||!Sk.builtinFiles){resolve({out:"",err:"The Python engine couldn't load. Check your internet connection and refresh the page."});return;}
    if(!shimmed){Object.assign(Sk.builtinFiles.files,PY_SHIMS);shimmed=true;}
    const pre=prelude?prelude+"\n":"";const shift=prelude?prelude.split("\n").length:0;
    let out="",i=0;
    Sk.configure({output:t=>{out+=t;},read:f=>{if(Sk.builtinFiles.files[f]===undefined)throw "File not found: '"+f+"'";return Sk.builtinFiles.files[f];},
      __future__:Sk.python3,inputfunTakesPrompt:true,inputfun:()=>i<inputs.length?inputs[i++]:"",execLimit:6000});
    Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,pre+code,true))
      .then(()=>resolve({out}),e=>{let m=e.toString();if(shift)m=m.replace(/on line (\d+)/,(_,n)=>+n>shift?"on line "+(n-shift):"in the given code");resolve({out,err:m});});
  });
}
function norm(s){return s.replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+$/,"")).join("\n").replace(/\n+$/,"");}
async function grade(p,code){
  const res=[];
  if(p.type==="output"){
    for(const c of p.cases){const r=await run(code,c.inputs||[],p.prelude);
      res.push({ok:!r.err&&norm(r.out)===norm(c.expected),got:r.out,err:r.err,expected:c.expected,inputs:c.inputs||[]});}
  }else{
    for(const [expr,exp] of p.tests){const r=await run(code+'\n\nprint("@@R@@" + repr('+expr+'))',[],p.prelude);
      let got=null;const m=r.out.split("\n").filter(l=>l.startsWith("@@R@@"));if(m.length)got=m[m.length-1].slice(5);
      res.push({ok:!r.err&&got===exp,got,err:r.err,expected:exp,call:expr});}
  }
  return res;
}

// ---------- questions ----------
function shuffled(n,seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){h=Math.imul(h^(h>>>15),2246822507)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
// mode "learn": mastery on first try; mode "rev": spaced review of a mastered question
function qCardHTML(k,q,label,mode,src){
  const g=S.qlog[k]||{},n=g.n||0;
  const done=mode==="learn"&&S.qok[k];const lock=mode==="learn"?qLockLeft(k):0;
  const seed=k+"/"+n+(mode==="rev"?"/r"+((S.rev[k]||{}).step||1):"");
  const order=shuffled(q.o.length,seed);
  const head=`<span class="eyebrow">${esc(label)}</span>${src||""}<div class="qq">${esc(q.q)}</div>${q.code?`<pre>${esc(q.code)}</pre>`:""}`;
  if(lock>0)return `<div class="qcard" data-k="${k}">${head}<div class="qlock"><span>Resting after a miss. Back in <b data-until="${g.w+LOCK}" data-rerender="1">${mmss(lock)}</b>, with the options reshuffled. Carry on with other questions meanwhile.</span><details><summary>Re-read the explanation</summary><p style="margin:6px 0 0">${esc(q.why)}</p></details></div></div>`;
  return `<div class="qcard ${done?"ok":""}" data-k="${k}" data-mode="${mode}">${head}
    <div class="opts">${order.map((oi,pos)=>`<button type="button" class="opt ${done&&oi===q.a?"right":""}" data-oi="${oi}" ${done?"disabled":""}><span class="k">${"ABCD"[pos]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>
    ${done?`<div class="why"><b class="ok">Mastered.</b> ${esc(q.why)}</div>`:""}</div>`;
}
function bindQCards(root,getQ,after){
  root.querySelectorAll(".qcard[data-mode]").forEach(card=>{const k=card.dataset.k,mode=card.dataset.mode,q=getQ(k);
    card.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
      if(btn.disabled)return;const oi=+btn.dataset.oi;const right=oi===q.a;
      card.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.oi===q.a)b.classList.add("right");});
      if(!right)btn.classList.add("wrong");
      const now=Date.now();
      if(mode==="learn"){
        if(right){S.qok[k]=true;S.rev[k]={due:now+3*DAY,step:1};card.classList.add("ok");}
        else{const g=S.qlog[k]||{n:0};S.qlog[k]={n:(g.n||0)+1,w:now};}
      }else{
        const r=S.rev[k]||{step:1};
        if(right){if(r.step>=2)delete S.rev[k];else S.rev[k]={step:2,due:now+10*DAY};}
        else S.rev[k]={step:r.step,due:now+DAY};
      }
      markActive();save();
      const msg=right?(mode==="learn"?"Mastered on the first try.":"Still solid. Next review "+(S.rev[k]?"in 10 days.":"not needed.")):(mode==="learn"?"Not this time. It rests for 2 minutes, then returns reshuffled.":"Slipped. It comes back tomorrow.");
      card.insertAdjacentHTML("beforeend",`<div class="why"><b class="${right?"ok":"bad"}">${msg}</b> ${esc(q.why)}</div>`);
      meters();if(after)after(right);
    });});
}

function storeCode(){if(!bench||!$("#code"))return;const v=$("#code").value,id=prob().id;if(S.code[id]===v)return;S.code[id]=v;save("code");}
function loadCode(t){$("#code").value=t;syncGutter();}
function syncGutter(){const ta=$("#code"),n=ta.value.split("\n").length;$("#gutter").textContent=Array.from({length:n},(_,i)=>i+1).join("\n");$("#gutter").scrollTop=ta.scrollTop;}
function setupEditor(){
  const ta=$("#code");let t;
  ta.addEventListener("input",()=>{syncGutter();clearTimeout(t);t=setTimeout(storeCode,400);});
  ta.addEventListener("scroll",()=>{$("#gutter").scrollTop=ta.scrollTop;});
  ta.addEventListener("keydown",e=>{
    const v=ta.value,s=ta.selectionStart,en=ta.selectionEnd;
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();doRun();return;}
    if(e.key==="Tab"){e.preventDefault();const ls=v.lastIndexOf("\n",s-1)+1;
      if(e.shiftKey){const le=v.indexOf("\n",Math.max(en-1,s))===-1?v.length:v.indexOf("\n",Math.max(en-1,s));
        const out=v.slice(ls,le).split("\n").map(l=>l.replace(/^ {1,4}/,"")).join("\n");ta.value=v.slice(0,ls)+out+v.slice(le);ta.selectionStart=ls;ta.selectionEnd=ls+out.length;}
      else if(s!==en&&v.slice(s,en).includes("\n")){const le=v.indexOf("\n",en-1)===-1?v.length:v.indexOf("\n",en-1);
        const out=v.slice(ls,le).split("\n").map(l=>"    "+l).join("\n");ta.value=v.slice(0,ls)+out+v.slice(le);ta.selectionStart=ls;ta.selectionEnd=ls+out.length;}
      else ta.setRangeText("    ",s,en,"end");
      syncGutter();storeCode();return;}
    if(e.key==="Enter"&&!e.shiftKey){const ls=v.lastIndexOf("\n",s-1)+1;const line=v.slice(ls,s);
      let ind=(line.match(/^\s*/)||[""])[0];if(/:\s*(#.*)?$/.test(line))ind+="    ";e.preventDefault();ta.setRangeText("\n"+ind,s,en,"end");syncGutter();storeCode();}
    if(e.key==="Backspace"&&s===en){const ls=v.lastIndexOf("\n",s-1)+1;const before=v.slice(ls,s);
      if(before.length>0&&/^ +$/.test(before)&&before.length%4===0){e.preventDefault();ta.setRangeText("",s-4,s,"end");syncGutter();}}
  });
}
function showOutput(r){

async function doRun(){

async function doCheck(){
  const p=prob(),code=$("#code").value;storeCode();
  const b=$("#checkBtn");b.disabled=true;$("#results").innerHTML='<div class="kbd">Checking…</div>';
  const res=await grade(p,code);const all=res.every(x=>x.ok);
  const first=res.find(x=>x.err);if(first)showOutput({out:p.type==="output"?first.got||"":"",err:first.err});
  let h=`<div class="verdict ${all?"ok":""}">${all?"All "+res.length+" tests passed. Solved!":res.filter(x=>x.ok).length+" of "+res.length+" tests passed"}</div>`;
  h+=res.map(x=>{const label=p.type==="output"?(x.inputs.length?"Input: "+x.inputs.join(" ⏎ "):"Output"):x.call;
    if(x.ok)return `<div class="res ok"><div class="h"><span class="tag">PASS</span><span>${esc(label)}</span></div></div>`;
    const got=x.err?"Error: "+x.err:(p.type==="output"?(x.got||"(nothing printed)"):(x.got==null?"(nothing returned — did you use return?)":x.got));
    return `<div class="res bad"><div class="h"><span class="tag">FAIL</span><span>${esc(label)}</span></div><div><span class="eyebrow">Expected</span><pre>${esc(x.expected)}</pre></div><div><span class="eyebrow">Yours</span><pre>${esc(got)}</pre></div></div>`;}).join("");
  $("#results").innerHTML=h;b.disabled=false;
  if(all){
    if(!S.solved[p.id]){S.solved[p.id]=true;S.solvedOn[p.id]=today();markActive();save();}
    const lb=$$("#plist button")[bench.i];if(lb)lb.querySelector(".ck").textContent="✓";meters();
    if(p.why)$("#results").insertAdjacentHTML("beforeend",`<div class="helpbox"><b>Why this works:</b> ${esc(p.why)} <button type="button" class="btn" id="seeSol" style="padding:4px 10px;margin-left:6px">Compare with a model solution</button></div>`);
    if($("#seeSol"))$("#seeSol").onclick=showSolution;
    const nx=bench.ids.findIndex((id,i)=>i>bench.i&&!S.solved[id]);const n2=nx>=0?nx:bench.ids.findIndex(id=>!S.solved[id]);
    $("#results").insertAdjacentHTML("beforeend",`<div class="actions">${n2>=0?`<button class="btn primary" type="button" id="goNext">Next problem →</button>`:`<div class="helpbox"><b>Every problem in this set is solved.</b></div>`}</div>${nextStepsHTML()}`);bindNext();
    if($("#goNext"))$("#goNext").onclick=()=>{bench.i=n2;S.prob[bench.key]=n2;saveLocal();showProblem();$("#ptitle").scrollIntoView({block:"start"});};
  }else{S.fails[p.id]=(S.fails[p.id]||0)+1;save();}
}
function askSolution(){
  const p=prob();const tries=S.fails[p.id]||0;
  if(tries<2&&!S.solved[p.id]){
    $("#help").innerHTML=`<div class="helpbox confirm"><span>You've checked ${tries} time${tries===1?"":"s"}. Try the hint and two checks first; the struggle is what makes it stick. Still want it?</span><button class="btn" type="button" id="solYes">Show solution</button><button class="btn" type="button" id="solNo">Keep trying</button></div>`;
    $("#solYes").onclick=showSolution;$("#solNo").onclick=()=>{$("#help").innerHTML="";};
  }else showSolution();
}
function showSolution(){

}

    <details><summary>Keywords recruiters search</summary><div class="kw">${r.keys.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></details></article>`;};
  const list=sort==="fam"?fams.map(f=>`<section class="fam"><h3>${esc(f)}</h3><div class="roles">${ROLES.filter(r=>r.fam===f).map(card).join("")}</div></section>`).join("")
    :`<section class="fam"><div class="roles">${ROLES.slice().sort((a,b)=>rolePct(b)-rolePct(a)).map(card).join("")}</div></section>`;
  main.innerHTML=`<div class="intro"><div class="eyebrow">${ROLES.length} roles · 2026 market</div><h2>Roles, readiness and resume</h2><p>Every role this path can lead to. Each bar fills as you complete lessons (questions + builds) and project requirements, weighted by what that role cares about. The shaded part is the ceiling: how much of that role this course can cover. The rest needs real experience.</p></div>
  <div class="rtop"><section class="panel"><span class="eyebrow">Readiness self-check · average ${avg}/5</span><p class="muted" style="margin:0;font-size:14px">Rate yourself honestly once a week. 1 = never done it, 3 = done it with help, 5 = could teach it. The six dimensions come from the open FDE roadmap's readiness rubric.</p>
    <div class="rubric">${RUBRIC.map(x=>`<div class="row"><b>${esc(x.name)}</b><div class="dots5">${[1,2,3,4,5].map(v=>`<button type="button" data-rb="${x.k}" data-v="${v}" aria-pressed="${S.rubric[x.k]===v}">${v}</button>`).join("")}</div><small>${esc(x.hint)}</small></div>`).join("")}</div></section>

  $$("[data-rb]").forEach(b=>b.onclick=()=>{S.rubric[b.dataset.rb]=+b.dataset.v;save();renderRoles();});
  $$("[data-rs]").forEach(b=>b.onclick=()=>{S.rsort=b.dataset.rs;saveLocal();renderRoles();});

// ---------- code export, by practice day ----------
function codeByDay(){
  const dates=[...new Set(Object.values(S.solvedOn))].sort();
  const dayOf=Object.fromEntries(dates.map((d,i)=>[d,i+1]));
  const seen=new Set();const files=[];
  Object.keys(S.solved).filter(id=>S.solved[id]&&PROB[id]&&S.solvedOn[id]).forEach(id=>{
    const day=dayOf[S.solvedOn[id]];
    let slug=PROB[id].title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||id;
    let path="day"+String(day).padStart(2,"0")+"/"+slug+".py",p2=path,n=2;
    while(seen.has(p2)){p2=path.replace(/\.py$/,"-"+(n++)+".py");}
    seen.add(p2);
    files.push({path:p2,content:(S.code[id]!=null?S.code[id]:PROB[id].solution)||"# (no code saved)",date:S.solvedOn[id],title:PROB[id].title});
  });
  return files;
}
async function doExportZip(){
  const msg=$("#expMsg");
  if(typeof JSZip==="undefined"){msg.textContent="The zip library didn't load — check your connection and try again.";return;}
  const files=codeByDay();
  if(!files.length){msg.textContent="No solved problems with a date yet — solve a few first.";return;}
  msg.textContent="Zipping "+files.length+" files…";
  const zip=new JSZip();
  files.forEach(f=>zip.file(f.path,f.content));
  const byDay={};files.forEach(f=>{const d=f.path.split("/")[0];(byDay[d]=byDay[d]||[]).push(f);});
  const idx=Object.keys(byDay).sort().map(d=>`## ${d}\n`+byDay[d].map(f=>`- ${f.title} (${f.date}) — \`${f.path}\``).join("\n")).join("\n\n");
  zip.file("README.md",`# My solved coding problems, by day\n\nExported from FDE Path 45 on ${today()}.\n\nEach `+"`dayNN/`"+` folder is one day I solved at least one problem, in the order I actually worked — not calendar dates. ${files.length} files across ${Object.keys(byDay).length} days.\n\nCopy these folders straight into your repo and commit them — or copy one day at a time to build up real daily commit history.\n\n`+idx+"\n");
  const blob=await zip.generateAsync({type:"blob"});
  const stat=files.length+" files across "+Object.keys(byDay).length+" days.";
  let saved=false;
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      const dl=await window.claude.use("downloads");
      if(dl){const r=await dl.save({filename:"fde-code-by-day.zip",data:blob});saved=true;msg.textContent=(r.status==="saved"?"Saved: ":"Sent: ")+stat;}
    }
  }catch(e){ if(e&&e.code==="declined"){msg.textContent="Cancelled.";saved=true;} }
  if(!saved){
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="fde-code-by-day.zip";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    msg.textContent="Downloaded "+stat;
  }
}

  main.innerHTML=`<div class="intro"><div class="eyebrow">Settings</div><h2>Make it yours</h2><p>Appearance, pace and your data.</p></div>
  <div class="sets">
    <section class="set"><h3>Theme</h3>${seg("theme",[["system","System"],["light","Light"],["dark","Dark"]],p.theme)}</section>
    <section class="set"><h3>Reading font</h3><p>No font creates focus by itself, but a calm, very legible one removes friction during long sessions. Headings and code keep their own fonts.</p>
      <div class="fontdemo">${Object.entries(FONTS).map(([k,f])=>`<button type="button" data-set="font" data-v="${k}" aria-pressed="${p.font===k}" style="font-family:${esc(f[0])}"><b>${f[1]}</b><span>${esc(f[2])}</span></button>`).join("")}</div></section>

    <section class="set"><h3>Focus mode</h3><p>Hides the navigation, meters and footer, and narrows the reading column. Exit from the top bar. Pairs well with a Studio focus session.</p><div><button class="btn primary" type="button" id="fOn">Turn on focus mode</button></div></section>
    <section class="set"><h3>Sync</h3><p id="syncTxt">${syncHTML()}</p></section>
    <section class="set"><h3>Export my code, by day</h3><p>Downloads a .zip with one folder per day you solved at least one problem (day01, day02, …, in the order you actually worked — not calendar dates), each file named after the problem, with exactly the code you last saved for it. Made for pushing straight into your own GitHub repo as your daily commit history.</p>
      <div class="actions"><button class="btn primary" type="button" id="expZip">Download code-by-day .zip</button><span class="muted" id="expMsg" style="font-size:14px"></span></div></section>
    <section class="set"><h3>Backup</h3><p>Copy everything (progress, code, notes, journals) as text, or paste a backup to restore it.</p>
      <div class="actions"><button class="btn" type="button" id="exp">Show my backup</button><button class="btn" type="button" id="imp">Restore from pasted text</button></div>
      <textarea class="io" id="io" spellcheck="false" placeholder="Backup text appears here, or paste one to restore."></textarea><span class="muted" id="ioMsg" style="font-size:14px"></span></section>
    <section class="set"><h3>Reset</h3><p>Erase all progress, answers, code and notes${SYNC.db?", here and in your account":""}.</p><div id="resetArea"><button class="btn" type="button" id="resetBtn">Reset everything</button></div></section>
  </div>`;
  $$("[data-set]").forEach(b=>b.onclick=()=>{const k=b.dataset.set;let v=b.dataset.v;if(k==="pace")v=+v;S.prefs[k]=v;applyPrefs();save();renderSettings();});
  $("#startD").onchange=e=>{if(e.target.value){S.prefs.start=e.target.value;save();}};
  $("#fOn").onclick=()=>setFocus(true);
  $("#expZip").onclick=doExportZip;
  $("#exp").onclick=()=>{const o=Object.assign({},S);delete o.route;$("#io").value=JSON.stringify(o);$("#io").select();$("#ioMsg").textContent="Selected. Copy it (Ctrl/⌘+C) and keep it somewhere safe.";};
  $("#imp").onclick=()=>{try{const o=JSON.parse($("#io").value);if(!o||typeof o!=="object"||!o.qok)throw 0;S=Object.assign(blank(),o);S.prefs=Object.assign(blank().prefs,o.prefs||{});save("progress","code","studio");applyPrefs();$("#ioMsg").textContent="Restored.";render();}catch(e){$("#ioMsg").textContent="That doesn't look like a backup from this site.";}};
  $("#resetBtn").onclick=()=>{
    $("#resetArea").innerHTML=`<span>Erase everything? </span><button class="btn" id="rsYes" type="button">Yes, erase</button> <button class="btn" id="rsNo" type="button">Cancel</button>`;
    $("#rsYes").onclick=()=>{const keep=S.prefs;S=blank();S.prefs=keep;S.prefs.start=today();save("progress","code","studio");go({v:"home"});};
    $("#rsNo").onclick=()=>renderSettings();
  };
}

applyPrefs();
render();
initSync();
})();
