<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FDE Path 45</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&family=Lexend:wght@300..700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&display=swap">
<style>
/* Layout: field notebook. Home = today's strip + colour-coded topic cards; lesson = tabbed page;
   coding practice = problem list beside a Python workbench. */
:root{
  --bg:#EEF1EE; --paper:#FBFCFA; --ink:#17201C; --muted:#5B6862; --line:#D5DCD7; --grid:#E4EAE5;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --mark:#F5D547; --mark-ink:#2A2300;
  --ok:#17804A; --ok-bg:#E2F3E8; --bad:#B42318; --bad-bg:#FBE7E4; --warn-bg:#FFF4D6;
  --code-bg:#1B2420; --code-ink:#E6EEE9; --code-dim:#7D8C85;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  --r:10px; --tl:0.54; --tc:0.15; --tint:9%;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --paper:#18201C; --ink:#E4EBE6; --muted:#98A69F; --line:#2B3530; --grid:#1E2723;
  --accent:#7B9CFF; --accent-ink:#0B1230; --mark:#E9C933; --mark-ink:#241D00;
  --ok:#5CCB8C; --ok-bg:#15301F; --bad:#FF8A7A; --bad-bg:#3A1A16; --warn-bg:#352C10;
  --code-bg:#0C110E; --code-ink:#DDE7E1; --code-dim:#6C7A73; --tl:0.78; --tc:0.12; --tint:14%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --paper:#18201C; --ink:#E4EBE6; --muted:#98A69F; --line:#2B3530; --grid:#1E2723;
  --accent:#7B9CFF; --accent-ink:#0B1230; --mark:#E9C933; --mark-ink:#241D00;
  --ok:#5CCB8C; --ok-bg:#15301F; --bad:#FF8A7A; --bad-bg:#3A1A16; --warn-bg:#352C10;
  --code-bg:#0C110E; --code-ink:#DDE7E1; --code-dim:#6C7A73; --tl:0.78; --tc:0.12; --tint:14%; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--grid);padding:.08em .35em;border-radius:4px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 12px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tc{--c:oklch(var(--tl) var(--tc) var(--h));}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.chip{font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:4px;background:var(--grid);color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.chip.hi{background:var(--mark);color:var(--mark-ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));width:0;transition:width .4s}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;border:0;background:none;padding:0}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.01em}
.brand .p{font-family:var(--f-mono);color:var(--accent);font-weight:600}
nav.tabs{display:flex;flex-wrap:wrap;gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
nav.tabs button{border:0;background:transparent;color:var(--muted);padding:6px 13px;border-radius:999px;font-weight:700;font-size:14px}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.meters{display:flex;gap:14px;align-items:center;font-size:13px}
.meter{display:grid;gap:3px;min-width:92px}
.meter b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.streak{display:flex;align-items:center;gap:6px;background:var(--mark);color:var(--mark-ink);border-radius:8px;padding:5px 9px;font-weight:700;font-size:13px}
.streak span{font:800 18px/1 var(--f-display);font-variant-numeric:tabular-nums}

/* home */
.today{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px 28px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-block:24px 8px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 28px}
.today .num{font:800 clamp(64px,10vw,104px)/.8 var(--f-display);color:var(--accent);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.today h2{font-size:clamp(22px,2.6vw,30px);font-weight:800;margin:4px 0 10px}
.lchips{display:flex;flex-wrap:wrap;gap:8px}
.lchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700;text-align:left}
.lchip:hover{border-color:var(--c)}
.lchip i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.lchip.done{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--c)}
.today .side{display:grid;gap:10px;justify-items:start;min-width:200px}
.d5{display:flex;gap:4px}
.d5 i{width:22px;height:8px;border-radius:3px;background:var(--line)}
.d5 i.on{background:var(--ok)}
@media (max-width:860px){.today{grid-template-columns:minmax(0,1fr)}.today .num{font-size:64px}}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--muted);font-size:14px;padding-block:6px 0}
.stats b{color:var(--ink);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.group{padding-block:24px 4px}
.group h3{font-size:22px;font-weight:800;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:12px}
.group h3 small{font:400 15px var(--f-body);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
@media (min-width:1100px){.cards{grid-template-columns:repeat(var(--n),minmax(0,1fr))}}
.tcard{text-align:left;border:1px solid color-mix(in oklab,var(--c) 35%,var(--line));background:color-mix(in oklab,var(--c) var(--tint),var(--paper));border-radius:12px;padding:16px 16px 14px;display:grid;gap:8px;align-content:start;position:relative;overflow:hidden;min-height:168px}
.tcard::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.tcard:hover{border-color:var(--c);transform:translateY(-1px)}
.tcard h4{font-size:19px;font-weight:800;padding-left:4px}
.tcard p{margin:0;font-size:14px;color:var(--muted);padding-left:4px}
.tcard .foot{display:grid;gap:6px;margin-top:auto;padding-left:4px}
.tcard .foot span{font:600 12px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.tcard.done::after{content:"COMPLETE";position:absolute;top:12px;right:12px;font:700 10px var(--f-mono);letter-spacing:.06em;color:var(--c)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.tcard:hover{transform:none}}

/* topic page */
.thead{border-radius:14px;padding:24px;margin-block:24px 16px;background:color-mix(in oklab,var(--c) var(--tint),var(--paper));border:1px solid color-mix(in oklab,var(--c) 35%,var(--line));position:relative;overflow:hidden}
.thead::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:var(--c)}
.thead h2{font-size:clamp(28px,4vw,42px);font-weight:800;margin:6px 0}
.thead p{margin:0;color:var(--muted);max-width:65ch}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:14px}
.llist{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 16px}
.lrow:hover{border-color:var(--c)}
.lrow .n{font:800 22px/1 var(--f-display);color:var(--c);font-variant-numeric:tabular-nums;width:2ch}
.lrow .t{font-weight:700}
.lrow small{display:block;color:var(--muted);font-size:13px}
.pill{font:700 11px/1 var(--f-mono);padding:5px 8px;border-radius:999px;letter-spacing:.04em;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.part{background:var(--warn-bg);color:var(--ink)} .pill.no{background:var(--grid);color:var(--muted)}

/* lesson */
.lhead{display:grid;gap:8px;padding-block:22px 12px}
.lhead h2{font-size:clamp(26px,3.6vw,40px);font-weight:800;letter-spacing:-.015em}
.lhead .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ltabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.ltabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;font-size:15px}
.ltabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
.ltabs button .q{font:700 11px var(--f-mono);margin-left:6px;padding:2px 6px;border-radius:999px;background:var(--grid)}
.ltabs button .q.ok{background:var(--ok-bg);color:var(--ok)}
.prose{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px;max-width:860px}
.prose > *{max-width:68ch}
.prose p,.prose ul,.prose ol{margin:0 0 14px}
.prose h4{font-size:20px;margin:22px 0 8px;color:var(--c)}
.prose pre,.cheat pre,.qcard pre{font:14px/1.55 var(--f-mono);background:var(--code-bg);color:var(--code-ink);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:0 0 14px;max-width:100%}
.prose pre code{background:none;padding:0;color:inherit}
table.ops{border-collapse:collapse;margin:0 0 14px;font-size:15px;display:block;overflow-x:auto;max-width:100%}
table.ops td{border-bottom:1px solid var(--line);padding:6px 12px 6px 0;vertical-align:top}
table.ops td:first-child{white-space:nowrap}
.watch{margin-top:20px;border-top:1px dashed var(--line);padding-top:16px}
.watch ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px;max-width:none}
.watch a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--ink);padding:7px 9px;border-radius:6px;background:var(--bg)}
.watch a:hover{outline:1px solid var(--c)}
.watch .play{font:600 11px/1 var(--f-mono);color:var(--c);flex:none}
.cheat{max-width:860px;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);background:var(--paper);padding:18px}
.cheat pre{margin:10px 0 0;font-size:13.5px}
.tips{display:grid;gap:10px;max-width:860px;padding:0;margin:0;list-style:none}
.tips li{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 44px;position:relative}
.tips li::before{content:attr(data-n);position:absolute;left:14px;top:14px;width:20px;height:20px;border-radius:5px;background:var(--c);color:var(--paper);font:700 12px/20px var(--f-mono);text-align:center}
.scen{display:grid;gap:10px;max-width:860px}
.scard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px}
.scard h4{font-size:18px}
.scard p{margin:0}
.scard label{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;cursor:pointer}
.scard input{width:18px;height:18px;accent-color:var(--ok)}
.where{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;max-width:860px;margin-top:6px}
.where a{display:grid;gap:4px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.where a:hover{border-color:var(--c)}
.where a b{color:var(--c)}
.where a span{font-size:14px;color:var(--muted)}
.qwrap{display:grid;gap:12px;max-width:860px}
.qstatus{border-radius:var(--r);padding:12px 16px;background:var(--warn-bg);font-size:15px}
.qstatus.ok{background:var(--ok-bg)}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.qcard.ok{border-color:var(--ok)}
.qcard .qq{font-weight:700}
.qcard pre{margin:0}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-size:15px;display:flex;gap:10px;align-items:flex-start;white-space:pre-wrap}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt .k{font:700 12px/1.9 var(--f-mono);color:var(--muted);flex:none}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{border-radius:8px;padding:10px 12px;font-size:15px;background:var(--bg)}
.why b.ok{color:var(--ok)} .why b.bad{color:var(--bad)}
.lnav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:22px;max-width:860px}
.banner{border-radius:var(--r);padding:14px 16px;background:var(--ok-bg);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;max-width:860px;margin-bottom:14px}

/* practice + bench */
.pgrid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:20px;align-items:start}
@media (max-width:980px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.pside{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.pside select{font:inherit;font-size:15px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.plist{display:grid;gap:6px}
.plist button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:15px}
.plist button[aria-selected="true"]{border-color:var(--ink);background:var(--paper);box-shadow:inset 3px 0 0 var(--ink)}
.plist .ck{color:var(--ok);font-weight:700}
.lv{font:700 10px/1 var(--f-mono);letter-spacing:.06em;padding:4px 6px;border-radius:4px;min-width:56px;text-align:center;display:inline-block}
.lv1{background:var(--ok-bg);color:var(--ok)} .lv2{background:var(--warn-bg);color:var(--ink)} .lv3{background:var(--bad-bg);color:var(--bad)}
.bench{display:flex;flex-direction:column;gap:12px;min-width:0}
.ptitle{font-size:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;scroll-margin-top:90px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.prompt-text p{margin:0}
.prompt-text pre{font:14px/1.5 var(--f-mono);background:var(--bg);padding:8px 12px;border-radius:6px;margin:8px 0 0;overflow-x:auto}
.ptype{display:inline-block;font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--bg);color:var(--muted);margin-bottom:10px}
details.given{margin-top:10px}
details.given summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
details.given pre{font:13px/1.5 var(--f-mono);background:var(--code-bg);color:var(--code-ink);padding:10px 12px;border-radius:6px;overflow-x:auto;margin:8px 0 0}
.editor{display:flex;background:var(--code-bg);border-radius:var(--r);overflow:hidden;min-height:240px}
.gutter{font:14px/1.6 var(--f-mono);color:var(--code-dim);text-align:right;padding:12px 8px 12px 12px;user-select:none;white-space:pre;overflow:hidden;flex:none}
textarea#code{flex:1;min-width:0;border:0;outline:0;resize:vertical;background:transparent;color:var(--code-ink);font:14px/1.6 var(--f-mono);padding:12px 12px 12px 4px;min-height:240px;tab-size:4;white-space:pre;overflow:auto;caret-color:var(--mark)}
.editor:focus-within{box-shadow:0 0 0 3px var(--accent)}
.stdin{display:grid;gap:6px}
.stdin label{font-size:13px;color:var(--muted)}
textarea#stdin{font:14px/1.5 var(--f-mono);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 10px;min-height:44px;resize:vertical;width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .sp{flex:1}
.kbd{font:12px var(--f-mono);color:var(--muted)}
.console{font:14px/1.55 var(--f-mono);background:var(--code-bg);color:var(--code-ink);border-radius:var(--r);padding:12px 14px;min-height:60px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.console .err{color:#FF9B8E}
.console .dim{color:var(--code-dim)}
.helpbox{border-radius:8px;padding:10px 14px;background:var(--warn-bg);font-size:15px}
.results{display:grid;gap:8px}
.res{border-radius:8px;padding:10px 12px;font-size:14px;display:grid;gap:4px;min-width:0}
.res.ok{background:var(--ok-bg)} .res.bad{background:var(--bad-bg)}
.res .h{font-weight:700;display:flex;gap:8px;align-items:center;min-width:0}
.res .h span:last-child{overflow-wrap:anywhere}
.res .tag{font:700 11px/1 var(--f-mono);padding:3px 6px;border-radius:4px;color:var(--paper);flex:none}
.res.ok .tag{background:var(--ok)} .res.bad .tag{background:var(--bad)}
.res pre{font:13px/1.45 var(--f-mono);margin:0;white-space:pre-wrap;word-break:break-word}
.verdict{font:800 20px/1.2 var(--f-display)}
.verdict.ok{color:var(--ok)}
.solution pre{font:14px/1.55 var(--f-mono);background:var(--code-bg);color:var(--code-ink);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:8px 0 0}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* plan */
.phase{padding-block:22px 6px}
.phase h3{font-size:22px;font-weight:800}
.phase p{margin:4px 0 12px;color:var(--muted)}
.days{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.drow.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.drow.done .dn{color:var(--ok)}
.drow .dn{font:800 30px/1 var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.drow .dn small{display:block;font:600 10px var(--f-mono);letter-spacing:.06em}
.drow .right{display:grid;gap:6px;justify-items:end}
.proj-m{font:700 12px var(--f-mono);color:var(--accent)}
@media (max-width:700px){.drow{grid-template-columns:48px minmax(0,1fr)}.drow .right{grid-column:1 / -1;justify-items:start;display:flex;flex-wrap:wrap;gap:8px;align-items:center}}

/* projects + resources */
.pcards{display:grid;gap:14px;padding-block:22px}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:10px}
.pcard h3{font-size:24px;font-weight:800}
.pcard .top2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pcard p{margin:0;max-width:75ch}
.reqs{list-style:none;padding:0;margin:0;display:grid;gap:6px}

const PY_SHIMS = {
"src/lib/heapq.py": `def _up(h, pos):
    item = h[pos]
    while pos > 0:
        parent = (pos - 1) >> 1
        if item < h[parent]:
            h[pos] = h[parent]
            pos = parent
        else:
            break
    h[pos] = item

def _down(h, pos):
    n = len(h)
    item = h[pos]
    while True:
        child = 2 * pos + 1
        if child >= n:
            break
        if child + 1 < n and h[child + 1] < h[child]:
            child += 1
        if h[child] < item:
            h[pos] = h[child]
            pos = child
        else:
            break
    h[pos] = item

def heappush(h, item):
    h.append(item)
    _up(h, len(h) - 1)

def heappop(h):
    last = h.pop()
    if h:
        top = h[0]
        h[0] = last
        _down(h, 0)
        return top
    return last

def heapify(h):
    for i in range(len(h) // 2 - 1, -1, -1):
        _down(h, i)

def heappushpop(h, item):
    if h and h[0] < item:
        item, h[0] = h[0], item
        _down(h, 0)
    return item

def heapreplace(h, item):
    top = h[0]
    h[0] = item
    _down(h, 0)
    return top

def nsmallest(n, iterable, key=None):
    return sorted(iterable, key=key)[:n]

def nlargest(n, iterable, key=None):
    return sorted(iterable, key=key, reverse=True)[:n]
`,
"src/lib/functools.py": `def lru_cache(maxsize=128):
    def deco(fn):
        memo = {}
        def wrapper(*args):
            if args not in memo:
                memo[args] = fn(*args)
            return memo[args]
        wrapper.cache_clear = memo.clear
        return wrapper
    if callable(maxsize):
        return deco(maxsize)
    return deco

def cache(fn):
    return lru_cache(None)(fn)

def reduce(fn, seq, *init):
    it = iter(seq)
    acc = init[0] if init else next(it)
    for x in it:
        acc = fn(acc, x)
    return acc

def cmp_to_key(mycmp):
    class K(object):
        def __init__(self, obj):
            self.obj = obj
        def __lt__(self, other):
            return mycmp(self.obj, other.obj) < 0
        def __gt__(self, other):
            return mycmp(self.obj, other.obj) > 0
        def __eq__(self, other):
            return mycmp(self.obj, other.obj) == 0
        def __le__(self, other):
            return mycmp(self.obj, other.obj) <= 0
        def __ge__(self, other):

  lesson: `
<p>A program is a list of instructions the computer follows <b>top to bottom, one line at a time</b>. Python is a language that reads almost like English, which is why it's the best first language.</p>
<p>The first instruction everyone learns is <code>print()</code>. Whatever you put inside the brackets appears on the screen. Text must be inside quotes, so Python knows it's text and not a command.</p>
<pre>print("Hello, world!")
print("I am learning Python")
print(2 + 3)</pre>
<p>Line 3 has no quotes, so Python <i>calculates</i> it and prints <code>5</code>. With quotes, <code>print("2 + 3")</code> would print the text <code>2 + 3</code> exactly.</p>
<p><b>Rules to remember:</b> brackets must open and close, quotes must open and close, and capital letters matter (<code>Print</code> is not <code>print</code>).</p>
<p>Press <b>Run</b> (or Ctrl + Enter) to run your code. Mistakes are normal. Read the red error message; it tells you the line number.</p>`,

{

  lesson: `
<p>A <b>variable</b> is a labelled box that holds a value. You create one with <code>=</code>, which in Python means "store", not "equals".</p>
<pre>name = "Ravi"
age = 19
cgpa = 8.4
is_student = True</pre>
<p>These are the four basic <b>types</b>:</p>
<ul><li><code>str</code> (string): text, in quotes: <code>"Ravi"</code></li>
<li><code>int</code> (integer): whole numbers: <code>19</code></li>
<li><code>float</code>: numbers with a decimal point: <code>8.4</code></li>
<li><code>bool</code>: <code>True</code> or <code>False</code></li></ul>
<p>You can print a variable by its name (no quotes), and <code>print</code> can take several things separated by commas; it puts a space between them:</p>
<pre>print("My name is", name)

<p>Variables can change: <code>age = age + 1</code> reads the old value, adds 1, and stores it back. Names can't start with a digit or contain spaces; use <code>snake_case</code> like <code>total_marks</code>.</p>`,

<p>Most loop problems use one of a few patterns. Learn them and you can solve hundreds of problems.</p>
<p><b>1. Accumulator</b>: start at 0, add inside the loop.</p>
<pre>total = 0

<p><b>2. Counter</b>: count how many things match a condition.</p>
<pre>count = 0
for ch in "programming":

print(count)   # 3</pre>

<p><code>break</code> exits a loop immediately. <code>continue</code> skips the rest of this round and jumps to the next.</p>
<pre>for n in range(1, 20):
    if n % 7 == 0:
        print("First multiple of 7:", n)
        break

for n in range(1, 8):
    if n == 4:
        continue      # skip 4
    print(n, end=" ")   # 1 2 3 5 6 7</pre>
<p><b>Prime numbers</b> are the classic use of break: to test if n is prime, try dividing by 2, 3, 4 ... If anything divides evenly, it's not prime; stop looking.</p>
<p>You only need to check up to the square root of n (if n = a×b, one of them is ≤ √n), which makes the check much faster: <code>while d * d <= n</code>.</p>

{
  day: 19, week: 3, title: "Returning values", topic: "return",
  lesson: `
<p><code>print</code> shows something on screen. <code>return</code> <b>hands a value back</b> to whoever called the function, so they can store it, use it in maths, or pass it to another function.</p>
<pre>def square(n):
    return n * n

x = square(4)          # x is 16
print(square(3) + 1)   # 10</pre>
<p>A function that only prints can't be used in a calculation; <code>square(4) + 1</code> would fail if square just printed. That's why nearly all useful functions <b>return</b>.</p>
<p><code>return</code> also <b>ends</b> the function immediately, which is handy:</p>
<pre>def is_even(n):
    if n % 2 == 0:
        return True
    return False</pre>
<p>(Shorter: <code>return n % 2 == 0</code>.)</p>
<p><b>How checking works now:</b> the checker calls your function, e.g. <code>square(5)</code>, and compares what you <b>return</b> with the expected value. Don't use <code>input()</code> in these; the values arrive as parameters.</p>`,

<p>The single most useful dictionary pattern is <b>counting</b>: how many times does each thing appear?</p>

<p>A <b>list comprehension</b> says the same in one line:</p>
<pre>squares = [n * n for n in range(1, 6)]    # [1, 4, 9, 16, 25]</pre>
<p>Read it as "<i>n × n</i> for each <i>n</i> in the range". Add a filter with <code>if</code> at the end:</p>
<pre>evens = [n for n in range(20) if n % 2 == 0]

<p>Dictionary comprehensions exist too: <code>{w: len(w) for w in names}</code>.</p>
<p>Use comprehensions for simple transform/filter jobs. If it gets hard to read, a normal loop is better.</p>`,

  day: 26, week: 4, title: "Handling errors", topic: "try / except",
  lesson: `
<p>Programs meet bad data: a user types "abc" where a number was expected, a key is missing, someone divides by zero. Without handling, the program crashes. <code>try/except</code> lets you catch the error and respond:</p>
<pre>text = "abc"
try:
    n = int(text)
    print("Number:", n)
except ValueError:
    print("That's not a number")</pre>
<p>Common error types to recognise:</p>
<table class="ops"><tr><td><code>ValueError</code></td><td>right type, bad value: <code>int("abc")</code></td></tr>
<tr><td><code>ZeroDivisionError</code></td><td><code>5 / 0</code></td></tr>
<tr><td><code>KeyError</code></td><td>missing dictionary key</td></tr>
<tr><td><code>IndexError</code></td><td>list position that doesn't exist</td></tr>
<tr><td><code>TypeError</code></td><td>wrong type: <code>"a" + 1</code></td></tr>

<p>A <b>recursive</b> function solves a problem by calling itself on a <b>smaller</b> version of the same problem. It needs two parts:</p>
<ol><li><b>Base case</b>: the tiny version you can answer directly, which stops the recursion.</li>
<li><b>Recursive case</b>: shrink the problem and call yourself.</li></ol>
<pre>def factorial(n):
    if n <= 1:                     # base case
        return 1
    return n * factorial(n - 1)    # smaller problem</pre>
<p>Trace <code>factorial(4)</code>: 4 × factorial(3) → 4 × 3 × factorial(2) → 4 × 3 × 2 × factorial(1) → 4 × 3 × 2 × 1 = 24.</p>
<p>Without a base case the function calls itself forever and crashes. Recursion shows up in trees, folders inside folders, and many interview puzzles. Any recursion can also be written as a loop; pick whichever is clearer.</p>`,

<p>An <b>algorithm</b> is a step-by-step method. Two you'll meet in every DSA course:</p>
<p><b>Linear search</b>: check items one by one. Simple, works on anything, slow for big lists.</p>
<p><b>Binary search</b>: works only on a <b>sorted</b> list. Look at the middle; if the target is smaller, throw away the right half, else the left half. Repeat. A million items take only about 20 steps.</p>
<pre>def binary_search(nums, target):
    lo, hi = 0, len(nums) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if nums[mid] == target:
            return mid
        elif nums[mid] < target:
            lo = mid + 1
        else:
            hi = mid - 1
    return -1</pre>
<p><b>Bubble sort</b>: repeatedly swap neighbours that are in the wrong order. Slow, but it teaches how sorting works. In real code use <code>sorted()</code>, and <code>sorted(items, key=...)</code> to sort by something specific, like <code>key=len</code> or <code>key=lambda s: s[1]</code>.</p>`,

const LL_PRELUDE = `class ListNode:
    def __init__(self, val, next=None):
        self.val = val
        self.next = next

def build(values):          # [1, 2, 3] -> 1 -> 2 -> 3
    head = None
    for v in reversed(values):
        head = ListNode(v, head)
    return head

def to_list(head):          # 1 -> 2 -> 3 -> [1, 2, 3]
    out = []
    while head:
        out.append(head.val)
        head = head.next
    return out`;

const TREE_PRELUDE = `class TreeNode:
    def __init__(self, val, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def tree(values):           # level-order list, None = empty spot
    if not values:
        return None
    nodes = [None if v is None else TreeNode(v) for v in values]
    kids = nodes[::-1]
    root = kids.pop()
    for node in nodes:
        if node:
            if kids: node.left = kids.pop()
            if kids: node.right = kids.pop()
    return root`;

{ id: "dsa-bigo", title: "Big-O: how fast is your code?", mins: 40,
  body: `
<p>Two programs can give the same answer while one takes a second and the other takes an hour. <b>Big-O</b> describes how the work grows as the input grows. It ignores constants and asks: if the input doubles, what happens to the time?</p>
<table class="ops"><tr><td><b>O(1)</b></td><td>constant: same time for any size. <code>nums[5]</code>, <code>d["key"]</code>, <code>x in a_set</code></td></tr>
<tr><td><b>O(log n)</b></td><td>halves the problem each step. Binary search: a million items in ~20 steps</td></tr>
<tr><td><b>O(n)</b></td><td>one pass over the data. A single <code>for</code> loop</td></tr>
<tr><td><b>O(n log n)</b></td><td>good sorting: <code>sorted()</code>, merge sort</td></tr>
<tr><td><b>O(n²)</b></td><td>a loop inside a loop over the same data. Fine for 1,000 items, painful for 1,000,000</td></tr>
<tr><td><b>O(2ⁿ)</b></td><td>tries every subset. Only works for tiny inputs</td></tr></table>
<p><b>How to find it:</b> count the loops. One loop over n items is O(n). A loop inside a loop is O(n²). A loop that halves n each time is O(log n). Add steps that happen one after another and keep the biggest: O(n) + O(n²) is O(n²).</p>
<p><b>Hidden costs in Python:</b> <code>x in a_list</code> is O(n) (it scans), but <code>x in a_set</code> is O(1) on average. <code>lst.insert(0, x)</code> and <code>lst.pop(0)</code> are O(n) because everything shifts. Slicing <code>s[a:b]</code> copies, so it costs O(b − a).</p>
<p><b>Space complexity</b> is the same idea for memory: making a new list of n items is O(n) extra space.</p>
<p>The most common interview upgrade is replacing an O(n²) "compare every pair" with an O(n) pass that remembers what it has seen in a set or dict. You'll do that below.</p>`,

O(log n)  binary search, heap push/pop
O(n)      one loop, x in list, sum/max/min, copy

O(n^2)    nested loops over same data
O(2^n)    all subsets        O(n!) all orderings

Rules
- drop constants:  O(3n) -> O(n)
- keep the biggest: O(n + n^2) -> O(n^2)

{ id: "dsa-2ptr", title: "Two pointers", mins: 40,
  body: `
<p>Two pointers means keeping two index variables that move through the data, usually from both ends towards the middle, or both forward at different speeds. It often turns an O(n²) pair search into O(n).</p>
<p><b>Pattern 1: opposite ends</b> (works on sorted data or symmetric checks):</p>
<pre>def pair_with_sum(nums, target):   # nums is sorted
    i, j = 0, len(nums) - 1
    while i < j:
        s = nums[i] + nums[j]
        if s == target:
            return (i, j)
        if s < target:
            i += 1        # need a bigger sum
        else:
            j -= 1        # need a smaller sum
    return None</pre>
<p>Why it works: if the sum is too small, the smallest number can't be part of any answer with anything smaller than nums[j], so it's safe to drop it.</p>
<p><b>Pattern 2: slow and fast</b> (in-place rewriting). A <i>write</i> pointer marks where the next kept item goes, while a <i>read</i> pointer scans everything:</p>
<pre>def remove_dups(nums):     # sorted list, keep one of each
    w = 0
    for r in range(len(nums)):
        if r == 0 or nums[r] != nums[r - 1]:
            nums[w] = nums[r]
            w += 1
    return w               # count of unique items</pre>
<p><b>When to reach for it:</b> the input is sorted, you need a pair/triple, you're checking a palindrome, or you must modify a list in place without extra space.</p>`,
  watch: [["NeetCode · Two pointers", "neetcode two pointers pattern", "EN"], ["Take U Forward · Two pointer (Hindi)", "take u forward two pointer hindi", "HI"]],

i, j = 0, len(a) - 1          w = 0
while i < j:                  for r in range(len(a)):
    ...                           if keep(a[r]):
    i += 1 or j -= 1                  a[w] = a[r]; w += 1

Use when
- sorted input + pair/triplet sum
- palindrome / reverse in place
- remove / move items in place (O(1) space)

{ id: "dsa-hash", title: "Hashing: sets and dictionaries", mins: 40,
  body: `
<p>A set or dict finds an item in O(1) on average, no matter how large it is, by turning the key into a number (a <b>hash</b>) that says where to store it. That makes them the most useful tool in DSA.</p>
<p><b>The classic upgrade</b> is Two Sum. Brute force checks every pair: O(n²). With a dict, you remember every number you've seen and its index, and for each new number ask "have I already seen the partner I need?"</p>
<pre>def two_sum(nums, target):
    seen = {}                       # value -> index
    for i, x in enumerate(nums):
        need = target - x
        if need in seen:
            return (seen[need], i)
        seen[x] = i
    return None</pre>
<p><b>Common hashing patterns:</b></p>
<ul><li><b>Seen-before</b>: a set of items visited (duplicates, cycles).</li>
<li><b>Counting</b>: value → how many (anagrams, majority, top-k).</li>
<li><b>Index map</b>: value → position (two sum).</li>
<li><b>Grouping</b>: key → list of items (group anagrams).</li>
<li><b>Prefix sums + dict</b>: count subarrays that sum to k in O(n).</li></ul>
<p>Keys must be <b>immutable</b>: strings, numbers and tuples work; lists don't. To use a list as a key, convert it: <code>tuple(sorted(word))</code>.</p>
<p><code>collections.Counter</code> does counting in one line: <code>Counter("banana")</code> → <code>{'a': 3, 'n': 2, 'b': 1}</code>.</p>`,

{ id: "dsa-window", title: "Sliding window", mins: 40,
  body: `
<p>A <b>sliding window</b> is a range <code>[left, right]</code> over a list or string that moves forward. Instead of recomputing each range from scratch (O(n·k)), you add the item entering on the right and remove the item leaving on the left: O(n).</p>
<p><b>Fixed-size window</b> (size k):</p>
<pre>def max_sum_k(nums, k):
    window = sum(nums[:k])
    best = window
    for right in range(k, len(nums)):
        window += nums[right] - nums[right - k]
        best = max(best, window)
    return best</pre>
<p><b>Variable-size window</b>: grow right every step; shrink left while the window breaks a rule.</p>
<pre>def longest_unique(s):
    seen = set()
    left = best = 0
    for right, ch in enumerate(s):
        while ch in seen:          # window broke the rule
            seen.remove(s[left])
            left += 1
        seen.add(ch)
        best = max(best, right - left + 1)
    return best</pre>
<p>It's still O(n): each index enters the window once and leaves at most once.</p>
<p><b>Spot it by the wording:</b> "contiguous subarray / substring", "longest", "shortest", "at most k", "window of size k".</p>`,

{ id: "dsa-stack", title: "Stacks and queues", mins: 40,
  body: `
<p>A <b>stack</b> is last-in, first-out (LIFO), like a pile of plates. In Python, a list is a stack: <code>append()</code> pushes, <code>pop()</code> removes the top, <code>stack[-1]</code> peeks. All O(1).</p>
<p>A <b>queue</b> is first-in, first-out (FIFO), like a line at a ticket counter. Use <code>collections.deque</code>: <code>append()</code> adds at the back, <code>popleft()</code> removes from the front, both O(1). (A list's <code>pop(0)</code> is O(n).)</p>
<p><b>Stacks solve "matching" and "most recent" problems:</b></p>
<ul><li>Balanced brackets: push openers, pop on closers and check they match.</li>
<li>Undo history, browser back button, function calls (the call stack).</li>
<li>Evaluating expressions (Reverse Polish Notation).</li></ul>
<p><b>Monotonic stack</b>: keep the stack in increasing or decreasing order to answer "next greater element" questions in O(n):</p>
<pre>def next_greater(nums):
    ans = [-1] * len(nums)
    stack = []                 # indexes still waiting for an answer
    for i, x in enumerate(nums):
        while stack and nums[stack[-1]] < x:
            ans[stack.pop()] = x
        stack.append(i)
    return ans</pre>
<p><b>Queues</b> power breadth-first search (graphs, day 11 of DSA), task schedulers and buffering.</p>`,

{ id: "dsa-recursion", title: "Recursion and backtracking", mins: 45,
  body: `
<p>You met recursion in the Python track: a function that solves a smaller copy of the problem and has a base case. <b>Backtracking</b> is recursion that builds a solution step by step, and <i>undoes</i> each choice after exploring it, so it can try the next option.</p>
<pre>def permutations(items):
    result = []
    def build(path, remaining):
        if not remaining:              # base case: a full arrangement
            result.append(path[:])     # copy!
            return
        for i in range(len(remaining)):
            path.append(remaining[i])                     # choose
            build(path, remaining[:i] + remaining[i+1:])  # explore
            path.pop()                                    # un-choose
    build([], items)
    return result</pre>
<p>Every backtracking solution has the same shape: <b>choose → explore → un-choose</b>. The picture to keep in your head is a decision tree: each level is one choice, each leaf is a complete candidate.</p>
<p><b>Pruning</b> makes it fast: stop exploring a branch the moment it can't lead to a valid answer (for example, the running total already exceeds the target).</p>
<p>Classic backtracking problems: permutations, subsets, combination sum, generating valid parentheses, N-Queens, Sudoku, word search.</p>
<p><b>Cost:</b> usually exponential (2ⁿ subsets, n! permutations), so inputs are small (n ≤ ~10–20).</p>`,
  watch: [["NeetCode · Backtracking", "neetcode backtracking subsets permutations", "EN"], ["Apna College · Recursion & backtracking (Hindi)", "apna college backtracking hindi", "HI"]],
  cheat: `<pre>def backtrack(path, choices):
    if done(path):
        result.append(path[:])   # copy, not path itself
        return
    for c in choices:
        if not valid(c): continue   # prune
        path.append(c)              # choose
        backtrack(path, next_choices)
        path.pop()                  # un-choose

Subsets:      at each item: take it or skip it   -> 2^n
Permutations: pick any unused item next          -> n!
Combination sum: pass start index to avoid duplicates</pre>`,
  tips: ["Append path[:] (a copy). Appending path itself stores a reference that later gets emptied.", "Pass a start index to avoid producing the same combination in different orders.", "Draw the decision tree for a 3-item input before coding.", "If the same subproblem repeats, backtracking may really be a dynamic programming problem."],
  qs: [
    { q: "What does this print?", code: "def f(n):\n    if n == 0:\n        return []\n    return f(n - 1) + [n]\nprint(f(3))", o: ["[1, 2, 3]", "[3, 2, 1]", "[0, 1, 2, 3]", "[]"], a: 0, out: true, why: "f(3) = f(2) + [3] = (f(1) + [2]) + [3] = [1] + [2] + [3]. The deepest call finishes first." },

  ],

{ id: "dsa-sort", title: "Sorting", mins: 45,
  body: `
<p>In real code you use <code>sorted()</code> (O(n log n), stable). In interviews you're expected to know <i>how</i> sorting works and to use sorting as a first step.</p>
<p><b>Insertion sort</b> (O(n²)): take each item and slide it left into its place. Fast for small or nearly-sorted data.</p>
<p><b>Merge sort</b> (O(n log n)): split in half, sort each half recursively, then merge two sorted lists (the two-pointer merge you already wrote).</p>
<pre>def merge_sort(a):
    if len(a) <= 1:
        return a
    mid = len(a) // 2
    left, right = merge_sort(a[:mid]), merge_sort(a[mid:])
    out, i, j = [], 0, 0
    while i < len(left) and j < len(right):
        if left[i] <= right[j]:
            out.append(left[i]); i += 1
        else:
            out.append(right[j]); j += 1
    return out + left[i:] + right[j:]</pre>
<p><b>Quick sort</b> (O(n log n) on average, O(n²) worst): pick a pivot, put smaller items left and bigger right, recurse.</p>
<p><b>Stable</b> means equal items keep their original order. Python's sort is stable, so you can sort by a secondary key first, then the primary key.</p>
<p><b>Sorting with keys</b> is the everyday skill: <code>sorted(people, key=lambda p: (-p["score"], p["name"]))</code> sorts by score high-to-low, then name A-to-Z.</p>
<p><b>Sort first, then solve</b>: merging intervals, finding duplicates, meeting-room scheduling, and 3Sum all get easier on sorted data.</p>`,

{ id: "dsa-bsearch", title: "Binary search", mins: 40,
  body: `
<p>Binary search finds an item in a <b>sorted</b> list by checking the middle and throwing away half each time: O(log n).</p>
<pre>def binary_search(a, target):
    lo, hi = 0, len(a) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if a[mid] == target:
            return mid
        if a[mid] < target:
            lo = mid + 1
        else:
            hi = mid - 1
    return -1</pre>
<p>The real skill is <b>binary search on the answer</b>: whenever a yes/no question flips once (all "no" then all "yes"), you can binary search for the flip point. Examples:</p>
<ul><li>First position of x in a sorted list with duplicates.</li>
<li>Integer square root: largest k with k × k ≤ n.</li>
<li>Minimum capacity to ship packages in D days.</li>
<li>First bad version of a product.</li></ul>
<pre>def first_true(lo, hi, ok):   # ok(x) is False...False True...True
    while lo < hi:
        mid = (lo + hi) // 2
        if ok(mid):
            hi = mid          # mid might be the answer, keep it
        else:
            lo = mid + 1
    return lo</pre>
<p><b>Rotated sorted arrays</b> (like [4, 5, 6, 1, 2, 3]): at least one half around mid is always sorted; check whether the target lies in that half.</p>`,

First true:   lo, hi = low, high; while lo < hi:
                  if ok(mid): hi = mid
                  else:       lo = mid + 1
Answer space: search over possible answers, not indexes
Rotated:      if a[lo] <= a[mid]: left half sorted
              else:               right half sorted
Python:       import bisect
              bisect.bisect_left(a, x)  first index >= x
              bisect.bisect_right(a, x) first index > x</pre>`,

{ id: "dsa-linked", title: "Linked lists", mins: 45,
  body: `
<p>A <b>linked list</b> is a chain of nodes, where each node holds a value and a pointer to the next node. Unlike a Python list, there's no index: to reach the 5th node you walk from the head.</p>
<pre>class ListNode:
    def __init__(self, val, next=None):
        self.val = val
        self.next = next

head = ListNode(1, ListNode(2, ListNode(3)))   # 1 -> 2 -> 3</pre>
<p>Why learn them? Interviewers love them because they test careful pointer handling, and the same ideas appear in trees and graphs.</p>
<p><b>Core techniques:</b></p>
<ul><li><b>Walk</b>: <code>node = head; while node: ...; node = node.next</code></li>
<li><b>Reverse</b> with three pointers: prev, current, next.</li>
<li><b>Fast and slow pointers</b>: slow moves 1 step, fast moves 2. When fast reaches the end, slow is at the middle. If there's a cycle, they eventually meet.</li>
<li><b>Dummy head</b>: create a fake first node so you never special-case an empty result.</li></ul>
<pre>def reverse(head):
    prev = None
    cur = head
    while cur:
        nxt = cur.next     # save the rest
        cur.next = prev    # flip the arrow
        prev = cur         # move both forward
        cur = nxt
    return prev</pre>
<p>In these problems, <code>build([1, 2, 3])</code> creates a list and <code>to_list(head)</code> turns it back into a Python list, so you can test easily. Both are given.</p>`,
  watch: [["NeetCode · Linked list problems", "neetcode linked list", "EN"], ["Apna College · Linked list (Hindi)", "apna college linked list hindi", "HI"]],
  cheat: `<pre>Walk:     node = head
          while node: ...; node = node.next
Reverse:  prev, cur = None, head
          while cur: nxt = cur.next; cur.next = prev; prev, cur = cur, nxt
          return prev
Middle:   slow = fast = head
          while fast and fast.next: slow = slow.next; fast = fast.next.next
Cycle:    same loop; if slow is fast: cycle
Dummy:    dummy = tail = ListNode(0) ... return dummy.next
Nth from end: move fast n steps first, then move both</pre>`,
  tips: ["Before changing node.next, save what it pointed to, or you lose the rest of the list.", "Draw boxes and arrows. Update the arrows one at a time on paper.", "Check `while fast and fast.next`, in that order, to avoid AttributeError on None.", "A dummy head removes almost every 'what if the list is empty' special case."],
  qs: [
    { q: "What does this print?", code: "class N:\n    def __init__(self, v, nxt=None):\n        self.v = v\n        self.nxt = nxt\nhead = N(1, N(2, N(3)))\nnode = head\ntotal = 0\nwhile node:\n    total += node.v\n    node = node.nxt\nprint(total)", o: ["6", "3", "1", "Error"], a: 0, out: true, why: "The loop walks 1 → 2 → 3 → None, adding each value." },
    { q: "In the reverse function, what goes wrong if you write `cur.next = prev` BEFORE saving `nxt = cur.next`?", o: ["Nothing", "You lose the link to the rest of the list", "The list reverses twice", "Python raises a SyntaxError"], a: 1, why: "cur.next was the only reference to the remaining nodes. Overwrite it first and they're unreachable." },
    { q: "With fast moving 2 steps and slow moving 1, where is slow when fast reaches the end of a 5-node list?", o: ["Node 2", "Node 3 (the middle)", "Node 4", "Node 5"], a: 1, why: "fast covers twice the distance, so when it has covered the whole list, slow has covered half." },
    { q: "What is the time to access the 1000th node of a linked list?", o: ["O(1)", "O(log n)", "O(n)", "O(n²)"], a: 2, why: "There's no index; you must follow 999 next pointers from the head. Python lists give O(1) indexing instead." },
  ],
  probs: ["dq-llrev", "dq-llmid", "dq-llcycle", "dq-llmerge", "dq-llnth"] },

{ id: "dsa-trees", title: "Trees", mins: 50,
  body: `
<p>A <b>tree</b> is like a linked list where each node can point to several children. A <b>binary tree</b> has at most two: left and right. The top node is the <b>root</b>; nodes without children are <b>leaves</b>.</p>
<p>Trees are everywhere: folders on your computer, HTML pages, org charts, JSON documents, and the indexes inside databases.</p>
<p><b>Recursion is the natural tool</b>, because each child is itself the root of a smaller tree:</p>
<pre>def max_depth(root):
    if root is None:
        return 0
    return 1 + max(max_depth(root.left), max_depth(root.right))</pre>
<p><b>Traversals</b> (orders to visit every node):</p>
<ul><li><b>Inorder</b> (left, node, right): on a binary search tree this gives sorted order.</li>
<li><b>Preorder</b> (node, left, right): copying or serialising a tree.</li>
<li><b>Postorder</b> (left, right, node): deleting, or computing sizes bottom-up.</li>
<li><b>Level order</b> (BFS, row by row): uses a queue.</li></ul>
<p>A <b>binary search tree (BST)</b> keeps every left-subtree value smaller and every right-subtree value bigger than the node. Search, insert and delete are O(log n) when the tree is balanced.</p>
<p>In these problems <code>tree([3, 9, 20, None, None, 15, 7])</code> builds a tree from a level-order list (None = no node there). It's given.</p>`,
  watch: [["NeetCode · Trees", "neetcode binary tree problems", "EN"], ["Take U Forward · Binary trees (Hindi)", "take u forward binary tree hindi", "HI"]],
  cheat: `<pre>def solve(node):
    if node is None: return BASE
    L = solve(node.left); R = solve(node.right)
    return combine(node.val, L, R)

Inorder   L, N, R   -> sorted order on a BST
Preorder  N, L, R
Postorder L, R, N
Level order:
    q = deque([root])
    while q:
        level = [q.popleft() for _ in range(len(q))]
        for n in level: add n.left / n.right if present

BST valid: pass (low, high) limits down the recursion</pre>`,
  tips: ["Almost every tree problem is: handle None, recurse left, recurse right, combine.", "To validate a BST, compare each node against limits from ALL its ancestors, not just its parent.", "For level order, capture len(q) at the start of each level so you know where the level ends.", "Depth of a balanced tree with n nodes is about log₂ n; a skewed tree can be n deep."],
  qs: [
    { q: "For this tree, what is the inorder traversal?", code: "#       4\n#      / \\\n#     2   6\n#    / \\\n#   1   3", o: ["[1, 2, 3, 4, 6]", "[4, 2, 1, 3, 6]", "[1, 3, 2, 6, 4]", "[4, 2, 6, 1, 3]"], a: 0, why: "Inorder visits left subtree, then node, then right. On a BST that's sorted order." },
    { q: "What does max_depth return for a tree that is a single node?", o: ["0", "1", "2", "None"], a: 1, why: "The root itself counts: 1 + max(depth(None), depth(None)) = 1 + 0 = 1." },
    { q: "This tree has 2 as a left child of 5, and 7 as a right child of 2. Is it a valid BST?", code: "#     5\n#    /\n#   2\n#    \\\n#     7", o: ["Yes, every child is on the correct side of its parent", "No, 7 is in 5's left subtree but bigger than 5", "Yes, BSTs only compare parent and child", "No, a BST must have two children everywhere"], a: 1, why: "Everything in 5's left subtree must be less than 5. Checking only parent vs child misses this, which is why you pass limits down." },
    { q: "Which data structure does level-order (breadth-first) traversal use?", o: ["A stack", "A queue", "A heap", "A set"], a: 1, why: "Nodes are visited in the order they were discovered: first in, first out." },
  ],
  probs: ["dq-depth", "dq-inorder", "dq-levels", "dq-validbst", "dq-pathsum"] },

{ id: "dsa-graphs", title: "Graphs: BFS and DFS", mins: 50,
  body: `
<p>A <b>graph</b> is a set of nodes connected by edges, with no fixed root. Cities and roads, people and friendships, services and API calls, tasks and dependencies: all graphs.</p>
<p>In Python, store a graph as an <b>adjacency list</b>: a dict from each node to a list of its neighbours.</p>
<pre>graph = {"A": ["B", "C"], "B": ["D"], "C": ["D"], "D": []}</pre>
<p><b>DFS</b> (depth-first search) goes as deep as possible before backing up. Use recursion or a stack. Good for "is there a path?", counting connected pieces, and detecting cycles.</p>
<p><b>BFS</b> (breadth-first search) explores in rings: all neighbours first, then their neighbours. Use a queue. On unweighted graphs, BFS finds the <b>shortest path</b>.</p>
<pre>from collections import deque
def shortest(graph, start, goal):
    q = deque([(start, 0)])
    seen = {start}
    while q:
        node, dist = q.popleft()
        if node == goal:
            return dist
        for nb in graph[node]:
            if nb not in seen:
                seen.add(nb)
                q.append((nb, dist + 1))
    return -1</pre>
<p>Always keep a <b>seen</b> set, or cycles make you loop forever.</p>
<p><b>Grids are graphs too</b>: each cell's neighbours are up, down, left, right. "Number of islands" is DFS on a grid.</p>
<p><b>Topological sort</b> orders tasks so every task comes after its prerequisites (course schedules, build systems, data pipelines). If no such order exists, there's a cycle.</p>`,
  watch: [["NeetCode · Graphs", "neetcode graph problems bfs dfs", "EN"], ["William Fiset · Graph theory", "william fiset graph theory algorithms", "EN"], ["Take U Forward · Graph series (Hindi)", "take u forward graph series hindi", "HI"]],
  cheat: `<pre>graph = {node: [neighbours]}
DFS (recursive):
    def dfs(n):
        seen.add(n)
        for nb in graph[n]:
            if nb not in seen: dfs(nb)
BFS (shortest path, unweighted): deque + seen + (node, dist)
Grid neighbours: for dr, dc in ((1,0),(-1,0),(0,1),(0,-1))
    check 0 <= r+dr < rows and 0 <= c+dc < cols
Topological sort (Kahn):
    indegree counts; queue all 0-indegree nodes;
    pop, append to order, decrement neighbours' indegree
    len(order) < n  ->  cycle</pre>`,
  tips: ["Mark a node as seen when you ADD it to the queue, not when you pop it, or it can be queued many times.", "BFS = shortest path in unweighted graphs. Weighted graphs need Dijkstra (a heap).", "For grids, write a small in_bounds(r, c) helper; most bugs are off-by-one at the edges.", "Count connected components: loop over all nodes, start a DFS from each unseen one, and count how many times you start."],
  qs: [
    { q: "What does this print?", code: "graph = {1: [2, 3], 2: [4], 3: [4], 4: []}\nseen = []\ndef dfs(n):\n    seen.append(n)\n    for nb in graph[n]:\n        if nb not in seen:\n            dfs(nb)\ndfs(1)\nprint(seen)", o: ["[1, 2, 4, 3]", "[1, 2, 3, 4]", "[1, 3, 4, 2]", "[4, 2, 3, 1]"], a: 0, out: true, why: "DFS goes deep first: 1 → 2 → 4, then backs up to 1 and visits 3. 4 is already seen." },
    { q: "What does this print?", code: "from collections import deque\ngraph = {1: [2, 3], 2: [4], 3: [4], 4: []}\nq = deque([1])\nseen = {1}\norder = []\nwhile q:\n    n = q.popleft()\n    order.append(n)\n    for nb in graph[n]:\n        if nb not in seen:\n            seen.add(nb)\n            q.append(nb)\nprint(order)", o: ["[1, 2, 3, 4]", "[1, 2, 4, 3]", "[1, 3, 2, 4]", "[4, 3, 2, 1]"], a: 0, out: true, why: "BFS visits in rings: 1, then its neighbours 2 and 3, then 4." },
    { q: "Which search finds the fewest-edges path in an unweighted graph?", o: ["DFS", "BFS", "Both always", "Neither"], a: 1, why: "BFS reaches every node at distance 1 before any at distance 2, so the first time it reaches the goal is via a shortest path." },
    { q: "Tasks: A needs B, B needs C, C needs A. What does topological sort tell you?", o: ["Order is C, B, A", "There's a cycle, so no valid order exists", "Order is A, B, C", "Any order works"], a: 1, why: "Each task waits on another in a loop, so none can start. Kahn's algorithm ends with fewer nodes than exist, signalling a cycle." },
  ],
  probs: ["dq-islands", "dq-bfsdist", "dq-haspath", "dq-canfinish", "dq-components"] },

{ id: "dsa-dp", title: "Dynamic programming", mins: 60,
  body: `
<p><b>Dynamic programming (DP)</b> is recursion that remembers. When a problem breaks into smaller subproblems that <i>repeat</i>, you solve each once and store it.</p>
<p>Naive Fibonacci recomputes fib(30) over a million times. Store results and it's 30 calculations:</p>
<pre>def fib(n, memo={}):          # top-down (memoisation)
    if n < 2:
        return n
    if n not in memo:
        memo[n] = fib(n - 1) + fib(n - 2)
    return memo[n]

def fib_table(n):             # bottom-up (tabulation)
    dp = [0, 1] + [0] * (n - 1)
    for i in range(2, n + 1):
        dp[i] = dp[i - 1] + dp[i - 2]
    return dp[n]</pre>
<p><b>The four-step recipe:</b></p>
<ol><li><b>State</b>: what does dp[i] mean, in words? ("fewest coins to make amount i")</li>
<li><b>Transition</b>: how is dp[i] built from smaller states? (dp[i] = 1 + min(dp[i − coin]))</li>
<li><b>Base case</b>: the smallest answers you know directly. (dp[0] = 0)</li>
<li><b>Answer</b>: which cell holds the final result? (dp[amount])</li></ol>
<p><b>Common families:</b> 1-D (stairs, house robber, coin change), 2-D grids (unique paths), two strings (longest common subsequence, edit distance), knapsack (choose items under a capacity).</p>
<p>Spot DP by the words "number of ways", "minimum/maximum", "can you reach", combined with choices at each step.</p>`,
  watch: [["freeCodeCamp · Dynamic programming for beginners", "freecodecamp dynamic programming learn to solve algorithmic problems", "EN"], ["NeetCode · 1-D dynamic programming", "neetcode dynamic programming", "EN"], ["Aditya Verma · DP playlist (Hindi)", "aditya verma dynamic programming playlist", "HI"]],
  cheat: `<pre>1. state      dp[i] = answer for the first i items / amount i
2. transition dp[i] = f(dp[i-1], dp[i-2], ...)
3. base       dp[0], dp[1]
4. answer     dp[n]

Climb stairs  dp[i] = dp[i-1] + dp[i-2]
House robber  dp[i] = max(dp[i-1], dp[i-2] + a[i])
Coin change   dp[x] = min(dp[x - c] + 1 for c in coins)
LIS           dp[i] = 1 + max(dp[j] for j < i if a[j] < a[i])
LCS           dp[i][j] = dp[i-1][j-1] + 1 if same
                         else max(dp[i-1][j], dp[i][j-1])
0/1 knapsack  dp[w] = max(dp[w], dp[w - wt] + val), w descending</pre>`,
  tips: ["Write the recursive brute force first, then add a memo dict. That's already DP.", "Say what dp[i] means in a full sentence before writing any code.", "Use float('inf') as 'impossible' for minimum problems, then convert to -1 at the end.", "In 0/1 knapsack with a 1-D array, loop capacity from high to low so each item is used once."],
  qs: [
    { q: "What does this print?", code: "dp = [0] * 6\ndp[0] = dp[1] = 1\nfor i in range(2, 6):\n    dp[i] = dp[i - 1] + dp[i - 2]\nprint(dp)", o: ["[1, 1, 2, 3, 5, 8]", "[0, 1, 1, 2, 3, 5]", "[1, 1, 2, 4, 8, 16]", "[1, 2, 3, 4, 5, 6]"], a: 0, out: true, why: "Each cell is the sum of the two before it: this is 'ways to climb stairs taking 1 or 2 steps'." },
    { q: "What does this print?", code: "calls = 0\ndef fib(n):\n    global calls\n    calls += 1\n    if n < 2:\n        return n\n    return fib(n - 1) + fib(n - 2)\nfib(10)\nprint(calls)", o: ["177", "10", "11", "55"], a: 0, out: true, why: "Without memoisation, fib(10) makes 177 calls because the same subproblems are recomputed. With a memo it's 11." },
    { q: "In coin change, what does dp[7] mean if dp[x] = 'fewest coins to make amount x'?", o: ["The 7th coin", "The fewest coins that add up to exactly 7", "7 coins", "Ways to make 7"], a: 1, why: "Defining the state in words is step one. Here dp[7] is the answer for amount 7." },
    { q: "Which problem is a good fit for DP?", o: ["Find the maximum of a list", "Count the ways to climb n stairs taking 1 or 2 steps at a time", "Reverse a string", "Check if a number is even"], a: 1, why: "The count for n depends on the counts for n−1 and n−2, and those overlap: the hallmark of DP." },
  ],
  probs: ["dq-stairs", "dq-robber", "dq-coins", "dq-lis", "dq-lcs", "dq-knap"] },

{ id: "dsa-heap", title: "Heaps and greedy", mins: 45,
  body: `
<p>A <b>heap</b> keeps the smallest item instantly available. Adding an item or removing the smallest takes O(log n). In Python, <code>heapq</code> turns a normal list into a min-heap:</p>
<pre>import heapq
h = []
heapq.heappush(h, 5)
heapq.heappush(h, 1)
heapq.heappush(h, 3)
heapq.heappop(h)      # 1 (always the smallest)</pre>
<p>For a <b>max-heap</b>, push negative numbers. To sort by priority with data attached, push tuples: <code>(priority, item)</code>.</p>
<p><b>Top-k pattern:</b> keep a heap of size k. For the k largest items, use a min-heap and pop whenever it grows past k; the heap's smallest is then the kth largest. O(n log k) instead of sorting everything.</p>
<p><b>Greedy algorithms</b> make the locally best choice at each step and never look back. They're fast but only correct when you can argue that the local choice is always safe:</p>
<ul><li><b>Interval scheduling</b>: to fit the most meetings, always pick the one that ends earliest.</li>
<li><b>Jump game</b>: track the furthest index reachable so far.</li>
<li><b>Meeting rooms</b>: sort by start; a heap of end times tells you when a room frees up.</li></ul>
<p>Heaps also run Dijkstra's shortest path on weighted graphs and every task scheduler that serves "most urgent first".</p>`,
  watch: [["NeetCode · Heap / priority queue", "neetcode heap priority queue", "EN"], ["Apna College · Heaps & greedy (Hindi)", "apna college heap priority queue hindi", "HI"]],
  cheat: `<pre>import heapq
heapq.heapify(a)          O(n)   list -> heap in place
heapq.heappush(h, x)      O(log n)
heapq.heappop(h)          O(log n)  smallest
h[0]                      O(1)      peek smallest
heapq.nlargest(k, a)      heapq.nsmallest(k, a)
max-heap:   push -x, negate on pop
with data:  push (priority, tiebreak, item)

k largest:  push; if len(h) > k: heappop(h)   -> h[0] is kth largest
Greedy intervals: sort by END, take if start >= last_end</pre>`,
  tips: ["heapq only gives a min-heap. Negate values for a max-heap.", "Add a counter as a tiebreaker in tuples if items themselves can't be compared.", "Before trusting greedy, try to find a counter-example with 3-4 items.", "Sort-by-end-time is the greedy rule for 'maximum non-overlapping intervals'. Sort-by-start is for merging."],
  qs: [
    { q: "What does this print?", code: "import heapq\nh = []\nfor x in [5, 1, 8, 3]:\n    heapq.heappush(h, x)\nprint(heapq.heappop(h), heapq.heappop(h))", o: ["1 3", "8 5", "5 1", "1 5"], a: 0, out: true, why: "A min-heap always pops the smallest remaining item: 1, then 3." },
    { q: "What does this print?", code: "import heapq\nh = []\nfor x in [4, 1, 7, 3, 9]:\n    heapq.heappush(h, x)\n    if len(h) > 2:\n        heapq.heappop(h)\nprint(h[0])", o: ["7", "9", "1", "4"], a: 0, out: true, why: "Keeping only the 2 largest in a min-heap leaves [7, 9]; the top h[0] is the 2nd largest, 7." },
    { q: "How do you get max-heap behaviour from heapq?", o: ["heapq.maxheap()", "Push negative values and negate when popping", "Reverse the list", "Use heapq.heappop(h, reverse=True)"], a: 1, why: "The smallest negative is the largest original number." },
    { q: "Meetings (start, end): (1, 4), (2, 3), (3, 5). Greedy by earliest end time picks how many non-overlapping meetings?", o: ["1", "2", "3", "0"], a: 1, why: "Pick (2, 3) first (earliest end), then (3, 5) starts at 3 ≥ 3. (1, 4) overlaps both. Total 2." },
  ],
  probs: ["dq-kth", "dq-topk", "dq-rooms", "dq-jump", "dq-maxmeet"] },
];
